 бекеттер."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"8":{"kind":"sor","t":"Қайнау. Меншікті булану жылуы. Қайнау температурасының қысымға тәуелділігі. «Агрегаттық күйлер» бөлімі бойынша БЖБ № 2","hook":"Таудағы су неге 100 °C-тан төмен температурада қайнайды, ал қысымды қазандықта – жоғары?","dq":["Қайнау буланудан несімен ерекшеленеді?","Қалыпты қысымда су қандай температурада қайнайды?","Балқу жылуын қалай есептейді?"],"m":"жұппен жұмыс + график пен кестені талдау","act":"Жұптар судың қайнау температурасының қысымға тәуелділік графигі мен L кестесін талдап, Q = L·m формуласын қорытады.","t1":"жазбалары бар дайын график және Q = L·m есептеу үлгісі","t2":"үлгісіз график және кесте","t3":"қысымды қазандықтың жұмысын және таудағы судың қайнауын өздері түсіндіреді","s":["Қайнау температурасының қысымға тәуелділік графигін оқиды","L-дің физикалық мағынасын түсіндіреді: су үшін 2,3·10⁶ Дж/кг","Q = L·m формуласын қорытады"],"con":["Q = L·m – булану және конденсация кезіндегі жылу мөлшері; судың L-і = 2,3·10⁶ Дж/кг","Қайнау температурасы сыртқы қысым артқанда жоғарылайды","Қайнау кезінде сұйықтың температурасы тұрақты болады"],"tk":[["Мұз еріген кезде оның температурасы не болады? Түсіндіріңіз.","Тұрақты қалады: энергия кристалл торды бұзуға жұмсалады"],["0 °C-тағы 3 кг мұзды балқытуға қанша жылу қажет? (λ = 3,4·10⁵ Дж/кг)","Q = 3,4·10⁵·3 = 1,02·10⁶ Дж"],["100 °C-тағы 0,5 кг суды буға айналдыруға қанша жылу қажет? (L = 2,3·10⁶ Дж/кг)","Q = 2,3·10⁶·0,5 = 1,15·10⁶ Дж"],["Таудағы етті неге пісіру қиын?","Қысым төмен, су 100 °C-тан төмен температурада қайнайды"]],"hw":"«Агрегаттық күйлер» тақырыбын қайталау; термодинамиканың бірінші заңы бойынша параграф","res":"карточкалардағы график және кесте, БЖБ нұсқаларының карточкалары","live":"қысымды қазандық, таудағы тамақ әзірлеу, будағы үтік","cr":["Булану кезіндегі жылу мөлшерін анықтайды: «Берілгенін» жазады, СИ-ға аударады","Қайнау температурасының сыртқы қысымға тәуелділігін түсіндіреді","Бөлім бойынша (балқу, булану) есептерді дұрыс есептеп шығарады"],"sec":"8.1 В Агрегаттық күйлер (4 с)","goals":[{"c":"8.3.2.15","t":"меншікті булану жылуын анықтау"},{"c":"8.3.2.16","t":"қайнау температурасының сыртқы қысымға тәуелділігін түсіндіру"}],"compN":["Зерттеушілік ойлау (GreenComp)","Сыни ойлау (LifeComp)","Тәжірибе арқылы оқу (EntreComp)"],"stages":[{"tm":"0–3","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Таудағы су неге 100 °C-тан төмен температурада қайнайды, ал қысымды қазандықта – жоғары?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Қайнау буланудан несімен ерекшеленеді?","- Қалыпты қысымда су қандай температурада қайнайды?","- Балқу жылуын қалай есептейді?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"3–5","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"5–17","name":"3. Жаңа материалды меңгеру","tch":["**Scaffold оқыту әдісі:** жұппен жұмыс + график пен кестені талдау.","Жұптар судың қайнау температурасының қысымға тәуелділік графигі мен L кестесін талдап, Q = L·m формуласын қорытады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – жазбалары бар дайын график және Q = L·m есептеу үлгісі;","- **2-саты «Кеңес»** – үлгісіз график және кесте;","- **3-саты «Өздігінен»** – қысымды қазандықтың жұмысын және таудағы судың қайнауын өздері түсіндіреді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Қайнау температурасының қысымға тәуелділік графигін оқиды","L-дің физикалық мағынасын түсіндіреді: су үшін 2,3·10⁶ Дж/кг","Q = L·m формуласын қорытады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["карточкалардағы график және кесте, БЖБ нұсқаларының карточкалары"]},{"tm":"17–20","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Q = L·m – булану және конденсация кезіндегі жылу мөлшері; судың L-і = 2,3·10⁶ Дж/кг","- Қайнау температурасы сыртқы қысым артқанда жоғарылайды","- Қайнау кезінде сұйықтың температурасы тұрақты болады"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"20–40","name":"5. Бөлім бойынша жиынтық бағалау (БЖБ)","tch":["Бөлім бойынша жиынтық бағалауды ұйымдастырады (20 мин, жеке, 4 тапсырма, ең жоғары балл – 10). БЖБ тапсырмалары – қосымшада. Бұл кезеңде тіректер алынады."],"stu":["БЖБ тапсырмаларын өздігінен, кеңессіз орындайды."],"ass":["**Жиынтық.** Дескрипторлар бойынша балл (қосымша)."],"res":["БЖБ нұсқаларының карточкалары","Калькулятор","Шамалар кестелері"]},{"tm":"40–43","name":"6. Өзін-өзі тексеру. Үй тапсырмасы","tch":["Эталон мен критерийлерді таратады; оқушылар жауаптарын тексеріп, қателерін белгілейді. Баллды келесі сабақта хабарлайды.","**Үй тапсырмасы:** «Агрегаттық күйлер» тақырыбын қайталау; термодинамиканың бірінші заңы бойынша параграф."],"stu":["Жауаптарын эталонмен салыстырып, қателерін белгілейді.","Үй тапсырмасын жазады."],"ass":["**Өзін-өзі бағалау** эталон бойынша."],"res":["Жауап эталоны","Критерийлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Меншікті булану жылуын анықтау."],["Тақырыбы","Қайнау. Меншікті булану жылуы. Қайнау температурасының қысымға тәуелділігі. «Агрегаттық күйлер» бөлімі бойынша БЖБ № 2"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","карточкалардағы график және кесте, БЖБ нұсқаларының карточкалары"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","қысымды қазандық, таудағы тамақ әзірлеу, будағы үтік"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.8** Сыни ойлау (LifeComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Жұппен жұмыс + график пен кестені талдау."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; қорытынды – бөлім бойынша жиынтық бағалау (БЖБ); соңында – «Өзін-өзі талдау»."],["Қолдау қағидаты","Тірек біртіндеп алынады; БЖБ кезеңінде оқушылар өздігінен жұмыс істейді."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"9":{"kind":"new","t":"Термодинамиканың бірінші заңы. Газдың және будың жұмысы. Жылу процестерінің қайтымсыздығы. Термодинамиканың екінші заңы","hook":"Велосипед дөңгелегін үрлегенде сорғы қызады, біз оны қыздырмасақ та. Жылу қайдан пайда болады?","dq":["Ішкі энергия дегеніміз не?","Оны қандай екі тәсілмен өзгертуге болады?","Механикалық жұмыс дегеніміз не?"],"m":"ынтымақтастықта оқыту + демонстрациялық тәжірибелер","act":"Бекеттер: «Ауаны сығу» (тесігі жабық шприц немесе сорғы – қызу), «Будың жұмысы» (бу ағынымен құйынды айналдыру – мұғалімнің көрсетуі), «Қайтымсыздық» (боялған және таза суды араластыру, «сынған кесе» бейнетаспасын кері айналдыру).","t1":"Q = ΔU + A жазбасы және «газ нені алады, газ не істейді?» сұрақтары дайын бекет карточкалары","t2":"сұрақтары бар бекет карточкалары, формуланы оқушылар өздері жазады","t3":"бақылау негізінде заңды өздері тұжырымдап, қайтымсыз процестердің өз мысалдарын келтіреді","s":["Сығу кезіндегі ауаның қызуын бақылап, нәтижені түсіндіреді","Жылу процестері үшін энергияның сақталу заңын жазады: Q = ΔU + A","Қайтымсыз процестерге мысал келтіріп, екінші заңды тұжырымдайды"],"con":["Термодинамиканың бірінші заңы: Q = ΔU + A – газға берілген жылу ішкі энергияның өзгеруіне және газдың жұмысына жұмсалады","Ұлғайғанда газ жұмыс істейді, сығылғанда газға жұмыс істеледі, оның ішкі энергиясы артады","Екінші заң: жылу өздігінен тек ыстық денеден суық денеге беріледі; жылу процестері қайтымсыз"],"tk":[["Газға 500 Дж жылу берілді, газ 200 Дж жұмыс істеді. Ішкі энергия қалай өзгерді?","ΔU = Q − A = 500 − 200 = 300 Дж"],["Газды сыққанда оған 150 Дж жұмыс істелді, жылу алмасу жоқ. Ішкі энергия қалай өзгерді?","150 Дж-ға артты"],["Бөлмеде суып жатқан шәйнектегі шай неге өздігінен қызбайды?","Термодинамиканың екінші заңы: жылу өздігінен ыстық денеден суық денеге беріледі"],["Газ 300 Дж жылу алып, ұлғайып, 300 Дж жұмыс істеді. Оның температурасы қалай өзгерді?","ΔU = 0, температура өзгермеді"]],"hw":"тақырып бойынша параграф; тұрмыстағы қайтымсыз процестердің үш мысалын жазу","res":"шприц немесе сорғы, термометр, құйын, боялған су, бейнефрагмент","live":"дөңгелекті үрлеу, тоңазытқыштың жұмысы, шайдың суып қалуы","tb":"будың демонстрациясын тек мұғалім жүргізеді, оқушылар қашықтықты сақтайды","cr":["Термодинамиканың бірінші заңын түсіндіріп, Q = ΔU + A қолданады","Газдың ұлғаю және сығылу кезіндегі жұмысын сипаттайды","Термодинамиканың екінші заңын қайтымсыз процесс мысалымен түсіндіреді"],"sec":"8.2 А Термодинамика негіздері   ( 3с)","goals":[{"c":"8.3.2.17","t":"термодинамиканың бірінші заңының мағынасын түсіндіру"},{"c":"8.3.2.18","t":"термодинамиканың екінші заңының мағынасын түсіндіру"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Жүйелі ойлау (GreenComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Велосипед дөңгелегін үрлегенде сорғы қызады, біз оны қыздырмасақ та. Жылу қайдан пайда болады?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Ішкі энергия дегеніміз не?","- Оны қандай екі тәсілмен өзгертуге болады?","- Механикалық жұмыс дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): будың демонстрациясын тек мұғалім жүргізеді, оқушылар қашықтықты сақтайды."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + демонстрациялық тәжірибелер.","Бекеттер: «Ауаны сығу» (тесігі жабық шприц немесе сорғы – қызу), «Будың жұмысы» (бу ағынымен құйынды айналдыру – мұғалімнің көрсетуі), «Қайтымсыздық» (боялған және таза суды араластыру, «сынған кесе» бейнетаспасын кері айналдыру).","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – Q = ΔU + A жазбасы және «газ нені алады, газ не істейді?» сұрақтары дайын бекет карточкалары;","- **2-саты «Кеңес»** – сұрақтары бар бекет карточкалары, формуланы оқушылар өздері жазады;","- **3-саты «Өздігінен»** – бақылау негізінде заңды өздері тұжырымдап, қайтымсыз процестердің өз мысалдарын келтіреді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Сығу кезіндегі ауаның қызуын бақылап, нәтижені түсіндіреді","Жылу процестері үшін энергияның сақталу заңын жазады: Q = ΔU + A","Қайтымсыз процестерге мысал келтіріп, екінші заңды тұжырымдайды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["шприц немесе сорғы, термометр, құйын, боялған су, бейнефрагмент"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Термодинамиканың бірінші заңы: Q = ΔU + A – газға берілген жылу ішкі энергияның өзгеруіне және газдың жұмысына жұмсалады","- Ұлғайғанда газ жұмыс істейді, сығылғанда газға жұмыс істеледі, оның ішкі энергиясы артады","- Екінші заң: жылу өздігінен тек ыстық денеден суық денеге беріледі; жылу процестері қайтымсыз"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; тұрмыстағы қайтымсыз процестердің үш мысалын жазу;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Термодинамиканың бірінші заңының мағынасын түсіндіру."],["Тақырыбы","Термодинамиканың бірінші заңы. Газдың және будың жұмысы. Жылу процестерінің қайтымсыздығы. Термодинамиканың екінші заңы"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","шприц немесе сорғы, термометр, құйын, боялған су, бейнефрагмент"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","дөңгелекті үрлеу, тоңазытқыштың жұмысы, шайдың суып қалуы"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)","**g.4** Жүйелі ойлау (GreenComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + демонстрациялық тәжірибелер."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"10":{"kind":"new","t":"Жылу қозғалтқыштары. Жылу машиналарын пайдаланудағы экологиялық мәселелер","hook":"Автомобильдің, тепловоздың және жылу электр станциясының ортақ тұсы не?","dq":["Қандай энергия түрлерін білесіңдер?","Отын жанғанда не болады?","Газ жұмысты қалай істейді?"],"m":"ынтымақтастықта оқыту + модельдеу","act":"Бекеттер: «Іштен жану қозғалтқышы» (төрт тактінің анимациясы), «Бу турбинасы» (сызба, бу үстіндегі құйын), «Экология» (шығарындылар және оларды азайту жолдары карточкалары).","t1":"жазбалары бар сызбалар және такт тәртібі дайын","t2":"жазбасыз сызбалар, такт карточкаларын ретімен орналастыру керек","t3":"сызба бойынша жұмыс принципін өздері түсіндіріп, зиянды азайту жолдарын ұсынады","s":["Анимация бойынша ІЖҚ-ның төрт тактісін сипаттайды","Бу турбинасының жұмысын түсіндіреді","Жылу машиналарының қоршаған ортаға әсерін бағалайды"],"con":["Жылу қозғалтқышы отынның ішкі энергиясын механикалық жұмысқа айналдырады","ІЖҚ тактілері: жұту, сығу, жұмыс жүрісі, шығару; бу турбинасында бу роторды айналдырады","CO₂ мен зиянды заттардың шығарындылары ауаны ластайды; шешімі – сүзгілер, электромобильдер, жаңартылатын энергия"],"tk":[["Іштен жану қозғалтқышының тактілерін ретімен атаңыз.","Жұту, сығу, жұмыс жүрісі, шығару"],["ІЖҚ-да энергияның қандай түрленулері жүреді?","Отын энергиясы → газдың ішкі энергиясы → механикалық энергия"],["Қай тактіні жұмыс жүрісі дейді және неге?","Үшіншісі: ұлғайған газдар поршеньді итеріп, жұмыс істейді"],["Автомобильдердің ауаға зиянын азайтудың екі тәсілін ұсыныңыз.","Бейтараптандырғыштар, электромобильдер, қоғамдық көлік, газ отыны"]],"hw":"тақырып бойынша параграф; «Көліктің зиянын қалай азайтуға болады» шағын плакатын дайындау","res":"ІЖҚ анимациясы, турбина сызбалары, такт карточкалары, экология карточкалары","live":"автомобильдер, тепловоздар, ЖЭО, қаладағы ауа сапасы","cr":["Жылу машиналарындағы энергияның түрленуін сипаттайды","ІЖҚ мен бу турбинасының жұмыс принципін сипаттайды","Жылу машиналарының экологияға әсерін бағалап, шаралар ұсынады"],"sec":"8.2 А Термодинамика негіздері   ( 3с)","goals":[{"c":"8.3.2.22","t":"жылу қозғалтқыштарындағы энергияның түрленуін сипаттау"},{"c":"8.3.2.20","t":"іштен жану қозғалтқышының, бу турбинасының жұмыс істеу принципін сипаттау"}],"compN":["Табиғатты қорғау (GreenComp)","Жүйелі ойлау (GreenComp)","Ынтымақтастық (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Автомобильдің, тепловоздың және жылу электр станциясының ортақ тұсы не?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Қандай энергия түрлерін білесіңдер?","- Отын жанғанда не болады?","- Газ жұмысты қалай істейді?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + модельдеу.","Бекеттер: «Іштен жану қозғалтқышы» (төрт тактінің анимациясы), «Бу турбинасы» (сызба, бу үстіндегі құйын), «Экология» (шығарындылар және оларды азайту жолдары карточкалары).","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – жазбалары бар сызбалар және такт тәртібі дайын;","- **2-саты «Кеңес»** – жазбасыз сызбалар, такт карточкаларын ретімен орналастыру керек;","- **3-саты «Өздігінен»** – сызба бойынша жұмыс принципін өздері түсіндіріп, зиянды азайту жолдарын ұсынады.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Анимация бойынша ІЖҚ-ның төрт тактісін сипаттайды","Бу турбинасының жұмысын түсіндіреді","Жылу машиналарының қоршаған ортаға әсерін бағалайды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["ІЖҚ анимациясы, турбина сызбалары, такт карточкалары, экология карточкалары"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Жылу қозғалтқышы отынның ішкі энергиясын механикалық жұмысқа айналдырады","- ІЖҚ тактілері: жұту, сығу, жұмыс жүрісі, шығару; бу турбинасында бу роторды айналдырады","- CO₂ мен зиянды заттардың шығарындылары ауаны ластайды; шешімі – сүзгілер, электромобильдер, жаңартылатын энергия"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; «Көліктің зиянын қалай азайтуға болады» шағын плакатын дайындау;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Жылу қозғалтқыштарындағы энергияның түрленуін сипаттау."],["Тақырыбы","Жылу қозғалтқыштары. Жылу машиналарын пайдаланудағы экологиялық мәселелер"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","ІЖҚ анимациясы, турбина сызбалары, такт карточкалары, экология карточкалары"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","автомобильдер, тепловоздар, ЖЭО, қаладағы ауа сапасы"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.3** Табиғатты қорғау (GreenComp)","**g.4** Жүйелі ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + модельдеу."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"11":{"kind":"sor","t":"Жылу қозғалтқыштарының пайдалы әрекет коэффициенті. «Термодинамика негіздері» бөлімі бойынша БЖБ № 3","hook":"Қозғалтқыш отыннан 100 бірлік энергия алады, бірақ пайдалы жұмысқа тек бір бөлігі жұмсалады. Қалғаны қайда кетеді?","dq":["Жұмыс дегеніміз не және оны қалай өлшейді?","Термодинамиканың бірінші заңы нені көрсетеді?","ІЖҚ-ның қандай тактілері бар?"],"m":"жұппен жұмыс + деректер бойынша есептеу","act":"Жұптар қозғалтқыштардың деректерін (Q₁ – қыздырғыштан, Q₂ – суытқышқа) талдап, ПӘК формуласын қорытады.","t1":"энергия балансының дайын сызбасы және есептеу үлгісі","t2":"есептеу үлгісіз энергия балансының сызбасы","t3":"ПӘК-ті арттыру жолдарын өздері ұсынып, олардың әсерін бағалайды","s":["Пайдалы жұмысты A = Q₁ − Q₂ табады","ПӘК η = A/Q₁ · 100 % есептейді","ПӘК неге әрқашан 100 %-дан кіші екенін түсіндіреді"],"con":["η = (Q₁ − Q₂)/Q₁ · 100 %, мұндағы Q₁ – қыздырғыштан алынған жылу, Q₂ – суытқышқа берілген жылу","Жылу қозғалтқышының ПӘК-і жылу шығынына байланысты әрқашан 100 %-дан кіші","ПӘК-ті арттыру жолдары: үйкелісті азайту, қыздырғыш температурасын көтеру, жануды жақсарту"],"tk":[["Газ 400 Дж жылу алып, 150 Дж жұмыс істеді. Ішкі энергия қалай өзгерді?","ΔU = 400 − 150 = 250 Дж"],["ІЖҚ тактілерін атап, қайсысында газ жұмыс істейтінін көрсетіңіз.","Жұту, сығу, жұмыс жүрісі, шығару; газ жұмыс жүрісінде жұмыс істейді"],["Қозғалтқыш қыздырғыштан 500 кДж алып, суытқышқа 400 кДж берді. ПӘК-ті табыңыз.","η = (500 − 400)/500 · 100 % = 20 %"],["Жылу қозғалтқышының ПӘК-ін арттырудың екі жолын ұсынып, машиналардың табиғатқа зиянын бағалаңыз.","Үйкеліс пен жылу шығынын азайту, жануды жақсарту; шығарындылар ауаны ластап, жылыжай эффектісін күшейтеді"]],"hw":"«Электр заряды» тақырыбы бойынша параграф; тұрмыстағы электрленудің екі мысалын дайындау","res":"БЖБ нұсқаларының карточкалары, калькулятор","live":"автомобильдің отын шығыны, қозғалтқышты таңдау","cr":["Жылу қозғалтқышының ПӘК-ін формуламен анықтайды: «Берілгені», есептеу, өлшем бірлігі бар жауап","Жылу қозғалтқыштарын жетілдіру жолдарын ұсынады","Жылу машиналарының экологияға әсерін бағалап, бөлім есептерін (термодинамиканың бірінші заңы) шығарады"],"sec":"8.2 А Термодинамика негіздері   ( 3с)","goals":[{"c":"8.3.2.19","t":"жылу қозғалтқышының пайдалы әрекет коэффициентін анықтау"},{"c":"8.3.2.21","t":"жылу қозғалтқыштарын жетілдіру жолдарын ұсыну"},{"c":"8.3.2.23","t":"жылу машиналарының қоршаған ортаның экологиясына әсерін бағалау"}],"compN":["Жүйелі ойлау (GreenComp)","Табиғатты қорғау (GreenComp)","Сыни ойлау (LifeComp)"],"stages":[{"tm":"0–3","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Қозғалтқыш отыннан 100 бірлік энергия алады, бірақ пайдалы жұмысқа тек бір бөлігі жұмсалады. Қалғаны қайда кетеді?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Жұмыс дегеніміз не және оны қалай өлшейді?","- Термодинамиканың бірінші заңы нені көрсетеді?","- ІЖҚ-ның қандай тактілері бар?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"3–5","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"5–17","name":"3. Жаңа материалды меңгеру","tch":["**Scaffold оқыту әдісі:** жұппен жұмыс + деректер бойынша есептеу.","Жұптар қозғалтқыштардың деректерін (Q₁ – қыздырғыштан, Q₂ – суытқышқа) талдап, ПӘК формуласын қорытады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – энергия балансының дайын сызбасы және есептеу үлгісі;","- **2-саты «Кеңес»** – есептеу үлгісіз энергия балансының сызбасы;","- **3-саты «Өздігінен»** – ПӘК-ті арттыру жолдарын өздері ұсынып, олардың әсерін бағалайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Пайдалы жұмысты A = Q₁ − Q₂ табады","ПӘК η = A/Q₁ · 100 % есептейді","ПӘК неге әрқашан 100 %-дан кіші екенін түсіндіреді","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["БЖБ нұсқаларының карточкалары, калькулятор"]},{"tm":"17–20","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- η = (Q₁ − Q₂)/Q₁ · 100 %, мұндағы Q₁ – қыздырғыштан алынған жылу, Q₂ – суытқышқа берілген жылу","- Жылу қозғалтқышының ПӘК-і жылу шығынына байланысты әрқашан 100 %-дан кіші","- ПӘК-ті арттыру жолдары: үйкелісті азайту, қыздырғыш температурасын көтеру, жануды жақсарту"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"20–40","name":"5. Бөлім бойынша жиынтық бағалау (БЖБ)","tch":["Бөлім бойынша жиынтық бағалауды ұйымдастырады (20 мин, жеке, 4 тапсырма, ең жоғары балл – 10). БЖБ тапсырмалары – қосымшада. Бұл кезеңде тіректер алынады."],"stu":["БЖБ тапсырмаларын өздігінен, кеңессіз орындайды."],"ass":["**Жиынтық.** Дескрипторлар бойынша балл (қосымша)."],"res":["БЖБ нұсқаларының карточкалары","Калькулятор","Шамалар кестелері"]},{"tm":"40–43","name":"6. Өзін-өзі тексеру. Үй тапсырмасы","tch":["Эталон мен критерийлерді таратады; оқушылар жауаптарын тексеріп, қателерін белгілейді. Баллды келесі сабақта хабарлайды.","**Үй тапсырмасы:** «Электр заряды» тақырыбы бойынша параграф; тұрмыстағы электрленудің екі мысалын дайындау."],"stu":["Жауаптарын эталонмен салыстырып, қателерін белгілейді.","Үй тапсырмасын жазады."],"ass":["**Өзін-өзі бағалау** эталон бойынша."],"res":["Жауап эталоны","Критерийлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Жылу қозғалтқышының пайдалы әрекет коэффициентін анықтау."],["Тақырыбы","Жылу қозғалтқыштарының пайдалы әрекет коэффициенті. «Термодинамика негіздері» бөлімі бойынша БЖБ № 3"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","БЖБ нұсқаларының карточкалары, калькулятор"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","автомобильдің отын шығыны, қозғалтқышты таңдау"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.4** Жүйелі ойлау (GreenComp)","**g.3** Табиғатты қорғау (GreenComp)","**l.8** Сыни ойлау (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Жұппен жұмыс + деректер бойынша есептеу."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; қорытынды – бөлім бойынша жиынтық бағалау (БЖБ); соңында – «Өзін-өзі талдау»."],["Қолдау қағидаты","Тірек біртіндеп алынады; БЖБ кезеңінде оқушылар өздігінен жұмыс істейді."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"12":{"kind":"new","t":"Денелердің электрленуі. Электр заряды. Өткізгіштер мен диэлектриктер","hook":"Синтетикалық свитерді шешкенде шаш неге тік тұрады және сыртылдаған дыбыс шығады?","dq":["Атом қандай бөлшектерден тұрады?","Электрон дегеніміз не?","Найзағай туралы не білесіңдер?"],"m":"ынтымақтастықта оқыту + тәжірибелік бекет тер мен диэлектриктер» (заттардың өткізгіштігін тексеру).","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – «зарядтың алдында/кейін» кестесі және көмекші сұрақтары дайын бекет карточкалары;","- **2-саты «Кеңес»** – бекет карточкалары, кестені өздері толтырады;","- **3-саты «Өздігінен»** – заряд түрі туралы гипотезаны өздері құрып, тәжірибемен тексереді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Зарядталған денелердің тартылуы мен тебілуін бақылайды","Электрленуді электрондардың өтуімен түсіндіреді","Заттарды өткізгіштер мен диэлектриктерге жіктейді","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["эбонит және шыны таяқшалар, жүн, жібек, электроскоп, қағаз кесінділері, заттар жиынтығы"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Зарядтың екі түрі бар: оң және теріс; аттас зарядтар тебіледі, әртүрлі аттас зарядтар тартылады","- Электрлену – электрондардың қайта бөлінуі; үйкелгенде денелер әртүрлі аттас зарядтар алады","- Электрлену зиянды (ұшқын, кедергі) және пайдалы (сүзгілер, көшірме аппараттары) болуы мүмкін"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) егеніміз не?","- Күшті қандай бірлікпен өлшейді?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + PhET «Кулон заңы» симуляциясында зерттеу.","Топтар симуляцияда әрекеттесу күшінің заряд шамасына және арақашықтыққа тәуелділігін зерттеп, Кулон заңын қорытады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – қадамдық жоспар, дайын кесте және көмекші сұрақтары бар карточка;","- **2-саты «Кеңес»** – бос орындары бар жоспар, үлгісіз кесте;","- **3-саты «Өздігінен»** – өлшеулер сериясын өздері жоспарлап, заңды тұжырымдайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Заряд пен арақашықтықты өзгертіп, күшті жазады","F-тің q₁q₂-ге және r²-қа тәуелділігін анықтайды","Кулон заңы мен заряд сақталу заңын тұжырымдайды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["PhET «Кулон заңы» бар компьютерлер немесе планшеттер, жоспар карточкалары"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Тұйық жүйеде зарядтардың алгебралық қосындысы тұрақты: q₁ + q₂ = const","- F = k·q₁q₂/r², k = 9·10⁹ Н·м²/Кл²","- Элементар заряд e = 1,6·10⁻¹⁹ Кл – электронның модулі бойынша заряды"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; Кулон заңына екі есеп шығару;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Электр зарядының сақталу заңын түсіндіру."],["Тақырыбы","Электр зарядының сақталу заңы. Кулон заңы. Элементар электр заряды"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","PhET «Кулон заңы» бар компьютерлер немесе планшеттер, жоспар карточкалары"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","статикалық электр, сүзгілердің жұмыс принципі"],["№ 1 «Құзыреттілікті таңдаңыз»",["**d.20** Цифрлық технологияларды шығармашылықпен пайдалану (DigComp)","**g.9** Зерттеушілік ойлау (GreenComp)","**l.8** Сыни ойлау (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + PhET «Кулон заңы» симуляциясында зерттеу."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"14":{"kind":"new","t":"Электр өрісі. Электр өрісінің кернеулігі","hook":"Зарядталған таяқша қағаз кесінділеріне тимей-ақ оларды тартады. Әрекет қашықтыққа қалай беріледі?","dq":["Кулон заңы бойынша күш неге тең?","Вектор дегеніміз не?","Әртүрлі аттас зарядтар арасындағы күш қалай бағытталған?"],"m":"ынтымақтастықта оқыту + PhET «Зарядтар және өрістер» симуляциясында зерттеу","act":"Топтар симуляцияда нүктелік зарядтардың өрісін зерттеп, әртүрлі нүктелерде кернеулікті өлшеп, күш сызықтарын сызады.","t1":"қадамдық тапсырма және сызықтарды сызудың дайын үлгісі бар карточка","t2":"кеңестері бар тапсырма, үлгі жоқ","t3":"зарядтардың орналасуын өздері таңдап, өріс суретін салып, түсіндіреді","s":["Симуляцияда кернеулікті өлшейді","Оң және теріс зарядтың күш сызықтарын сызады","Өрістегі зарядқа әсер ететін күшті есептейді"],"con":["Электр өрісі – материяның ерекше түрі, зарядтар өріс арқылы әрекеттеседі","E = F/q, бірлігі – Н/Кл; біртекті өрісте F = q·E","Күш сызықтары оң зарядтан басталып, теріс зарядта аяқталады; олардың тығыздығы E модулін көрсетеді"],"tk":[["Өріс нүктесінде 2·10⁻⁸ Кл зарядқа 4·10⁻⁶ Н күш әсер етеді. Кернеулікті табыңыз.","E = 4·10⁻⁶/2·10⁻⁸ = 200 Н/Кл"],["Өріс кернеулігі 500 Н/Кл. 3·10⁻⁶ Кл зарядқа әсер ететін күшті табыңыз.","F = 500·3·10⁻⁶ = 1,5·10⁻³ Н"],["Оң нүктелік заряд өрісінің күш сызықтарын бейнелеңіз.","Сызықтар зарядтан радиал бағытта шығады"],["Жоғары бағытталған өрістегі электронға әсер ететін күш қалай бағытталған?","Төмен, өйткені электрон заряды теріс"]],"hw":"тақырып бойынша параграф; екі әртүрлі аттас зарядтың өріс сызықтарын салу","res":"PhET «Зарядтар және өрістер» бар компьютерлер немесе планшеттер, тапсырма карточкалары","live":"найзағайотқыш, аспаптарды экрандау","cr":["Электр өрісінің физикалық мағынасын түсіндіріп, кернеулікті анықтайды","Біртекті өрістегі зарядқа әсер ететін күшті есептейді","Электр өрісін күш сызықтарымен бейнелейді"],"sec":"8.2 В Электростатика негіздері (4 с)","goals":[{"c":"8.4.1.6","t":"электр өрісі ұғымының физикалық мағынасын түсіндіру және оның күштік сипаттамасын анықтау"},{"c":"8.4.1.7","t":"біртекті электростатикалық өрістегі зарядқа әсер етуші күшті есептеу"},{"c":"8.4.1.8","t":"электр өрісін күш сызықтары арқылы графиктік кескіндеу"}],"compN":["Цифрлық технологияларды шығармашылықпен пайдалану (DigComp)","Зерттеушілік ойлау (GreenComp)","Сыни ойлау (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Зарядталған таяқша қағаз кесінділеріне тимей-ақ оларды тартады. Әрекет қашықтыққа қалай беріледі?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Кулон заңы бойынша күш неге тең?","- Вектор дегеніміз не?","- Әртүрлі аттас зарядтар арасындағы күш қалай бағытталған?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + PhET «Зарядтар және өрістер» симуляциясында зерттеу.","Топтар симуляцияда нүктелік зарядтардың өрісін зерттеп, әртүрлі нүктелерде кернеулікті өлшеп, күш сызықтарын сызады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – қадамдық тапсырма және сызықтарды сызудың дайын үлгісі бар карточка;","- **2-саты «Кеңес»** – кеңестері бар тапсырма, үлгі жоқ;","- **3-саты «Өздігінен»** – зарядтардың орналасуын өздері таңдап, өріс суретін салып, түсіндіреді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Симуляцияда кернеулікті өлшейді","Оң және теріс зарядтың күш сызықтарын сызады","Өрістегі зарядқа әсер ететін күшті есептейді","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["PhET «Зарядтар және өрістер» бар компьютерлер немесе планшеттер, тапсырма карточкалары"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Электр өрісі – материяның ерекше түрі, зарядтар өріс арқылы әрекеттеседі","- E = F/q, бірлігі – Н/Кл; біртекті өрісте F = q·E","- Күш сызықтары оң зарядтан басталып, теріс зарядта аяқталады; олардың тығыздығы E модулін көрсетеді"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; екі әртүрлі аттас зарядтың өріс сызықтарын салу;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Электр өрісі ұғымының физикалық мағынасын түсіндіру және оның күштік сипаттамасын анықтау."],["Тақырыбы","Электр өрісі. Электр өрісінің кернеулігі"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","PhET «Зарядтар және өрістер» бар компьютерлер немесе планшеттер, тапсырма карточкалары"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","найзағайотқыш, аспаптарды экрандау"],["№ 1 «Құзыреттілікті таңдаңыз»",["**d.20** Цифрлық технологияларды шығармашылықпен пайдалану (DigComp)","**g.9** Зерттеушілік ойлау (GreenComp)","**l.8** Сыни ойлау (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + PhET «Зарядтар және өрістер» симуляциясында зерттеу."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"15":{"kind":"new","t":"Электр өрісінің потенциалы және потенциалдар айырымы","hook":"Су биіктіктер айырымы болғанша төмен ағады. Зарядтарды не қозғалтады?","dq":["Күштің жұмысы дегеніміз не?","Өріс кернеулігі дегеніміз не?","Жұмысты қандай бірлікпен өлшейді?"],"m":"ынтымақтастықта оқыту + аналогия бойынша модельдеу","act":"Топтар электр өрісін ауырлық күші өрісімен (биіктіктер айырымы мен потенциалдар айырымы) салыстырып, қорытындыны PhET-те тексереді.","t1":"мысалдары дайын «биіктік – потенциал» ұқсастық кестесі","t2":"ұқсастық кестесі, мысалдарды өздері іздейді","t3":"ұқсастықты өздері құрып, U = E·d байланысын қорытады","s":["Ұқсастықтағы шамаларды салыстырады","U = A/q формуласын қорытады","Біртекті өрісте U = E·d қолданады"],"con":["Потенциал φ = W/q; потенциалдар айырымы (кернеу) U = φ₁ − φ₂ = A/q","1 В = 1 Дж/Кл","Біртекті өрісте U = E·d"],"tk":[["Өріс 3 Кл зарядты орын ауыстырғанда 12 Дж жұмыс істеді. Кернеуді табыңыз.","U = 12/3 = 4 В"],["Потенциалдар айырымы 100 В нүктелер арасында 2·10⁻⁶ Кл зарядты орын ауыстырғанда өріс қандай жұмыс істейді?","A = qU = 2·10⁻⁴ Дж"],["Өріс кернеулігі 500 В/м, арақашықтық 0,02 м. Потенциалдар айырымын табыңыз.","U = 500·0,02 = 10 В"],["«Потенциалдар айырымы 1 вольт» нені білдіреді?","Өріс 1 Кл зарядты орын ауыстырғанда 1 Дж жұмыс істейді"]],"hw":"тақырып бойынша параграф; U = A/q формуласына екі есеп шығару","res":"ұқсастық карточкалары, PhET симуляциясы бар компьютерлер","live":"батарейка, розеткадағы кернеу","cr":["Потенциал мен потенциалдар айырымының физикалық мағынасын түсіндіреді","Өріс жұмысы мен кернеуді формулалармен есептейді","Есепте U = E·d қолданады"],"sec":"8.2 В Электростатика негіздері (4 с)","goals":[{"c":"8.4.1.9","t":"потенциалдар айырымының және потенциалдың физикалық мағынасын түсіндіру"}],"compN":["Жүйелі ойлау (GreenComp)","Зерттеушілік ойлау (GreenComp)","Сыни ойлау (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Су биіктіктер айырымы болғанша төмен ағады. Зарядтарды не қозғалтады?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Күштің жұмысы дегеніміз не?","- Өріс кернеулігі дегеніміз не?","- Жұмысты қандай бірлікпен өлшейді?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + аналогия бойынша модельдеу.","Топтар электр өрісін ауырлық күші өрісімен (биіктіктер айырымы мен потенциалдар айырымы) салыстырып, қорытындыны PhET-те тексереді.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – мысалдары дайын «биіктік – потенциал» ұқсастық кестесі;","- **2-саты «Кеңес»** – ұқсастық кестесі, мысалдарды өздері іздейді;","- **3-саты «Өздігінен»** – ұқсастықты өздері құрып, U = E·d байланысын қорытады.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Ұқсастықтағы шамаларды салыстырады","U = A/q формуласын қорытады","Біртекті өрісте U = E·d қолданады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["ұқсастық карточкалары, PhET симуляциясы бар компьютерлер"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Потенциал φ = W/q; потенциалдар айырымы (кернеу) U = φ₁ − φ₂ = A/q","- 1 В = 1 Дж/Кл","- Біртекті өрісте U = E·d"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; U = A/q формуласына екі есеп шығару;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Потенциалдар айырымының және потенциалдың физикалық мағынасын түсіндіру."],["Тақырыбы","Электр өрісінің потенциалы және потенциалдар айырымы"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","ұқсастық карточкалары, PhET симуляциясы бар компьютерлер"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","батарейка, розеткадағы кернеу"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.4** Жүйелі ойлау (GreenComp)","**g.9** Зе йта ажырады. Әрқайсысының заряды қандай?","(3 − 1)/2 = +1 мкКл"],["3·10⁻⁷ Кл зарядқа 6·10⁻⁵ Н күш әсер етсе, өріс кернеулігін табыңыз.","E = 6·10⁻⁵/3·10⁻⁷ = 200 Н/Кл"],["Конденсатордың құрылысын сипаттап, қолданылуына мысал келтіріңіз.","Арасында диэлектрик бар екі өткізгіш астар; мысалы, фотожарқыл"]],"hw":"«Электр тогы» параграфы; электр тізбегі элементтерінің шартты белгілерін қайталау","res":"жазық конденсатордың моделі немесе суреті, БЖБ нұсқаларының карточкалары","live":"фотожарқыл, қуат блоктары, аудиотехника","cr":["Конденсатордың құрылысы мен міндетін сипаттайды","Бөлім есептерінде Кулон заңы мен кернеулік ұғымын қолданады","Бөлім есептерін дұрыс есептеп, өлшем бірлігімен шығарады"],"sec":"8.2 В Электростатика негіздері (4 с)","goals":[{"c":"8.4.1.10","t":"конденсаторлардың құрылысын және қолданылуын сипаттау"}],"compN":["Сыни ойлау (LifeComp)","Зерттеушілік ойлау (GreenComp)","Цифрлық технологияларды шығармашылықпен пайдалану (DigComp)"],"stages":[{"tm":"0–3","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Фотоаппараттың жарқылы батареясы әлсіз болса да лезде жанады. Жарқылға энергияны не жинайды?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Электр заряды дегеніміз не?","- Потенциалдар айырымы дегеніміз не?","- Қандай заттар диэлектрик болады?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"3–5","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"5–17","name":"3. Жаңа материалды меңгеру","tch":["**Scaffold оқыту әдісі:** жұппен жұмыс + құрылысты талдау.","Жұптар жазық конденсатордың құрылысын (бөлшектелетін модель немесе сурет бойынша) зерттеп, C = q/U электр сыйымдылығын қорытып, қолданылуын табады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – бөліктері жазылған сурет және C = q/U есептеу үлгісі;","- **2-саты «Кеңес»** – жазбасыз сурет, үлгісіз формула;","- **3-саты «Өздігінен»** – сыйымдылықтың пластиналар ауданы мен арақашықтыққа тәуелділігін өздері түсіндіреді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Конденсатор бөліктерін атайды: екі астар, арасында диэлектрик","C = q/U есептейді; 1 Ф = 1 Кл/В","Конденсаторларды қолдануға мысал келтіреді","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["жазық конденсатордың моделі немесе суреті, БЖБ нұсқаларының карточкалары"]},{"tm":"17–20","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Конденсатор – диэлектрикпен бөлінген екі өткізгіш (астар); заряд пен энергия жинайды","- C = q/U; электрсыйымдылықтың бірлігі – фарад (Ф)","- Қолданылуы: фотожарқыл, қуат блоктарындағы сүзгілер, радиотехника"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"20–40","name":"5. Бөлім бойынша жиынтық бағалау (БЖБ)","tch":["Бөлім бойынша жиынтық бағалауды ұйымдастырады (20 мин, жеке, 4 тапсырма, ең жоғары балл – 10). БЖБ тапсырмалары – қосымшада. Бұл кезеңде тіректер алынады."],"stu":["БЖБ тапсырмаларын өздігінен, кеңессіз орындайды."],"ass":["**Жиынтық.** Дескрипторлар бойынша балл (қосымша)."],"res":["БЖБ нұсқаларының карточкалары","Калькулятор","Шамалар кестелері"]},{"tm":"40–43","name":"6. Өзін-өзі тексеру. Үй тапсырмасы","tch":["Эталон мен критерийлерді таратады; оқушылар жауаптарын тексеріп, қателерін белгілейді. Баллды келесі сабақта хабарлайды.","**Үй тапсырмасы:** «Электр тогы» параграфы; электр тізбегі элементтерінің шартты белгілерін қайталау."],"stu":["Жауаптарын эталонмен салыстырып, қателерін белгілейді.","Үй тапсырмасын жазады."],"ass":["**Өзін-өзі бағалау** эталон бойынша."],"res":["Жауап эталоны","Критерийлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Конденсаторлардың құрылысын және қолданылуын сипаттау."],["Тақырыбы","Конденсатор. «Электростатика негіздері» бөлімі бойынша БЖБ № 4"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың
