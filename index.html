ер қозғалысының кинетикалық энергиясы мен олардың әрекеттесуінің потенциалдық энергиясының қосындысы; оны жұмыс жасау және жылу беру арқылы өзгертеді","Жылу беру түрлері: жылуөткізгіштік, конвекция, сәуле шығару","Қолданылуы: термос, терезе астындағы радиаторлар, жануарлардың түгі мен май қабаты"],"tk":[["Ішкі энергияны өзгерту тәсілі қандай: а) қасықтың шайда қызуы; б) алақанның үйкеліс кезінде қызуы?","а) жылу беру; б) жұмыс жасау"],["Күн энергиясы Жерге жылу берілудің қай түрімен жетеді?","Сәуле шығарумен, өйткені ғарышта зат жоқ"],["Неге жылыту радиаторларын терезенің астына орнатады?","Конвекция: жылы ауа көтеріледі, суық ауа төмен түседі, ауа араласады"],["Жануарлардың суыққа және ыстыққа бейімделуінің бір-бір мысалын келтіріңіз.","Суық: қалың түк, май қабаты, қысқы ұйқы; ыстық: үлкен құлақтар, апан қазу"]],"hw":"«жылу беру түрі – тұрмыстағы мысал – табиғаттағы мысал» кестесін құрау","res":"металл, ағаш, пластик қасықтар; ыстық су құйылған стақан; шам; түрлі-түсті қағаз; секундомер","live":"термос, радиаторлар, маусымға сай киім; музыкалық аспаптарды радиатордың жанында сақтауға болмайды","tb":"ыстық суды абайлап тасымалдау, шам қағазға тимеуі тиіс","cr":["Ішкі энергияны өзгерту тәсілдерін сипаттап, әрқайсысына мысал келтіреді","Жылу берілудің үш түрін салыстырады","Техникада жылу берілуді қолдануға және ағзалардың температураға бейімделуіне мысал келтіреді"],"sec":"8.1 A Жылу құбылыстары (5 с)","goals":[{"c":"8.3.2.1","t":"дененің ішкі энергиясын өзгерту тәсілдерін сипаттау"},{"c":"8.3.2.2","t":"жылу берілудің түрлерін салыстыру"},{"c":"8.3.2.3","t":"техникада және тұрмыста жылу беру түрлерінің қолданылуына мысалдар келтіру"},{"c":"8.3.2.4","t":"әр түрлі температураларда тірі ағзалардың бейімделуіне мысалдар келтіру"}],"compN":["Ынтымақтастық (LifeComp)","Зерттеушілік ойлау (GreenComp)","Тәжірибе арқылы оқу (EntreComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Ыстық шайдағы металл қасық қызады, ал шай салқындайды. Энергия бір денеден екіншісіне қалай беріледі?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Кинетикалық энергия дегеніміз не?","- Бөлшектердің қозғалыс жылдамдығы неге байланысты?","- Дененің қызуына мысал келтіріңіз","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): ыстық суды абайлап тасымалдау, шам қағазға тимеуі тиіс."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + тәжірибелік бекеттер.","Бекеттер: «Жылуөткізгіштік» (ыстық судағы металл, ағаш және пластик қасықтар), «Конвекция» (ыстық су үстіндегі қағаз құйын), «Сәуле шығару» (алақан шамның жанында, қара және ақ қағаз), «Жұмыс» (алақандарды ысқылау).","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – «не қызады – қандай тәсілмен» кестесі дайын бекет карточкалары;","- **2-саты «Кеңес»** – үлгісіз кестесі бар бекет карточкалары;","- **3-саты «Өздігінен»** – жылу берілудің бір түріне өз тәжірибесін ойлап тауып, көрсетеді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Әртүрлі материалдан жасалған қасықтардың қызуын бақылайды","Ішкі энергияны өзгерту тәсілін анықтайды: жұмыс немесе жылу беру","Жылу берілудің үш түрін кестеде салыстырады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["металл, ағаш, пластик қасықтар; ыстық су құйылған стақан; шам; түрлі-түсті қағаз; секундомер"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Ішкі энергия – бөлшектер қозғалысының кинетикалық энергиясы мен олардың әрекеттесуінің потенциалдық энергиясының қосындысы; оны жұмыс жасау және жылу беру арқылы өзгертеді","- Жылу беру түрлері: жылуөткізгіштік, конвекция, сәуле шығару","- Қолданылуы: термос, терезе астындағы радиаторлар, жануарлардың түгі мен май қабаты"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: «жылу беру түрі – тұрмыстағы мысал – табиғаттағы мысал» кестесін құрау;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Дененің ішкі энергиясын өзгерту тәсілдерін сипаттау."],["Тақырыбы","Ішкі энергия. Ішкі энергияны өзгерту тәсілдері. Жылу берілу түрлері"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","металл, ағаш, пластик қасықтар; ыстық су құйылған стақан; шам; түрлі-түсті қағаз; секундомер"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","термос, радиаторлар, маусымға сай киім; музыкалық аспаптарды радиатордың жанында сақтауға болмайды"],["№ 1 «Құзыреттілікті таңдаңыз»",["**l.6** Ынтымақтастық (LifeComp)","**g.9** Зерттеушілік ойлау (GreenComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + тәжірибелік бекеттер."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"3":{"kind":"new","t":"Жылу мөлшері. Заттың меншікті жылусыйымдылығы","hook":"Жағажайдағы құм ыстық, ал жанындағы су салқын, Күн оларды бірдей қыздырса да. Неліктен?","dq":["Энергияны қандай бірлікпен өлшейді?","Дененің массасын қалай өлшейді?","Қыздыру мен температура қалай байланысты?"],"m":"ынтымақтастықта оқыту + тәжірибе деректері бойынша зерттеу","act":"Мұғалім бірдей массалы су мен майды бір қыздырғышпен қыздыруды көрсетеді. Топтар деректерді талдап, жылу мөлшері неге (m, Δt, зат) байланысты екенін анықтайды.","t1":"тәжірибе деректерінің кестесі және «не өзгерді, не тұрақты қалды?» деген көмекші сұрақтар","t2":"сұрақсыз тәжірибе деректерінің кестесі","t3":"Q-дің m, Δt және затқа тәуелділігін тексеру үшін қандай шамаларды өзгертуді өздері жоспарлайды","s":["Деректерді талдап, Q-дің m, Δt және затқа тәуелділігін табады","«судың с-ы 4200 Дж/(кг·°C)» дегенді түсіндіреді","Q = c·m·(t₂ − t₁) формуласын қорытады"],"con":["Q = c·m·(t₂ − t₁); жылу мөлшерінің бірлігі – джоуль (Дж)","Меншікті жылусыйымдылығы c – 1 кг заттың температурасын 1 °C-қа өзгертуге қажетті жылу мөлшері; су үшін 4200 Дж/(кг·°C)","Судың жылусыйымдылығы үлкен болғандықтан, теңіздер климатты жұмсартады"],"tk":[["2 кг суды 20 °C-тан 70 °C-қа дейін қыздыруға қанша жылу мөлшері қажет? (c = 4200 Дж/(кг·°C))","Q = 4200·2·50 = 420 000 Дж = 420 кДж"],["Мыстың меншікті жылусыйымдылығы 400 Дж/(кг·°C) дегеніміз не?","1 кг мысты 1 °C-қа қыздыруға 400 Дж қажет"],["Массасы 0,5 кг алюминий кәстрөл 20 °C-тан 100 °C-қа дейін қызды. Ол қанша жылу алды? (c = 920 Дж/(кг·°C))","Q = 920·0,5·80 = 36 800 Дж"],["Неліктен суды жылыту жүйелерінде қолданады?","Жылусыйымдылығы үлкен: су температурасы аздап өзгергенде көп энергия тасымалдайды"]],"hw":"тақырып бойынша параграф; Q = c·m·Δt формуласына екі есеп шығару","res":"қыздырғыш, екі стақан, су және май, термометрлер, меншікті жылусыйымдылық кестесі","live":"теңіз маңындағы климат, ыдыс материалын таңдау","tb":"ыстық заттарды абайлап ұстау","cr":["Жылу мөлшерін формуламен анықтайды («Берілгені» жазады, СИ-ға аударады, есептейді)","Меншікті жылусыйымдылықтың физикалық мағынасын мысалмен түсіндіреді","Заттарды меншікті жылусыйымдылық кестесі бойынша салыстырады"],"sec":"8.1 A Жылу құбылыстары (5 с)","goals":[{"c":"8.3.2.5","t":"жылу алмасу процесі кезінде алған немесе берген жылу мөлшерін анықтау"},{"c":"8.3.2.6","t":"заттың меншікті жылусыйымдылығының мағынасын түсіндіру"}],"compN":["Зерттеушілік ойлау (GreenComp)","Сыни ойлау (LifeComp)","Жүйелі ойлау (GreenComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Жағажайдағы құм ыстық, ал жанындағы су салқын, Күн оларды бірдей қыздырса да. Неліктен?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Энергияны қандай бірлікпен өлшейді?","- Дененің массасын қалай өлшейді?","- Қыздыру мен температура қалай байланысты?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): ыстық заттарды абайлап ұстау."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + тәжірибе деректері бойынша зерттеу.","Мұғалім бірдей массалы су мен майды бір қыздырғышпен қыздыруды көрсетеді. Топтар деректерді талдап, жылу мөлшері неге (m, Δt, зат) байланысты екенін анықтайды.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – тәжірибе деректерінің кестесі және «не өзгерді, не тұрақты қалды?» деген көмекші сұрақтар;","- **2-саты «Кеңес»** – сұрақсыз тәжірибе деректерінің кестесі;","- **3-саты «Өздігінен»** – Q-дің m, Δt және затқа тәуелділігін тексеру үшін қандай шамаларды өзгертуді өздері жоспарлайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Деректерді талдап, Q-дің m, Δt және затқа тәуелділігін табады","«судың с-ы 4200 Дж/(кг·°C)» дегенді түсіндіреді","Q = c·m·(t₂ − t₁) формуласын қорытады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["қыздырғыш, екі стақан, су және май, термометрлер, меншікті жылусыйымдылық кестесі"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Q = c·m·(t₂ − t₁); жылу мөлшерінің бірлігі – джоуль (Дж)","- Меншікті жылусыйымдылығы c – 1 кг заттың температурасын 1 °C-қа өзгертуге қажетті жылу мөлшері; су үшін 4200 Дж/(кг·°C)","- Судың жылусыйымдылығы үлкен болғандықтан, теңіздер климатты жұмсартады"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; Q = c·m·Δt формуласына екі есеп шығару;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Жылу алмасу процесі кезінде алған немесе берген жылу мөлшерін анықтау."],["Тақырыбы","Жылу мөлшері. Заттың меншікті жылусыйымдылығы"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","қыздырғыш, екі стақан, су және май, термометрлер, меншікті жылусыйымдылық кестесі"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","теңіз маңындағы климат, ыдыс материалын таңдау"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.8** Сыни ойлау (LifeComp)","**g.4** Жүйелі ойлау (GreenComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + тәжірибе деректері бойынша зерттеу."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"4":{"kind":"sor","t":"Отынның энергиясы. Отынның меншікті жану жылуы. «Жылу құбылыстары» бөлімі бойынша БЖБ № 1","hook":"Жылыту үшін қайсысы тиімді: отын-ағаш, көмір немесе табиғи газ? Мұны қалай салыстыруға болады?","dq":["Отын жанғанда не болады?","Қыздыру кезінде Q, m және Δt қандай формуламен байланысады?","Отын түрлерін атаңыз"],"m":"жұппен жұмыс + кестені талдау","act":"Жұптар отын-ағаш, көмір, бензин және газдың меншікті жану жылуын кесте бойынша салыстырып, Q = q·m формуласын қорытады.","t1":"q кестесі және бір отынға есептеудің дайын үлгісі","t2":"үлгісіз q кестесі және формула","t3":"отынды өздері таңдап, таңдауын негіздейді (энергия және экология)","s":["Әртүрлі отынның q-ын салыстырады (отын-ағаш 1·10⁷, көмір 2,7·10⁷, бензин 4,6·10⁷, газ 4,4·10⁷ Дж/кг)","q-дың физикалық мағынасын түсіндіреді","Q = q·m формуласын қорытады"],"con":["Q = q·m – отын толық жанғанда бөлінетін жылу мөлшері; q – меншікті жану жылуы, Дж/кг","q неғұрлым үлкен болса, 1 кг отын соғұрлым көп энергия бөледі","Отынды жағу атмосфераны ластайды, сондықтан экологиялық таза энергия көздері қажет"],"tk":[["Жылу берудің үш түрін атап, әрқайсысына мысал келтіріңіз.","Жылуөткізгіштік – шайдағы қасық; конвекция – радиатор; сәуле шығару – Күн"],["50 °C-ты кельвинге, 350 К-ді °C-қа аударыңыз.","323 К; 77 °C"],["3 кг суды 15 °C-тан 65 °C-қа дейін қыздыру үшін қанша жылу мөлшері қажет? (c = 4200 Дж/(кг·°C))","Q = 4200·3·50 = 630 000 Дж = 630 кДж"],["2 кг тас көмір толық жанғанда қанша жылу бөлінеді? (q = 2,7·10⁷ Дж/кг)","Q = 2,7·10⁷·2 = 5,4·10⁷ Дж = 54 МДж"]],"hw":"№ 1 зертханалық жұмысқа дайындалу үшін Q = c·m·Δt формуласын және жылулық тепе-теңдік теңдеуін қайталау","res":"меншікті жану жылуының кестесі, БЖБ нұсқаларының карточкалары","live":"жылыту, отын таңдау, қала экологиясы","cr":["Q = q·m формуласын қолданады: «Берілгенін» жазады, СИ-ға аударады","Есепті дұрыс есептеп, жауабын өлшем бірлігімен жазады","Қыздыру және жылу беру бойынша есептерді шығарады (бөлім бойынша)"],"sec":"8.1 A Жылу құбылыстары (5 с)","goals":[{"c":"8.3.2.7","t":"отынның жануы кезінде бөлінген жылу мөлшерін анықтау. Отынның жануы кезінде бөлінген жылу мөлшерінің формуласын есептер шығаруда қолдану"}],"compN":["Табиғатты қорғау (GreenComp)","Этикалық және тұрақты ойлау (EntreComp)","Сыни ойлау (LifeComp)"],"stages":[{"tm":"0–3","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Жылыту үшін қайсысы тиімді: отын-ағаш, көмір немесе табиғи газ? Мұны қалай салыстыруға болады?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Отын жанғанда не болады?","- Қыздыру кезінде Q, m және Δt қандай формуламен байланысады?","- Отын түрлерін атаңыз","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"3–5","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"5–17","name":"3. Жаңа материалды меңгеру","tch":["**Scaffold оқыту әдісі:** жұппен жұмыс + кестені талдау.","Жұптар отын-ағаш, көмір, бензин және газдың меншікті жану жылуын кесте бойынша салыстырып, Q = q·m формуласын қорытады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – q кестесі және бір отынға есептеудің дайын үлгісі;","- **2-саты «Кеңес»** – үлгісіз q кестесі және формула;","- **3-саты «Өздігінен»** – отынды өздері таңдап, таңдауын негіздейді (энергия және экология).","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Әртүрлі отынның q-ын салыстырады (отын-ағаш 1·10⁷, көмір 2,7·10⁷, бензин 4,6·10⁷, газ 4,4·10⁷ Дж/кг)","q-дың физикалық мағынасын түсіндіреді","Q = q·m формуласын қорытады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["меншікті жану жылуының кестесі, БЖБ нұсқаларының карточкалары"]},{"tm":"17–20","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Q = q·m – отын толық жанғанда бөлінетін жылу мөлшері; q – меншікті жану жылуы, Дж/кг","- q неғұрлым үлкен болса, 1 кг отын соғұрлым көп энергия бөледі","- Отынды жағу атмосфераны ластайды, сондықтан экологиялық таза энергия көздері қажет"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"20–40","name":"5. Бөлім бойынша жиынтық бағалау (БЖБ)","tch":["Бөлім бойынша жиынтық бағалауды ұйымдастырады (20 мин, жеке, 4 тапсырма, ең жоғары балл – 10). БЖБ тапсырмалары – қосымшада. Бұл кезеңде тіректер алынады."],"stu":["БЖБ тапсырмаларын өздігінен, кеңессіз орындайды."],"ass":["**Жиынтық.** Дескрипторлар бойынша балл (қосымша)."],"res":["БЖБ нұсқаларының карточкалары","Калькулятор","Шамалар кестелері"]},{"tm":"40–43","name":"6. Өзін-өзі тексеру. Үй тапсырмасы","tch":["Эталон мен критерийлерді таратады; оқушылар жауаптарын тексеріп, қателерін белгілейді. Баллды келесі сабақта хабарлайды.","**Үй тапсырмасы:** № 1 зертханалық жұмысқа дайындалу үшін Q = c·m·Δt формуласын және жылулық тепе-теңдік теңдеуін қайталау."],"stu":["Жауаптарын эталонмен салыстырып, қателерін белгілейді.","Үй тапсырмасын жазады."],"ass":["**Өзін-өзі бағалау** эталон бойынша."],"res":["Жауап эталоны","Критерийлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Отынның жануы кезінде бөлінген жылу мөлшерін анықтау. Отынның жануы кезінде бөлінген жылу мөлшерінің формуласын есептер шығаруда қолдану."],["Тақырыбы","Отынның энергиясы. Отынның меншікті жану жылуы. «Жылу құбылыстары» бөлімі бойынша БЖБ № 1"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","меншікті жану жылуының кестесі, БЖБ нұсқаларының карточкалары"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","жылыту, отын таңдау, қала экологиясы"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.3** Табиғатты қорғау (GreenComp)","**e.5** Этикалық және тұрақты ойлау (EntreComp)","**l.8** Сыни ойлау (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Жұппен жұмыс + кестені талдау."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; қорытынды – бөлім бойынша жиынтық бағалау (БЖБ); соңында – «Өзін-өзі талдау»."],["Қолдау қағидаты","Тірек біртіндеп алынады; БЖБ кезеңінде оқушылар өздігінен жұмыс істейді."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"5":{"kind":"lab","t":"Жылу процестеріндегі энергияның сақталу және айналу заңы. № 1 ЗЖ «Әртүрлі температуралы суды араластыру кезіндегі жылу мөлшерлерін салыстыру»","hook":"Бір кесе қайнаған су мен бір кесе суық суды араластырса, қандай температура шығады? Жылудың бір бөлігі қайда кетеді?","dq":["Қыздыру кезінде Q-ды қандай формуламен есептейді?","Қоспаның температурасы дегеніміз не?","Температура мен массаны өлшеуге қандай құралдар қажет?"],"m":"ынтымақтастықта оқыту + зертханалық жұмыс","act":"Зертханалық жұмыс: суық судың массасы мен температурасын өлшеп, ыстық су қосады, қоспаның температурасын θ өлшейді, берілген және алынған Q-ды тауып салыстырады.","t1":"қадамдық нұсқаулық және жазу үлгісі бар кесте","t2":"кейбір қадамдары жоқ жұмыс жоспары, үлгісіз кесте","t3":"жоспарды, кестені өздері құрып, жылудың ықтимал шығынын бағалайды","s":["Судың массаларын, температураларын және қоспа температурасы θ-ны өлшейді","Q₁ = c·m₁·(t₁ − θ) және Q₂ = c·m₂·(θ − t₂) есептейді","Q₁ мен Q₂-ні салыстырып, айырмашылықты түсіндіреді (жылу шығыны, қателіктер)"],"con":["Берілген жылу = алынған жылу (жылулық тепе-теңдік теңдеуі): c·m₁·(t₁ − θ) = c·m₂·(θ − t₂)","Шамалы айырмашылық қоршаған ортаға жылу шығынымен және ыдыстың қызуымен түсіндіріледі","Энергия жойылмайды, бір денеден екіншісіне беріледі"],"tk":[["Массасы 200 г, температурасы 80 °C ыстық су массасы 100 г, температурасы 20 °C суық сумен араласты. Қоспаның температурасын табыңыз.","θ = (200·80 + 100·20)/300 = 60 °C"],["90 °C-тағы 300 г суды 15 °C-тағы 200 г суға құйды. θ-ны табыңыз.","θ = (300·90 + 200·15)/500 = 60 °C"],["10 °C-тағы 1 кг суды 50 °C-тағы 1 кг сумен араластырды. θ-ны табыңыз.","θ = 30 °C"],["Массасы 0,2 кг ыстық су 90 °C-тан 60 °C-қа дейін суыды. Ол қанша жылу берді? Шығын болмаса, суық су қанша жылу алады?","Q = 4200·0,2·30 = 25 200 Дж; суық су 25 200 Дж алады"]],"hw":"№ 1 ЗЖ қорытындысын рәсімдеу; жылулық тепе-теңдік бойынша екі есеп шығару","res":"екі стақан немесе калориметр, ыстық және суық су, термометр, мензурка немесе таразы","live":"шай демдеу, душта суды қажетті температураға дейін араластыру","tb":"ыстық суды (60–70 °C-тан аспайтын) абайлап құю, төгілген суды бірден сүрту","cr":["Массалар мен температураларды жазып, берілген және алынған Q-ды есептейді","Нәтижеге әсер ететін факторларды (жылу шығыны, термометрдің дәлдігі) анықтап, Q₁ мен Q₂-ні салыстырады","Есепте жылулық тепе-теңдік теңдеуін қолданады","Қауіпсіздік техникасын сақтайды"],"sec":"8.1 A Жылу құбылыстары (5 с)","goals":[{"c":"8.3.2.9","t":"жылулық тепе-теңдік теңдеуін есептер шығаруда қолдану"},{"c":"8.3.2.8","t":"жылу құбылыстарындағы энергияның сақталу және айналу заңын зерттеу"},{"c":"8.1.3.2","t":"тәжірибені жүргізуге әсер ететін факторларды анықтау"},{"c":"8.1.3.3","t":"физика кабинетінде қауіпсіздік ережелерін білу және сақтау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Тәжірибе арқылы оқу (EntreComp)","Ынтымақтастық (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Бір кесе қайнаған су мен бір кесе суық суды араластырса, қандай температура шығады? Жылудың бір бөлігі қайда кетеді?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Қыздыру кезінде Q-ды қандай формуламен есептейді?","- Қоспаның температурасы дегеніміз не?","- Температура мен массаны өлшеуге қандай құралдар қажет?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): ыстық суды (60–70 °C-тан аспайтын) абайлап құю, төгілген суды бірден сүрту."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс: суық судың массасы мен температурасын өлшеп, ыстық су қосады, қоспаның температурасын θ өлшейді, берілген және алынған Q-ды тауып салыстырады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – қадамдық нұсқаулық және жазу үлгісі бар кесте;","- **2-саты «Кеңес»** – кейбір қадамдары жоқ жұмыс жоспары, үлгісіз кесте;","- **3-саты «Өздігінен»** – жоспарды, кестені өздері құрып, жылудың ықтимал шығынын бағалайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Судың массаларын, температураларын және қоспа температурасы θ-ны өлшейді","Q₁ = c·m₁·(t₁ − θ) және Q₂ = c·m₂·(θ − t₂) есептейді","Q₁ мен Q₂-ні салыстырып, айырмашылықты түсіндіреді (жылу шығыны, қателіктер)","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["екі стақан немесе калориметр, ыстық және суық су, термометр, мензурка немесе таразы"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Берілген жылу = алынған жылу (жылулық тепе-теңдік теңдеуі): c·m₁·(t₁ − θ) = c·m₂·(θ − t₂)","- Шамалы айырмашылық қоршаған ортаға жылу шығынымен және ыдыстың қызуымен түсіндіріледі","- Энергия жойылмайды, бір денеден екіншісіне беріледі"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 1 ЗЖ қорытындысын рәсімдеу; жылулық тепе-теңдік бойынша екі есеп шығару;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Жылулық тепе-теңдік теңдеуін есептер шығаруда қолдану."],["Тақырыбы","Жылу процестеріндегі энергияның сақталу және айналу заңы. № 1 ЗЖ «Әртүрлі температуралы суды араластыру кезіндегі жылу мөлшерлерін салыстыру»"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","екі стақан немесе калориметр, ыстық және суық су, термометр, мензурка немесе таразы"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","шай демдеу, душта суды қажетті температураға дейін араластыру"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)","**l.6** Ынтымақтастық (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + зертханалық жұмыс."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"6":{"kind":"lab","t":"Қатты денелердің балқуы және қатаюы. Меншікті балқу жылуы. № 2 ЗЖ «Мұздың меншікті балқу жылуын анықтау»","hook":"Стақандағы мұз ериді, бірақ толық ерімейінше оның температурасы 0 °C болып қалады. Энергия қайда кетеді?","dq":["Заттың қандай агрегаттық күйлерін білесіңдер?","Қатты денеде және сұйықта молекулалар қалай орналасқан?","Суды қыздыру кезінде Q-ды қандай формуламен есептейді?"],"m":"ынтымақтастықта оқыту + зертханалық жұмыс","act":"Зертханалық жұмыс: жылы суға 0 °C-тағы мұзды салып, ерігеннен кейін θ температурасын өлшейді және λ = c·(m₁(t₁ − θ)/m₂ − θ) формуласымен табады.","t1":"қадамдық нұсқаулық, дайын формула және есептеу үлгісі","t2":"кейбір қадамдары жоқ жоспар, формуланы жылулық тепе-теңдік теңдеуінен қорытады","t3":"жоспарды өздері құрып, λ формуласын қорытып, қателікті бағалайды","s":["Судың массасын, бастапқы температурасын, еріген мұздың массасын және қоспаның температурасын өлшейді","λ-ны есептеп, кестелік 3,4·10⁵ Дж/кг мәнімен салыстырады","Балқу және кристалдану кезіндегі температураның уақытқа тәуелділік графигін талдайды"],"con":["Балқу және кристалдану кезінде температура тұрақты; графикте – көлденең бөлік","Q = λ·m – балқу кезінде жұтылатын және кристалдану кезінде бөлінетін жылу мөлшері; мұздың λ-сы = 3,4·10⁵ Дж/кг","Балқу кезінде энергия температураны көтеруге емес, кристалл торды бұзуға жұмсалады"],"tk":[["0 °C-тағы 2 кг мұзды балқытуға қанша жылу қажет? (λ = 3,4·10⁵ Дж/кг)","Q = 3,4·10⁵·2 = 6,8·10⁵ Дж = 680 кДж"],["Кристалл денені қыздыру графигіндегі көлденең бөлік нені көрсетеді?","Тұрақты температурада балқуды"],["0 °C-тағы 0,5 кг су кристалданғанда қанша жылу бөлінеді?","Q = 3,4·10⁵·0,5 = 1,7·10⁵ Дж"],["0 °C-тағы 0,1 кг мұзды ерітіп, пайда болған суды 20 °C-қа дейін қыздырды. Қанша жылу қажет болды?","Q = 3,4·10⁴ + 4200·0,1·20 = 34 000 + 8 400 = 42 400 Дж"]],"hw":"№ 2 ЗЖ қорытындысын рәсімдеу; мұз сусынды неге салқын судан жақсы суытатынын түсіндіру","res":"калориметр немесе стақан, жылы су, мұз, термометр, таразы, майлықтар","live":"сусындағы мұз, қардың еруі, су айдындарының қатуы","tb":"суды 40–50 °C-тан ыстық емес қолдану, төгілген суды сүрту","cr":["Балқу мен кристалдануды молекула-кинетикалық теория негізінде сипаттайды және графикті оқиды","Есепте Q = λ·m формуласын қолданады","λ-ны тәжірибе арқылы анықтап, нәтижені қателікпен жазады","Қауіпсіздік техникасын сақтайды"],"sec":"8.1 В Агрегаттық күйлер (4 с)","goals":[{"c":"8.3.1.4","t":"молекула-кинетикалық теория негізінде қатты күйден сұйыққа және кері айналуды сипаттау"},{"c":"8.3.2.10","t":"балқу/кристалдану кезіндегі жұтылатын/бөлінетін жылу мөлшерінің формуласын есептер шығаруға қолдану"},{"c":"8.3.2.11","t":"заттың балқу және қатаю процесі кезіндегі температураның уақытқа тәуелділік графигін талдау"},{"c":"8.3.2.12","t":"эксперимент көмегімен мұздың меншікті балқу жылуын анықтау"},{"c":"8.1.3.3","t":"физика кабинетінде қауіпсіздік ережелерін білу және сақтау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Тәжірибе арқылы оқу (EntreComp)","Ынтымақтастық (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Стақандағы мұз ериді, бірақ толық ерімейінше оның температурасы 0 °C болып қалады. Энергия қайда кетеді?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Заттың қандай агрегаттық күйлерін білесіңдер?","- Қатты денеде және сұйықта молекулалар қалай орналасқан?","- Суды қыздыру кезінде Q-ды қандай формуламен есептейді?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): суды 40–50 °C-тан ыстық емес қолдану, төгілген суды сүрту."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс: жылы суға 0 °C-тағы мұзды салып, ерігеннен кейін θ температурасын өлшейді және λ = c·(m₁(t₁ − θ)/m₂ − θ) формуласымен табады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – қадамдық нұсқаулық, дайын формула және есептеу үлгісі;","- **2-саты «Кеңес»** – кейбір қадамдары жоқ жоспар, формуланы жылулық тепе-теңдік теңдеуінен қорытады;","- **3-саты «Өздігінен»** – жоспарды өздері құрып, λ формуласын қорытып, қателікті бағалайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Судың массасын, бастапқы температурасын, еріген мұздың массасын және қоспаның температурасын өлшейді","λ-ны есептеп, кестелік 3,4·10⁵ Дж/кг мәнімен салыстырады","Балқу және кристалдану кезіндегі температураның уақытқа тәуелділік графигін талдайды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["калориметр немесе стақан, жылы су, мұз, термометр, таразы, майлықтар"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Балқу және кристалдану кезінде температура тұрақты; графикте – көлденең бөлік","- Q = λ·m – балқу кезінде жұтылатын және кристалдану кезінде бөлінетін жылу мөлшері; мұздың λ-сы = 3,4·10⁵ Дж/кг","- Балқу кезінде энергия температураны көтеруге емес, кристалл торды бұзуға жұмсалады"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 2 ЗЖ қорытындысын рәсімдеу; мұз сусынды неге салқын судан жақсы суытатынын түсіндіру;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Молекула-кинетикалық теория негізінде қатты күйден сұйыққа және кері айналуды сипаттау."],["Тақырыбы","Қатты денелердің балқуы және қатаюы. Меншікті балқу жылуы. № 2 ЗЖ «Мұздың меншікті балқу жылуын анықтау»"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","калориметр немесе стақан, жылы су, мұз, термометр, таразы, майлықтар"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","сусындағы мұз, қардың еруі, су айдындарының қатуы"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)","**l.6** Ынтымақтастық (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + зертханалық жұмыс."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"7":{"kind":"new","t":"Булану және конденсация. Қаныққан және қанықпаған булар","hook":"Аязды көшеден жылы бөлмеге кіргенде көзілдірік неге тұманданады?","dq":["Ашық кеседегі су бірнеше күнде не болады?","Сұйық молекулалары қалай қозғалады?","Агрегаттық күй дегеніміз не?"],"m":"ынтымақтастықта оқыту + тәжірибелік бекеттер","act":"Бекеттер: «Булану» (шыны мен алақандағы су тамшысы, әртүрлі аудан), «Конденсация» (ыстық су үстіндегі суық шыны), «График» (судың t(τ) графигін талдау).","t1":"көмекші сұрақтары бар және кестесі дайын бекет карточкалары","t2":"бекет карточкалары, үлгісіз кесте","t3":"булану жылдамдығы неге байланысты екені туралы гипотезаны өздері құрып, тексереді","s":["Әртүрлі жағдайда (аудан, жел, қыздыру) буланудың жүруін бақылайды","Суық бетте конденсацияны бақылайды","Булану және конденсация кезіндегі температураның уақытқа тәуелділік графигін оқиды"],"con":["Булану кез келген температурада жүреді; қыздырғанда, ауданы үлкен болғанда және желде тезірек жүреді; конденсация – кері процесс","Қаныққан бу өз сұйығымен динамикалық тепе-теңдікте болады: ұшып шығатын молекулалар саны оралатын молекулалар санына тең","Қанықпаған бу – буланудың конденсациядан басым болатын күйі"],"tk":[["Неге жуылған кір жел болғанда тезірек кебеді?","Жел бу молекулаларын әкетеді, булану тез жүреді"],["Аязды жерден жылы бөлмеге кіргенде көзілдірік неге тұманданады?","Су буы суық шынының бетінде конденсацияланады"],["Қаныққан бу дегеніміз не?","Өз сұйығымен динамикалық тепе-теңдіктегі бу"],["Графикте 100 °C-тағы бөлік көлденең. Қандай процесс жүріп жатыр?","Тұрақты температурада қайнау (булану)"]],"hw":"тақырып бойынша параграф; ыстықта адам неге терлейтінін түсіндіру","res":"шыны, су, тамшылатқыш, ыстық су құйылған стақан, суық шыны, карточкадағы график","live":"кір кептіру, тұман, терезенің терлеуі, ауа ылғалдылығы","tb":"ыстық суды абайлап тасымалдау","cr":["Булану мен конденсацияны молекула-кинетикалық теория негізінде сипаттайды","Булану және конденсация кезіндегі температураның уақытқа тәуелділік графигін талдайды","Су буы мысалында қанығу күйін сипаттайды"],"sec":"8.1 В Агрегаттық күйлер (4 с)","goals":[{"c":"8.3.1.5","t":"молекула-кинетикалық теория негізінде заттың сұйық күйден газ күйіне және кері айналуын сипаттау"},{"c":"8.3.2.13","t":"заттың булану және конденсация процесі кезіндегі температураның уақытқа тәуелділік графигін талдау"},{"c":"8.3.2.14","t":"су буының мысалы негізінде қанығу күйін сипаттау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Жүйелі ойлау (GreenComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Аязды көшеден жылы бөлмеге кіргенде көзілдірік неге тұманданады?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Ашық кеседегі су бірнеше күнде не болады?","- Сұйық молекулалары қалай қозғалады?","- Агрегаттық күй дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): ыстық суды абайлап тасымалдау."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + тәжірибелік бекеттер.","Бекеттер: «Булану» (шыны мен алақандағы су тамшысы, әртүрлі аудан), «Конденсация» (ыстық су үстіндегі суық шыны), «График» (судың t(τ) графигін талдау).","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – көмекші сұрақтары бар және кестесі дайын бекет карточкалары;","- **2-саты «Кеңес»** – бекет карточкалары, үлгісіз кесте;","- **3-саты «Өздігінен»** – булану жылдамдығы неге байланысты екені туралы гипотезаны өздері құрып, тексереді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Әртүрлі жағдайда (аудан, жел, қыздыру) буланудың жүруін бақылайды","Суық бетте конденсацияны бақылайды","Булану және конденсация кезіндегі температураның уақытқа тәуелділік графигін оқиды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["шыны, су, тамшылатқыш, ыстық су құйылған стақан, суық шыны, карточкадағы график"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Булану кез келген температурада жүреді; қыздырғанда, ауданы үлкен болғанда және желде тезірек жүреді; конденсация – кері процесс","- Қаныққан бу өз сұйығымен динамикалық тепе-теңдікте болады: ұшып шығатын молекулалар саны оралатын молекулалар санына тең","- Қанықпаған бу – буланудың конденсациядан басым болатын күйі"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф;
