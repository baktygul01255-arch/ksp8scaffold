мен анықтайды","Шарғының өрісін жолақ магниттің өрісімен салыстырады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["шарғы, темір өзекше, ток көзі, кілт, реостат, қыстырғыштар, компас"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Тогы бар өткізгіштің айналасында магнит өрісі бар (Эрстед тәжірибесі); сызықтардың бағыты – бұрғы ережесі бойынша","- Тогы бар шарғы (соленоид) жолақ магнит өрісіне ұқсас өріс тудырады","- Электрмагниттің әрекетін ток күшін, орам санын арттыру және темір өзекше енгізу арқылы күшейтеді"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 9 ЗЖ қорытындысын рәсімдеу; «Магнит өрісінің токқа әсері» параграфы;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Магнит өрісінің сипаттамаларын түсіндіру."],["Тақырыбы","Тогы бар түзу өткізгіштің және шарғының магнит өрісі. Электрмагниттер және оларды қолдану. № 9 ЗЖ «Электрмагнитті құрастыру және оның әрекетін зерттеу»"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","шарғы, темір өзекше, ток көзі, кілт, реостат, қыстырғыштар, компас"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","электр қоңырауы, көтергіш кран, динамиктер"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + зертханалық жұмыс."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"26":{"kind":"sor","t":"Магнит өрісінің тогы бар өткізгішке әрекеті. Электроқозғалтқыш. Электрмагниттік индукция. Генератор. «Электрмагниттік құбылыстар» бөлімі бойынша БЖБ № 6","hook":"Электр қозғалтқышы бұрғыны айналдырады, ал электр станциясындағы генератор ток өндіреді. Магнит өрісі токты және қозғалысты қалай байланыстырады?","dq":["Өткізгіш айналасындағы өрістің бағытын қалай анықтайды?","Электрмагнит дегеніміз не?","Қандай энергия көздерін білесіңдер?"],"m":"жұппен жұмыс + тәжірибелерді көрсету","act":"Жұптар «магнит өрісіндегі тогы бар өткізгіш» демонстрациясын және Фарадей тәжірибесін (магнит пен гальванометрі бар шарғы) бақылап, қозғалтқыш пен генератор туралы қорытынды жасайды.","t1":"жазбалары бар тәжірибе сызбалары және көмекші сұрақтар","t2":"жазбасыз сызбалар","t3":"қозғалтқыш пен генератордың құрылысын өздері түсіндіреді","s":["Магнит өрісінің тогы бар өткізгішке әсерін (Ампер күші) сипаттайды","Электрмагниттік индукция құбылысын түсіндіреді","Дүние жүзінде және Қазақстанда электр энергиясын өндіру тәсілдерін атайды"],"con":["Магнит өрісіндегі тогы бар өткізгішке күш әсер етеді; бағыты – сол қол ережесі бойынша; электроқозғалтқыш пен электр өлшеуіш құралдар осыған негізделген","Электрмагниттік индукция – магнит ағыны өзгергенде тұйық контурда токтың пайда болуы; генератор осыған негізделген","Қазақстанда электр энергиясын ЖЭС, ГЭС, жел және күн электр станцияларында өндіреді"],"tk":[["Магнит өрісіндегі тогы бар өткізгішке әсер ететін күштің бағытын қалай анықтайды?","Сол қол ережесі бойынша"],["Электрмагниттік индукция дегеніміз не? Ток қандай шартта пайда болады?","Магнит ағыны өзгергенде тұйық контурда токтың пайда болуы"],["Қазақстанда электр энергиясын алудың екі тәсілін атаңыз.","Көмірмен жұмыс істейтін ЖЭС (мысалы, Екібастұз ГРЭС), ГЭС (Бұқтырма, Қапшағай), жел және күн станциялары"],["Электрмагнитті күшейтудің екі тәсілін атаңыз.","Ток күшін немесе орам санын арттыру, темір өзекше енгізу"]],"hw":"«Жарықтың таралуы» параграфы; тәжірибе үшін шам-фонарь немесе лазерлік көрсеткіш дайындау","res":"магнит, шарғы, гальванометр, қозғалтқыш моделі, БЖБ нұсқаларының карточкалары","live":"электроқозғалтқыштар, генераторлар, Қазақстанның электр станциялары","cr":["Магнит өрісінің тогы бар өткізгішке әсерін және электроқозғалтқыштың жұмысын сипаттайды","Электрмагниттік индукция құбылысын сипаттап, электр энергиясын өндіру мысалдарын келтіреді","Бөлім тапсырмаларын дұрыс негіздеп орындайды"],"sec":"8.3 В Электрмагниттік құбылыстар (3 с)","goals":[{"c":"8.4.3.5","t":"магнит өрісінің тогы бар өткізгішке әсерін сипаттау"},{"c":"8.4.3.6","t":"электрқозғалтқыштың және электр өлшеуіш құралдардың жұмыс істеу принципін түсіндіру"},{"c":"8.4.3.7","t":"электрмагниттік индукция құбылысын түсіндіру"},{"c":"8.4.3.8","t":"Қазақстанда және дүние жүзінде электр энергиясын өндірудің мысалдарын келтіру"}],"compN":["Табиғатты қорғау (GreenComp)","Этикалық және тұрақты ойлау (EntreComp)","Сыни ойлау (LifeComp)"],"stages":[{"tm":"0–3","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Электр қозғалтқышы бұрғыны айналдырады, ал электр станциясындағы генератор ток өндіреді. Магнит өрісі токты және қозғалысты қалай байланыстырады?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Өткізгіш айналасындағы өрістің бағытын қалай анықтайды?","- Электрмагнит дегеніміз не?","- Қандай энергия көздерін білесіңдер?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"3–5","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"5–17","name":"3. Жаңа материалды меңгеру","tch":["**Scaffold оқыту әдісі:** жұппен жұмыс + тәжірибелерді көрсету.","Жұптар «магнит өрісіндегі тогы бар өткізгіш» демонстрациясын және Фарадей тәжірибесін (магнит пен гальванометрі бар шарғы) бақылап, қозғалтқыш пен генератор туралы қорытынды жасайды.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – жазбалары бар тәжірибе сызбалары және көмекші сұрақтар;","- **2-саты «Кеңес»** – жазбасыз сызбалар;","- **3-саты «Өздігінен»** – қозғалтқыш пен генератордың құрылысын өздері түсіндіреді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Магнит өрісінің тогы бар өткізгішке әсерін (Ампер күші) сипаттайды","Электрмагниттік индукция құбылысын түсіндіреді","Дүние жүзінде және Қазақстанда электр энергиясын өндіру тәсілдерін атайды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["магнит, шарғы, гальванометр, қозғалтқыш моделі, БЖБ нұсқаларының карточкалары"]},{"tm":"17–20","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Магнит өрісіндегі тогы бар өткізгішке күш әсер етеді; бағыты – сол қол ережесі бойынша; электроқозғалтқыш пен электр өлшеуіш құралдар осыған негізделген","- Электрмагниттік индукция – магнит ағыны өзгергенде тұйық контурда токтың пайда болуы; генератор осыған негізделген","- Қазақстанда электр энергиясын ЖЭС, ГЭС, жел және күн электр станцияларында өндіреді"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"20–40","name":"5. Бөлім бойынша жиынтық бағалау (БЖБ)","tch":["Бөлім бойынша жиынтық бағалауды ұйымдастырады (20 мин, жеке, 4 тапсырма, ең жоғары балл – 10). БЖБ тапсырмалары – қосымшада. Бұл кезеңде тіректер алынады."],"stu":["БЖБ тапсырмаларын өздігінен, кеңессіз орындайды."],"ass":["**Жиынтық.** Дескрипторлар бойынша балл (қосымша)."],"res":["БЖБ нұсқаларының карточкалары","Калькулятор","Шамалар кестелері"]},{"tm":"40–43","name":"6. Өзін-өзі тексеру. Үй тапсырмасы","tch":["Эталон мен критерийлерді таратады; оқушылар жауаптарын тексеріп, қателерін белгілейді. Баллды келесі сабақта хабарлайды.","**Үй тапсырмасы:** «Жарықтың таралуы» параграфы; тәжірибе үшін шам-фонарь немесе лазерлік көрсеткіш дайындау."],"stu":["Жауаптарын эталонмен салыстырып, қателерін белгілейді.","Үй тапсырмасын жазады."],"ass":["**Өзін-өзі бағалау** эталон бойынша."],"res":["Жауап эталоны","Критерийлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Магнит өрісінің тогы бар өткізгішке әсерін сипаттау."],["Тақырыбы","Магнит өрісінің тогы бар өткізгішке әрекеті. Электроқозғалтқыш. Электрмагниттік индукция. Генератор. «Электрмагниттік құбылыстар» бөлімі бойынша БЖБ № 6"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","магнит, шарғы, гальванометр, қозғалтқыш моделі, БЖБ нұсқаларының карточкалары"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","электроқозғалтқыштар, генераторлар, Қазақстанның электр станциялары"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.3** Табиғатты қорғау (GreenComp)","**e.5** Этикалық және тұрақты ойлау (EntreComp)","**l.8** Сыни ойлау (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Жұппен жұмыс + тәжірибелерді көрсету."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; қорытынды – бөлім бойынша жиынтық бағалау (БЖБ); соңында – «Өзін-өзі талдау»."],["Қолдау қағидаты","Тірек біртіндеп алынады; БЖБ кезеңінде оқушылар өздігінен жұмыс істейді."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"27":{"kind":"new","t":"Жарықтың түзусызықты таралу заңы. Күн және Ай тұтылуы. Түсу және шағылу бұрыштары","hook":"Күн тұтылғанда күндіз неге қараңғы болады, ал Ай тұтылуын түнде аспанға қараған барлық адам көреді?","dq":["Жарық көзі дегеніміз не?","Көлеңке дегеніміз не?","Бұрыштарды транспортирмен қалай өлшейді?"],"m":"ынтымақтастықта оқыту + тәжірибелік бекеттер","act":"Бекеттер: «Көлеңке және жартылай көлеңке» (шам және мөлдір емес зат), «Тұтылулар» (Күн – Жер – Ай моделі), «Шағылу» (сәуле, айна, транспортир; түсу және шағылу бұрыштарын өлшеу).","t1":"жазбалары бар сызбалар және бұрыштардың дайын кестесі бар бекет карточкалары","t2":"бекет карточкалары, кестені өздері толтырады","t3":"тұтылу сызбасын өздері құрып, шағылу бұрышының түсу бұрышына тәуелділігіне тәжірибені жоспарлайды","s":["Көлеңке мен жартылай көлеңкені бақылап, тұтылу сызбасын салады","Сәуленің әртүрлі орнында түсу және шағылу бұрыштарын өлшейді","Жарықтың түзусызықты таралу заңын және шағылу заңын тұжырымдайды"],"con":["Біртекті ортада жарық түзусызықты таралады; дәлелі – көлеңке және жартылай көлеңке","Күн тұтылуы – Ай Күн мен Жердің арасында; Ай тұтылуы – Жер Күн мен Айдың арасында","Түсу бұрышы шағылу бұрышына тең; түскен және шағылған сәуле мен перпендикуляр бір жазықтықта жатады"],"tk":[["Биіктігі 1 м таяқтың көлеңкесі 2 м. Ағаштың көлеңкесі 12 м. Ағаштың биіктігін табыңыз.","H = 12/2 = 6 м"],["Сәуленің айнаға түсу бұрышы 35°. Шағылу бұрышы және сәуле мен айна арасындағы бұрыш неге тең?","35°; 90° − 35° = 55°"],["Ай тұтылуын Жердің түнгі жағындағы барлық адам неге көреді?","Ай Жердің көлеңкесіне түсіп, өзі жарықтанбай қалады"],["Күн тұтылуының сызбасын салыңыз.","Күн – Ай – Жер бір түзуде, Айдың көлеңкесі Жерге түседі"]],"hw":"тақырып бойынша параграф; Күн және Ай тұтылуының сызбаларын салу","res":"шам немесе фонарь, мөлдір емес заттар, айна, транспортир, лазерлік көрсеткіш, Күн–Жер–Ай моделі","live":"заттардың көлеңкесі, тұтылулар, айнадағы жарықтың шағылуы","tb":"лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау","cr":["Күн және Ай тұтылуын графикалық бейнелейді","Шағылу бұрышының түсу бұрышына тәуелділігін тәжірибе арқылы анықтайды","Өлшеулерді жазып, қорытынды жасайды"],"sec":"8.4 А Жарық құбылыстары (8 с)","goals":[{"c":"8.5.1.1","t":"Күннің және Айдың тұтылуын графикалық бейнелеу"},{"c":"8.5.1.2","t":"эксперимент арқылы түсу және шағылу бұрыштарының тәуелділігін анықтау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Тәжірибе арқылы оқу (EntreComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Күн тұтылғанда күндіз неге қараңғы болады, ал Ай тұтылуын түнде аспанға қараған барлық адам көреді?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Жарық көзі дегеніміз не?","- Көлеңке дегеніміз не?","- Бұрыштарды транспортирмен қалай өлшейді?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + тәжірибелік бекеттер.","Бекеттер: «Көлеңке және жартылай көлеңке» (шам және мөлдір емес зат), «Тұтылулар» (Күн – Жер – Ай моделі), «Шағылу» (сәуле, айна, транспортир; түсу және шағылу бұрыштарын өлшеу).","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – жазбалары бар сызбалар және бұрыштардың дайын кестесі бар бекет карточкалары;","- **2-саты «Кеңес»** – бекет карточкалары, кестені өздері толтырады;","- **3-саты «Өздігінен»** – тұтылу сызбасын өздері құрып, шағылу бұрышының түсу бұрышына тәуелділігіне тәжірибені жоспарлайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Көлеңке мен жартылай көлеңкені бақылап, тұтылу сызбасын салады","Сәуленің әртүрлі орнында түсу және шағылу бұрыштарын өлшейді","Жарықтың түзусызықты таралу заңын және шағылу заңын тұжырымдайды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["шам немесе фонарь, мөлдір емес заттар, айна, транспортир, лазерлік көрсеткіш, Күн–Жер–Ай моделі"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Біртекті ортада жарық түзусызықты таралады; дәлелі – көлеңке және жартылай көлеңке","- Күн тұтылуы – Ай Күн мен Жердің арасында; Ай тұтылуы – Жер Күн мен Айдың арасында","- Түсу бұрышы шағылу бұрышына тең; түскен және шағылған сәуле мен перпендикуляр бір жазықтықта жатады"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; Күн және Ай тұтылуының сызбаларын салу;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Күннің және Айдың тұтылуын графикалық бейнелеу."],["Тақырыбы","Жарықтың түзусызықты таралу заңы. Күн және Ай тұтылуы. Түсу және шағылу бұрыштары"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","шам немесе фонарь, мөлдір емес заттар, айна, транспортир, лазерлік көрсеткіш, Күн–Жер–Ай моделі"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","заттардың көлеңкесі, тұтылулар, айнадағы жарықтың шағылуы"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + тәжірибелік бекеттер."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"28":{"kind":"new","t":"Жарықтың шағылуы. Шағылу заңдары. Жазық айналар. Толық ішкі шағылу","hook":"Айнада өзімізді көреміз, ал қағаз бетінде көрмейміз, екі зат та жарықты шағылдырса да. Неліктен?","dq":["Жарықтың шағылу заңын тұжырымдаңыз","Түсу бұрышы дегеніміз не?","Заттың кескіні дегеніміз не?"],"m":"ынтымақтастықта оқыту + тәжірибелік бекеттер","act":"Бекеттер: «Айналық және шашыранды шағылу» (айна және қағаз), «Жазық айнадағы кескін» (салу және қашықтықтарды өлшеу), «Толық ішкі шағылу» (сулы мөлдір ыдыстағы лазер сәулесі).","t1":"салудың дайын сызбалары және кестесі бар бекет карточкалары","t2":"бекет карточкалары, сызбаны кеңес бойынша салады","t3":"кескінді өздері салып, толық ішкі шағылу шартын түсіндіреді","s":["Айналық және шашыранды шағылуды ажыратады","Жазық айнадағы нүктенің кескінін салып, сипаттайды","Толық ішкі шағылуды бақылап, шектік бұрышты табады"],"con":["Айналық шағылу – тегіс беттен; шашыранды шағылу – кедір-бұдыр беттен","Жазық айнадағы кескін жорамал, түзу, заттың өлшеміндей, симметриялы: айнаға дейінгі қашықтық бірдей","Толық ішкі шағылу оптикалық тығыздау ортадан тығыздығы аз ортаға өткенде, бұрыш шектік бұрыштан үлкен болғанда пайда болады; sin α₀ = 1/n"],"tk":[["Зат жазық айнадан 40 см қашықтықта тұр. Кескінге дейінгі және зат пен кескін арасындағы қашықтық қандай?","40 см; 80 см"],["Шашыранды шағылу айналық шағылудан немен ерекшеленеді?","Шашыранды шағылуда сәулелер бет кедір-бұдыр болғандықтан әртүрлі бағытқа шашырайды"],["n = 1,5 шыны үшін толық шағылудың шектік бұрышын табыңыз.","sin α₀ = 1/1,5 ≈ 0,67; α₀ ≈ 42°"],["Толық ішкі шағылу құбылысы қайда қолданылады?","Оптикалық талшықта, дүрбі призмаларында, шағылдырғыштарда"]],"hw":"тақырып бойынша параграф; оптикалық талшықты қолданудың екі мысалын табу","res":"айна, қағаз парағы, лазерлік көрсеткіш, сулы мөлдір ыдыс, сызғыш, транспортир","live":"айналар, оптикалық талшықты интернет, су мен алмастың жарқырауы","tb":"лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау","cr":["Айналық және шашыранды шағылуды түсіндіріп, мысал келтіреді","Жазық айнадағы кескінді салып, сипаттайды","Тәжірибеге сүйеніп толық ішкі шағылуды түсіндіреді"],"sec":"8.4 А Жарық құбылыстары (8 с)","goals":[{"c":"8.5.1.3","t":"айналық және шашыранды шағылудың мысалдарын келтіру және түсіндіру"},{"c":"8.5.1.4","t":"жазық айнада дененің кескінін алу және оны сипаттау"},{"c":"8.5.1.8","t":"тәжірибеге сүйене отырып толық ішкі шағылу құбылысын түсіндіру"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Ақпаратты және цифрлық контентті іздеу (DigComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Айнада өзімізді көреміз, ал қағаз бетінде көрмейміз, екі зат та жарықты шағылдырса да. Неліктен?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Жарықтың шағылу заңын тұжырымдаңыз","- Түсу бұрышы дегеніміз не?","- Заттың кескіні дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + тәжірибелік бекеттер.","Бекеттер: «Айналық және шашыранды шағылу» (айна және қағаз), «Жазық айнадағы кескін» (салу және қашықтықтарды өлшеу), «Толық ішкі шағылу» (сулы мөлдір ыдыстағы лазер сәулесі).","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – салудың дайын сызбалары және кестесі бар бекет карточкалары;","- **2-саты «Кеңес»** – бекет карточкалары, сызбаны кеңес бойынша салады;","- **3-саты «Өздігінен»** – кескінді өздері салып, толық ішкі шағылу шартын түсіндіреді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Айналық және шашыранды шағылуды ажыратады","Жазық айнадағы нүктенің кескінін салып, сипаттайды","Толық ішкі шағылуды бақылап, шектік бұрышты табады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["айна, қағаз парағы, лазерлік көрсеткіш, сулы мөлдір ыдыс, сызғыш, транспортир"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Айналық шағылу – тегіс беттен; шашыранды шағылу – кедір-бұдыр беттен","- Жазық айнадағы кескін жорамал, түзу, заттың өлшеміндей, симметриялы: айнаға дейінгі қашықтық бірдей","- Толық ішкі шағылу оптикалық тығыздау ортадан тығыздығы аз ортаға өткенде, бұрыш шектік бұрыштан үлкен болғанда пайда болады; sin α₀ = 1/n"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; оптикалық талшықты қолданудың екі мысалын табу;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Айналық және шашыранды шағылудың мысалдарын келтіру және түсіндіру."],["Тақырыбы","Жарықтың шағылуы. Шағылу заңдары. Жазық айналар. Толық ішкі шағылу"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","айна, қағаз парағы, лазерлік көрсеткіш, сулы мөлдір ыдыс, сызғыш, транспортир"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","айналар, оптикалық талшықты интернет, су мен алмастың жарқырауы"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)","**d.1** Ақпаратты және цифрлық контентті іздеу (DigComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + тәжірибелік бекеттер."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"29":{"kind":"lab","t":"Жарықтың сынуы. Жарықтың сыну заңы. № 10 ЗЖ «Шынының сыну көрсеткішін анықтау»","hook":"Стақандағы суға салынған қасық «сынған» болып көрінеді. Екі орта шекарасында жарыққа не болады?","dq":["Екі орта шекарасы дегеніміз не?","Бұрышты транспортирмен қалай өлшейді?","Бұрыштың синусы дегеніміз не?"],"m":"ынтымақтастықта оқыту + зертханалық жұмыс","act":"Зертханалық жұмыс: сәулені шыны пластина арқылы өткізіп, түсу және сыну бұрыштарын өлшейді, n = sin α / sin γ сыну көрсеткішін есептеп, кестелік мәнмен салыстырады; пластинадағы сәуле жолын салады.","t1":"қадамдық нұсқаулық, дайын сызба және жазу үлгісі бар кесте","t2":"кейбір қадамдары жоқ жоспар, үлгісіз кесте","t3":"тәжірибелер сериясын өздері жоспарлап, қателікті бағалайды","s":["Сәуленің 3 орнында түсу және сыну бұрыштарын өлшейді","n есептеп, орташа мәнін табады","Нәтижені кестелік n-мен салыстырып, айырмашылықты түсіндіреді"],"con":["Сыну заңы: sin α / sin γ = n, мұндағы n – ортаның сыну көрсеткіші","n = c/v – вакуумдағы жарық жылдамдығы ортадағы жылдамдықтан неше есе көп екенін көрсетеді","Жазық параллель пластинадан өткен сәуле бастапқы бағытына параллель шығады, бірақ ығысады"],"tk":[["Түсу бұрышы 30°, сыну бұрышы 19,5°. Сыну көрсеткішін табыңыз (sin 30° = 0,5; sin 19,5° ≈ 0,334).","n = 0,5/0,334 ≈ 1,5"],["Шынының сыну көрсеткіші 1,5. Шыныдағы жарық жылдамдығын табыңыз (c = 3·10⁸ м/с).","v = 3·10⁸/1,5 = 2·10⁸ м/с"],["Жазық параллель шыны пластинадан сәуленің жолын салыңыз.","Сәуле бұрышпен кіріп, перпендикулярға қарай сынады, түскен сәулеге параллель ығысып шығады"],["Стақандағы суға салынған қасық неге сынған болып көрінеді?","Жарық су – ауа шекарасында сынады"]],"hw":"№ 10 ЗЖ қорытындысын рәсімдеу; «Линзалар» параграфы","res":"шыны пластина, лазерлік көрсеткіш немесе түйреуіштер, транспортир, сызғыш, қағаз парағы, сыну көрсеткіштерінің кестесі","live":"көзілдірік оптикасы, судағы жарықтың сынуы, линзалар","tb":"лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау","cr":["Жазық параллель пластинада сәулелердің жолын салады","Есептер шығаруда жарықтың сыну заңын қолданады","Шынының сыну көрсеткішін анықтап, кестелік мәнмен салыстырады","Қауіпсіздік техникасын сақтайды"],"sec":"8.4 А Жарық құбылыстары (8 с)","goals":[{"c":"8.5.1.6","t":"жазық параллель пластинада сәуленің жолын салу"},{"c":"8.5.1.7","t":"жарықтың сыну заңын пайдаланып есептер шығару"},{"c":"8.5.1.9","t":"экспериментте шынының сыну көрсеткiшiн анықтау"},{"c":"8.5.1.10","t":"сыну көрсеткішінің анықталған мәнін кестелік мәндермен салыстыру және эксперимент нәтижесін бағалау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Тәжірибе арқылы оқу (EntreComp)","Ынтымақтастық (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Стақандағы суға салынған қасық «сынған» болып көрінеді. Екі орта шекарасында жарыққа не болады?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Екі орта шекарасы дегеніміз не?","- Бұрышты транспортирмен қалай өлшейді?","- Бұрыштың синусы дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс: сәулені шыны пластина арқылы өткізіп, түсу және сыну бұрыштарын өлшейді, n = sin α / sin γ сыну көрсеткішін есептеп, кестелік мәнмен салыстырады; пластинадағы сәуле жолын салады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – қадамдық нұсқаулық, дайын сызба және жазу үлгісі бар кесте;","- **2-саты «Кеңес»** – кейбір қадамдары жоқ жоспар, үлгісіз кесте;","- **3-саты «Өздігінен»** – тәжірибелер сериясын өздері жоспарлап, қателікті бағалайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Сәуленің 3 орнында түсу және сыну бұрыштарын өлшейді","n есептеп, орташа мәнін табады","Нәтижені кестелік n-мен салыстырып, айырмашылықты түсіндіреді","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["шыны пластина, лазерлік көрсеткіш немесе түйреуіштер, транспортир, сызғыш, қағаз парағы, сыну көрсеткіштерінің кестесі"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Сыну заңы: sin α / sin γ = n, мұндағы n – ортаның сыну көрсеткіші","- n = c/v – вакуумдағы жарық жылдамдығы ортадағы жылдамдықтан неше есе көп екенін көрсетеді","- Жазық параллель пластинадан өткен сәуле бастапқы бағытына параллель шығады, бірақ ығысады"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 10 ЗЖ қорытындысын рәсімдеу; «Линзалар» параграфы;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Жазық параллель пластинада сәуленің жолын салу."],["Тақырыбы","Жарықтың сынуы. Жарықтың сыну заңы. № 10 ЗЖ «Шынының сыну көрсеткішін анықтау»"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","шыны пластина, лазерлік көрсеткіш немесе түйреуіштер, транспортир, сызғыш, қағаз парағы, сыну көрсеткіштерінің кестесі"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","көзілдірік оптикасы, судағы жарықтың сынуы, линзалар"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)","**l.6** Ынтымақтастық (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + зертханалық жұмыс."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"30":{"kind":"new","t":"Линзалар. Линзаның оптикалық күші. Жұқа линзаның формуласы","hook":"Ұлғайтқыш әріптерді үлкейтеді, ал жақыннан көрмейтіндерге арналған көзілдірік кішірейтеді. Линзалар арасындағы айырмашылық неде?","dq":["Жарықтың сынуы дегеніміз не?","Ұлғаюды қалай анықтайды?","Линзалар пішіні бойынша қандай болады?"],"m":"ынтымақтастықта оқыту + PhET «Геометриялық оптика» симуляциясында зерттеу","act":"Топтар симуляцияда жинағыш линза үшін кескінге дейінгі қашықтықтың затқа дейінгі қашықтыққа тәуелділігін зерттеп, жұқа линзаның формуласын қорытады.","t1":"қадамдық тапсырма, кесте және көмекші сұрақтары бар карточка","t2":"кеңестері бар тапсырма, үлгісіз кесте","t3":"мәндерді өздері таңдап, d, f және F байланысын қорытады","s":["Затқа дейінгі қашықтықты өзгертіп, кескінге дейінгі қашықтықты жазады","Фокустық қашықтығы мен оптикалық күшті есептейді","Жұқа линза формуласын және сызықтық ұлғаюды қолданады"],"con":["Оптикалық күш D = 1/F, бірлігі – диоптрия (дптр); жинағыш линзада D > 0, шашыратқыш линзада D \u003c 0","Жұқа линза формуласы: 1/d + 1/f = 1/F","Сызықтық ұлғаю Γ = f/d = H/h"],"tk":[["Линзаның фокустық қашықтығы 25 см. Оптикалық күшін табыңыз.","D = 1/0,25 = 4 дптр"],["F = 10 см, d = 30 см. Кескінге дейінгі қашықтықты және ұлғаюды табыңыз.","1/f = 1/10 − 1/30 = 2/30; f = 15 см; Γ = 15/30 = 0,5"],["Зат F = 20 см линзадан 60 см қашықтықта тұр. f табыңыз.","1/f = 1/20 − 1/60 = 2/60; f = 30 см"],["Линзаның оптикалық күші −2 дптр. Бұл қандай линза және F неге тең?","Шашыратқыш; F = −0,5 м"]],"hw":"тақырып бойынша параграф; жұқа линза формуласына екі есеп шығару","res":"PhET «Геометриялық оптика» бар компьютерлер немесе планшеттер, тапсырма карточкалары, ұлғайтқыш","live":"ұлғайтқыш, көзілдірік, камералар мен телефондардың объективтері","cr":["Есепте жұқа линза формуласын қолданады: «Берілгені», СИ, есептеу","Линзаның сызықтық ұлғаю формуласын қолданады","Линзаның оптикалық күшін және түрін анықтайды"],"sec":"8.4 А Жарық құбылыстары (8 с)","goals":[{"c":"8.5.1.11","t":"жұқа линза формуласын есептер шығару үшін қолдану"},{"c":"8.5.1.12","t":"линзаның сызықтық ұлғаю формуласын сандық және графиктік есептер шығару үшін қолдану"}],"compN":["Цифрлық технологияларды шығармашылықпен пайдалану (DigComp)","Зерттеушілік ойлау (GreenComp)","Сыни ойлау (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Ұлғайтқыш әріптерді үлкейтеді, ал жақыннан көрмейтіндерге арналған көзілдірік кішірейтеді. Линзалар арасындағы айырмашылық неде?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Жарықтың сынуы дегеніміз не?","- Ұлғаюды қалай анықтайды?","- Линзалар пішіні бойынша қандай болады?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + PhET «Геометриялық оптика» симуляциясында зерттеу.","Топтар симуляцияда жинағыш линза үшін кескінге дейінгі қашықтықтың затқа дейінгі қашықтыққа тәуелділігін зерттеп, жұқа линзаның формуласын қорытады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – қадамдық тапсырма, кесте және көмекші сұрақтары бар карточка;","- **2-саты «Кеңес»** – кеңестері бар тапсырма, үлгісіз кесте;","- **3-саты «Өздігінен»** – мәндерді өздері таңдап, d, f және F байланысын қорытады.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Затқа дейінгі қашықтықты өзгертіп, кескінге дейінгі қашықтықты жазады","Фокустық қашықтығы мен оптикалық күшті есептейді","Жұқа линза формуласын және сызықтық ұлғаюды қолданады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["PhET «Геометриялық оптика» бар компьютерлер немесе планшеттер, тапсырма карточкалары, ұлғайтқыш"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Оптикалық күш D = 1/F, бірлігі – диоптрия (дптр); жинағыш линзада D > 0, шашыратқыш линзада D \u003c 0","- Жұқа линза формуласы: 1/d + 1/f = 1/F","- Сызықтық ұлғаю Γ = f/d = H/h"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; жұқа линза формуласына екі есеп шығару;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Жұқа линза формуласын есептер шығару үшін қолдану."],["Тақырыбы","Линзалар. Линзаның оптикалық күші. Жұқа линзаның формуласы"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","PhET «Геометриялық оптика» бар компьютерлер немесе планшеттер, тапсырма карточкалары, ұлғайтқыш"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","ұлғайтқыш, көзілдірік, камералар мен телефондардың объективтері"],["№ 1 «Құзыреттілікті таңдаңыз»",["**d.20** Цифрлық технологияларды шығармашылықпен пайдалану (DigComp)","**g.9** Зерттеушілік ойлау (GreenComp)","**l.8** Сыни ойлау (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + PhET «Геометриялық оптика» симуляциясында зерттеу."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"31":{"kind":"new","t":"Линзалардағы кескіндерді салу","hook":"Кабинеттегі проектор экранда үлкен төңкерілген кескін береді, ал ұлғайтқыш – ұлғайған түзу кескін. Олар неге әртүрлі?","dq":["Жұқа линза формуласын жазыңыз","Линзаның фокусы дегеніміз не?","Шын кескін жорамал кескіннен немен ерекшеленеді?"],"m":"ынтымақтастықта оқыту + салу және тәжірибемен тексеру","act":"Топтар үш тамаша сәулені пайдаланып, жинағыш және шашыратқыш линзадағы зат кескінін салып, оптикалық скамьяда немесе симуляцияда салынғанды тексереді.","t1":"заттың екі орны үшін салудың дайын сызбалары, жазбаларын толықтыру керек","t2":"бір сәуленің жолы белгіленген сызбалар, қалғандарын аяқтау керек","t3":"заттың барлық орны үшін кескіндерді өздері салып, сипаттамалар кестесін құрады","s":["Линза арқылы сәулелердің жолын салады (оське параллель, центр арқылы, фокус арқылы)","d > 2F, F \u003c d \u003c 2F, d \u003c F кезінде кескін түрін анықтайды","Кескін сипаттамаларының кестесін құрады"],"con":["d > 2F: кескін кішірейген, нақты, төңкерілген; F \u003c d \u003c 2F: ұлғайған, нақты, төңкерілген; d \u003c F: ұлғайған, жорамал, түзу","Шашыратқыш линза әрқашан жорамал, түзу, кішірейген кескін береді","Проектор F \u003c d \u003c 2F кезінде, ұлғайтқыш d \u003c F кезінде жұмыс істейді"],"tk":[["Жинағыш линзада d > 2F кезіндегі зат кескінін салып, сипаттаңыз.","Кішірейген, нақты, төңкерілген"],["Ұлғайтқыш қандай кескін береді?","Жорамал, түзу, ұлғайған (d \u003c F)"],["Шашыратқыш линза қандай кескін береді?","Жорамал, түзу, кішірейген"],["F = 12 см, d = 36 см. f табып, кескінді сипаттаңыз.","1/f = 1/12 − 1/36 = 2/36; f = 18 см; d > 2F: кішірейген, нақты, төңкерілген"]],"hw":"тақырып бойынша параграф; заттың екі орны үшін линзадағы кескіндерді салу","res":"оптикалық скамья, шам немесе жарқырайтын зат, линзалар, экран, сызбалары бар карточкалар","live":"проектор, фотоаппарат, ұлғайтқыш, көзілдірік","tb":"лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау","cr":["Жұқа линзада сәулелердің жолын салады","Алынған кескінді сипаттайды (түрі, өлшемі, орны)","Заттың орны мен кескін түрін сәйкестендіреді"],"sec":"8.4 А Жарық құбылыстары (8 с)","goals":[{"c":"8.5.1.13","t":"жұқа линзада сәуленің жолын салу және кескінге сипаттама беру"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Жүйелі ойлау (GreenComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Кабинеттегі проектор экранда үлкен төңкерілген кескін береді, ал ұлғайтқыш – ұлғайған түзу кескін. Олар неге әртүрлі?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Жұқа линза формуласын жазыңыз","- Линзаның фокусы дегеніміз не?","- Шын кескін жорамал кескіннен немен ерекшеленеді?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + салу және тәжірибемен тексеру.","Топтар үш тамаша сәулені пайдаланып, жинағыш және шашыратқыш линзадағы зат кескінін салып, оптикалық скамьяда немесе симуляцияда салынғанды тексереді.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – заттың екі орны үшін салудың дайын сызбалары, жазбаларын толықтыру керек;","- **2-саты «Кеңес»** – бір сәуленің жолы белгіленген сызбалар, қалғандарын аяқтау керек;","- **3-саты «Өздігінен»** – заттың барлық орны үшін кескіндерді өздері салып, сипаттамалар кестесін құрады.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Линза арқылы сәулелердің жолын салады (оське параллель, центр арқылы, фокус арқылы)","d > 2F, F \u003c d \u003c 2F, d \u003c F кезінде кескін түрін анықтайды","Кескін сипаттамаларының кестесін құрады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["оптикалық скамья, шам немесе жарқырайтын зат, линзалар, экран, сызбалары бар карточкалар"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- d > 2F: кескін кішірейген, нақты, төңкерілген; F \u003c d \u003c 2F: ұлғайған, нақты, төңкерілген; d \u003c F: ұлғайған, жорамал, түзу","- Шашыратқыш линза әрқашан жорамал, түзу, кішірейген кескін береді","- Проектор F \u003c d \u003c 2F кезінде, ұлғайтқыш d \u003c F кезінде жұмыс істейді"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; заттың екі орны үшін линзадағы кескіндерді салу;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Жұқа линзада сәуленің жолын салу және кескінге сипаттама беру."],["Тақырыбы","Линзалардағы кескіндерді салу"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","оптикалық скамья, шам немесе жарқырайтын зат, линзалар, экран, сызбалары бар карточкалар"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","проектор, фотоаппарат, ұлғайтқыш, көзілдірік"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)","**g.4** Жүйелі ойлау (GreenComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + салу және тәжірибемен тексеру."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"32":{"kind":"sor","t":"Сфералық айналар. Сфералық айнадағы кескінді салу. «Жарық құбылыстары» бөлімі бойынша БЖБ № 7","hook":"Автомобиль фарасы жіңішке қуатты шоқ береді, ал дүкендегі айна бүкіл залды көруге мүмкіндік береді. Қисық айналар қалай жұмыс істейді?","dq":["Жазық айнадағы кескінді қалай салады?","Фокус дегеніміз не?","Жарықтың шағылу заңдарын атаңыз"],"m":"жұппен жұмыс + кескіндерді салу","act":"Жұптар ойыс және дөңес айналарды зерттеп, фокусты (F = R/2) тауып, екі сәуле көмегімен зат кескінін салады.","t1":"заттың бір орны үшін салудың дайын сызбалары, жазбаларын толықтыру керек","t2":"бір сәулесі бар сызбалар, екіншісін аяқтау керек","t3":"заттың әртүрлі орны үшін кескіндерді өздері салып, айналардың қолданылуын түсіндіреді","s":["Параллель шоқ бойынша ойыс айнаның фокусын табады","Ойыс айнадағы зат кескінін салады","Кескіннің сипаттамаларын айтады"],"con":["Сфералық айнаның фокустық қашықтығы F = R/2; ойыс айна сәулелерді жинайды, дөңес айна шашыратады","Салу үшін сәулелер: оське параллель (фокус арқылы), қисықтық центрі арқылы","Ойыс айна d > 2F кезінде кішірейген, нақты, төңкерілген кескін береді"],"tk":[["Түсу бұрышы 40°. Түскен және шағылған сәулелер арасындағы бұрыш неге тең?","80°"],["Заттың сыну көрсеткіші 1,6. Толық шағылудың шектік бұрышын табыңыз.","sin α₀ = 1/1,6 = 0,625; α₀ ≈ 39°"],["Ойыс айна, F = 5 см, d = 20 см. Кескінге дейінгі қашықтықты және ұлғаюды табыңыз.","1/f = 1/5 − 1/20 = 3/20; f ≈ 6,7 см; Γ = f/d ≈ 0,33"],["Ойыс айнада d > 2F кезіндегі кескінді салып, сипаттаңыз.","Кішірейген, нақты, төңкерілген"]],"hw":"№ 11 ЗЖ-ға дайындалу: жұқа линза формуласын қайталау","res":"ойыс және дөңес айналар, сызбалары бар карточкалар, БЖБ нұсқаларының карточкалары","live":"фаралар, дүкендер мен жолдардағы айналар, телескоптар","cr":["Сфералық айналарда сәулелердің жолын салып, кескінді сипаттайды","Бөлім есептерінде шағылу және сыну заңдарын қолданады","Линза немесе айна формуласын дұрыс есептеп қолданады"],"sec":"8.4 А Жарық құбылыстары (8 с)","goals":[{"c":"8.5.1.5","t":"дененің кескінін алу үшін сфералық айнада сәуленің жолын салу және алынған кескінді сипаттау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Сыни ойлау (LifeComp)","Цифрлық технологияларды шығармашылықпен пайдалану (DigComp)"],"stages":[{"tm":"0–3","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Автомобиль фарасы жіңішке қуатты шоқ береді, ал дүкендегі айна бүкіл залды көруге мүмкіндік береді. Қисық айналар қалай жұмыс істейді?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Жазық айнадағы кескінді қалай салады?","- Фокус дегеніміз не?","- Жарықтың шағылу заңдарын атаңыз","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"3–5","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"5–17","name":"3. Жаңа материалды меңгеру","tch":["**Scaffold оқыту әдісі:** жұппен жұмыс + кескіндерді салу.","Жұптар ойыс және дөңес айналарды зерттеп, фокусты (F = R/2) тауып, екі сәуле көмегімен зат кескінін салады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – заттың бір орны үшін салудың дайын сызбалары, жазбаларын толықтыру керек;","- **2-саты «Кеңес»** – бір сәулесі бар сызбалар, екіншісін аяқтау керек;","- **3-саты «Өздігінен»** – заттың әртүрлі орны үшін кескіндерді өздері салып, айналардың қолданылуын түсіндіреді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Параллель шоқ бойынша ойыс айнаның фокусын табады","Ойыс айнадағы зат кескінін салады","Кескіннің сипаттамаларын айтады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["ойыс және дөңес айналар, сызбалары бар карточкалар, БЖБ нұсқаларының карточкалары"]},{"tm":"17–20","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Сфералық айнаның фокустық қашықтығы F = R/2; ойыс айна сәулелерді жинайды, дөңес айна шашыратады","- Салу үшін сәулелер: оське параллель (фокус арқылы), қисықтық центрі арқылы","- Ойыс айна d > 2F кезінде кішірейген, нақты, төңкерілген кескін береді"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"20–40","name":"5. Бөлім бойынша жиынтық бағалау (БЖБ)","tch":["Бөлім бойынша жиынтық бағалауды ұйымдастырады (20 мин, жеке, 4 тапсырма, ең жоғары балл – 10). БЖБ тапсырмалары – қосымшада. Бұл кезеңде тіректер алынады."],"stu":["БЖБ тапсырмаларын өздігінен, кеңессіз орындайды."],"ass":["**Жиынтық.** Дескрипторлар бойынша балл (қосымша)."],"res":["БЖБ нұсқаларының карточкалары","Калькулятор","Шамалар кестелері"]},{"tm":"40–43","name":"6. Өзін-өзі тексеру. Үй тапсырмасы","tch":["Эталон мен критерийлерді таратады; оқушылар жауаптарын тексеріп, қателерін белгілейді. Баллды келесі сабақта хабарлайды.","**Үй тапсырмасы:** № 11 ЗЖ-ға дайындалу: жұқа линза формуласын қайталау."],"stu":["Жауаптарын эталонмен салыстырып, қателерін белгілейді.","Үй тапсырмасын жазады."],"ass":["**Өзін-өзі бағалау** эталон бойынша."],"res":["Жауап эталоны","Критерийлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Дененің кескінін алу үшін сфералық айнада сәуленің жолын салу және алынған кескінді сипаттау."],["Тақырыбы","Сфералық айналар. Сфералық айнадағы кескінді салу. «Жарық құбылыстары» бөлімі бойынша БЖБ № 7"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","ойыс және дөңес айналар, сызбалары бар карточкалар, БЖБ нұсқаларының карточкалары"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","фаралар, дүкендер мен жолдардағы айналар, телескоптар"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.8** Сыни ойлау (LifeComp)","**d.20** Цифрлық технологияларды шығармашылықпен пайдалану (DigComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Жұппен жұмыс + кескіндерді салу."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; қорытынды – бөлім бойынша жиынтық бағалау (БЖБ); соңында – «Өзін-өзі талдау»."],["Қолдау қағидаты","Тірек біртіндеп алынады; БЖБ кезеңінде оқушылар өздігінен жұмыс істейді."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"33":{"kind":"lab","t":"№ 11 ЗЖ «Жұқа линзаның фокустық қашықтығы мен оптикалық күшін анықтау»","hook":"Линзаның төлқұжат деректерін білмей, оның фокустық қашықтығын қалай білуге болады?","dq":["Жұқа линза формуласын жазыңыз","F мен D қалай байланысқан?","Линзада кескінді қалай салады?"],"m":"ынтымақтастықта оқыту + зертханалық жұмыс","act":"Зертханалық жұмыс: оптикалық скамьяда жарқырайтын заттың экрандағы шын кескінін алып, d мен f өлшейді (3 тәжірибе), F = d·f/(d + f) және D = 1/F есептейді.","t1":"қадамдық нұсқаулық, скамья сызбасы және жазу үлгісі бар кесте","t2":"кейбір қадамдары жоқ жоспар, үлгісіз кесте","t3":"тәжірибені өздері жоспарлап, қателікті бағалап, төлқұжаттағы F-пен салыстырады","s":["Заттың үш орнында экранда шын кескін алады","d мен f өлшеп, F және D есептейді","Орташа мәнін тауып, қателікті бағалайды"],"con":["F = d·f/(d + f); D = 1/F","d = f = 2F кезінде кескін заттың өлшеміндей болады","Орташа мән кездейсоқ қателіктердің әсерін азайтады"],"tk":[["d = 30 см, f = 15 см. F және D табыңыз.","F = 30·15/45 = 10 см; D = 10 дптр"],["Ұлғайтқыштың оптикалық күші 10 дптр. Фокустық қашықтығын табыңыз.","F = 0,1 м = 10 см"],["d = f = 40 см кезінде заттың өлшеміндей кескін алынды. F табыңыз.","F = 40·40/80 = 20 см (d = f = 2F)"],["Өлшегенде неге үш тәжірибе жасап, орташа мәнін табады?","Бұл кездейсоқ қателіктердің әсерін азайтады"]],"hw":"№ 11 ЗЖ қорытындысын рәсімдеу; «Оптикалық аспаптар» параграфы","res":"оптикалық скамья, линза, жарық көзі (жарқырайтын зат), экран, сызғыш","live":"көзілдірік, объективтер, ұлғайтқыш","tb":"лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау","cr":["Линзаның фокустық қашықтығы мен оптикалық күшін анықтайды","Өлшеулерді қателікті ескеріп жазады","Нәтижені түсіндіріп, күтілетін мәнмен салыстырады","Қауіпсіздік техникасын сақтайды"],"sec":"8.4 А Жарық құбылыстары (8 с)","goals":[{"c":"8.5.1.14","t":"жұқа линзаның фокустық қашықтығын және оптикалық күшін анықтау"},{"c":"8.1.3.3","t":"физика кабинетінде қауіпсіздік ережелерін білу және сақтау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Тәжірибе арқылы оқу (EntreComp)","Ынтымақтастық (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Линзаның төлқұжат деректерін білмей, оның фокустық қашықтығын қалай білуге болады?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Жұқа линза формуласын жазыңыз","- F мен D қалай байланысқан?","- Линзада кескінді қалай салады?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс: оптикалық скамьяда жарқырайтын заттың экрандағы шын кескінін алып, d мен f өлшейді (3 тәжірибе), F = d·f/(d + f) және D = 1/F есептейді.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – қадамдық нұсқаулық, скамья сызбасы және жазу үлгісі бар кесте;","- **2-саты «Кеңес»** – кейбір қадамдары жоқ жоспар, үлгісіз кесте;","- **3-саты «Өздігінен»** – тәжірибені өздері жоспарлап, қателікті бағалап, төлқұжаттағы F-пен салыстырады.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Заттың үш орнында экранда шын кескін алады","d мен f өлшеп, F және D есептейді","Орташа мәнін тауып, қателікті бағалайды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["оптикалық скамья, линза, жарық көзі (жарқырайтын зат), экран, сызғыш"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- F = d·f/(d + f); D = 1/F","- d = f = 2F кезінде кескін заттың өлшеміндей болады","- Орташа мән кездейсоқ қателіктердің әсерін азайтады"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 11 ЗЖ қорытындысын рәсімдеу; «Оптикалық аспаптар» параграфы;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты м
