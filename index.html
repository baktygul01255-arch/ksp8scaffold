<style>
/* Концепт: «меловая доска и бумага» — тёплая бумага днём, зелёная грифельная доска ночью.

:root{
  --bg:#f3efe6; --surface:#fffdf8; --surface2:#ebe6d8; --fg:#1b2a28; --muted:#586966; --line:#d8d0bc;
  --accent:#0d6e62; --accent-fg:#ffffff; --accent-soft:#d3ebe5; --g:#1e9a55; --y:#d9a400; --r:#d23f3f;
  --board:#fffdf8; --shadow:0 6px 24px rgba(40,50,40,.12); --fs:1;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1d1b; --surface:#162926; --surface2:#1e3733; --fg:#e9f1ee; --muted:#9bb2ac; --line:#2c4742;
  --accent:#5fd1be; --accent-fg:#0a1d1a; --accent-soft:#1d4640; --g:#3ecf7b; --y:#f2c84b; --r:#ff6b6b;
  --board:#0c1816; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1d1b; --surface:#162926; --surface2:#1e3733; --fg:#e9f1ee; --muted:#9bb2ac; --line:#2c4742;
  --accent:#5fd1be; --accent-fg:#0a1d1a; --accent-soft:#1d4640; --g:#3ecf7b; --y:#f2c84b; --r:#ff6b6b;
  --board:#0c1816; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:calc(var(--fs)*clamp(16px,0.9vw + 10px,26px));line-height:1.45;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.2;text-wrap:balance}

.rail .grow{flex:1}
.lessonbtn{display:flex;align-items:center;gap:.6em;background:var(--surface);border:2px solid var(--line);border-radius:.9em;padding:.4em .6em;text-align:left;min-height:3em;width:100%}
.lessonbtn .num{font-family:var(--serif);font-weight:700;background:var(--accent);color:var(--accent-fg);border-radius:.6em;min-width:2.2em;height:2.2em;display:grid;place-items:center;flex:none}

.seg{display:flex;background:var(--surface2);border-radius:.8em;padding:.2em;gap:.15em}
.seg button{flex:1;padding:.4em .5em;border-radius:.65em;font-weight:700;min-height:2.6em;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:2.5em;min-width:2.5em;padding:0 .5em;border-radius:.8em;background:var(--surface);border:2px solid var(--line);font-weight:500}
.ibtn:active,.dockb:active,.big:active{transform:scale(.97)}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:.35em}

.tmeta{color:var(--muted);font-size:.8em}
.rail.min .tdisp{font-size:1em}

.dockb span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dockb svg.i{width:2.1em;height:2.1em}
.rail.min .dockb span{display:none}
.rail.min .dockb{min-height:3em}
.dockb[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.app.side{grid-template-columns:auto minmax(0,1fr) auto}
.sidep{position:sticky;top:0;height:100vh;height:100dvh;width:15em;overflow-y:auto;display:flex;flex-direction:column;gap:.6em;font-size:.85em;background:var(--surface);border:2px solid var(--line);border-radius:1em;padding:.6em;margin-block:max(.6em,env(safe-area-inset-top,0px));height:calc(100dvh - 1.2em - env(safe-area-inset-top,0px));box-shadow:var(--shadow);z-index:44}
.sidep h3{font-size:1.1em;display:flex;justify-content:space-between;align-items:center;gap:.4em}
.sidep .light{flex-direction:row;width:auto;justify-content:center;padding:.5em}
.sidep .light button{width:3.6em;height:3.6em}
.sidep .tcount{display:grid;grid-template-columns:1.2em minmax(0,1fr) 2.3em 1.6em 2.3em;align-items:center;gap:.3em}.sidep .tcount .dot{width:1.2em!important;height:1.2em!important}.sidep .tcount>div{flex:none!important;font-size:.7em;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}.sidep .cnt{font-size:1.5em;min-width:0}.sidep .pm{width:2.3em;height:2.3em;font-size:1em}.sidep .tgrid .grid{grid-template-columns:1fr;gap:.35em}
.sidep .tgrid{display:flex;flex-direction:column;gap:.4em}
.sidep .card{padding:.4em .6em}
main .tl3{grid-template-columns:repeat(3,minmax(0,1fr))}

main{display:flex;flex-direction:column;gap:.8em;min-height:100vh;min-height:100dvh;padding-block:max(.6em,env(safe-area-inset-top,0px)) max(.6em,env(safe-area-inset-bottom,0px));min-width:0}

@media(max-width:760px){

}
/* режимы: экран учащихся (крупно) и экран учителя */
body.m-st{font-size:calc(var(--fs)*1.22*clamp(16px,0.9vw + 10px,26px))}
body.m-st .rail{font-size:calc(.82em / 1.22)}
.seg3{display:grid;grid-template-columns:1fr 1fr}
.tex{display:grid;gap:.8em;grid-template-columns:repeat(auto-fit,minmax(min(100%,19em),1fr))}

.stl{display:flex;flex-direction:column;gap:.7em}

.tabs{display:flex;gap:.4em;flex-wrap:wrap}

a.big{text-decoration:none}

.sw{width:2.4em;height:2.4em;border-radius:50%;border:3px solid var(--line)}

.pickbox{min-height:7em;display:grid;place-items:center;text-align:center;background:var(--surface);border:3px dashed var(--accent);border-radius:1em;padding:.6em;font-family:var(--serif);font-weight:700;font-size:2.6em;line-height:1.1;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:.4em}
.tag{background:var(--surface2);border-radius:2em;padding:.1em .7em;font-size:.8em}
.tag.used{text-decoration:line-through;opacity:.5}
.gcard{background:var(--surface);border:2px solid var(--line);border-radius:.9em;padding:.6em .9em}
.gcard h3{font-size:1em;color:var(--accent);margin-bottom:.3em}
.gcard div{display:flex;justify-content:space-between;gap:.5em}
.gcard small{color:var(--muted)}

.light{display:flex;flex-direction:column;gap:.6em;background:#222;border-radius:1.2em;padding:.7em;width:6.5em;flex:none}
.light button{width:5em;height:5em;border-radius:50%;opacity:.22;border:3px solid #000}
.light button.on{opacity:1;box-shadow:0 0 28px currentColor}
.lg{background:var(--g);color:var(--g)}.ly{background:var(--y);color:var(--y)}.lr{background:var(--r);color:var(--r)}
.tcount{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.cnt{font-family:var(--serif);font-weight:700;font-size:2.4em;min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.pm{width:3em;height:3em;border-radius:50%;background:var(--surface2);font-size:1.2em;font-weight:700}
.bars{display:flex;height:1.4em;border-radius:1em;overflow:hidden;background:var(--surface2)}
.bars i{display:block;height:100%;transition:width .3s}
.bigtimer{font-family:var(--serif);font-weight:700;font-size:min(22vw,9em);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
@media(max-width:700px){.top{position:static}}
@media(max-width:560px){.dockb{min-width:3.9em}.pickbox{font-size:2em}}

й парты. Почему?","**Диагностика исходного уровня** (карточка Scaffold «Определите уровень компетенции», метод «Учебные вопросы»):","- Из чего состоят вещества?","- Чем отличается расположение молекул во льду и в воде?","- Чем и в каких единицах измеряют температуру?","По итогам определяет ступень поддержки (1, 2 или 3) для каждой группы. Формирует группы по 4 человека разного уровня подготовки."],"stu":["Отвечают на вопросы мотивации, высказывают гипотезу.","Выполняют диагностические задания.","Объединяются в группы и распределяют роли: организатор, исполнитель, регистратор, докладчик."],"ass":["**Диагностическое.** Метод «Учебные вопросы».","Результат фиксируется в листе наблюдения: все ответы верны – высокий уровень, часть – средний, мало – начальный."],"res":["Слайд","Карточки вопросов / Quizizz","Лист наблюдения"]},{"tm":"5–8","name":"2. Постановка цели","tch":["По гипотезам и результатам диагностики предлагает сформулировать тему и цель урока.","Знакомит с критериями успеха (чек-лист «Я смогу…»).","**Техника безопасности** (8.1.3.3): горячую воду переносить осторожно."],"stu":["Формулируют тему и цель урока своими словами.","Читают критерии успеха."],"ass":["**Формативное.** Наблюдение; приём «Большой палец» – готовность к работе."],"res":["Слайд с темой и критериями"]},{"tm":"8–25","name":"3. Исследование нового материала","tch":["**Метод обучения Scaffold:** обучение в сотрудничестве + демонстрационный эксперимент.","Группы работают на трёх станциях по 5 мин: «Диффузия» (краситель в холодной и тёплой воде), «Тепловое расширение» (жидкостный термометр), «Шкалы» (перевод °C в К).","**Три ступени поддержки** (Приложение):","- **ступень 1 «Опора»** – карточки станций с готовой таблицей наблюдений и образцом перевода температуры;","- **ступень 2 «Подсказка»** – карточки станций с вопросами, таблица без образца;","- **ступень 3 «Самостоятельно»** – сами выдвигают гипотезу и планируют наблюдение диффузии при разной температуре воды.","Консультирует по правилу «снач плива загрязняет атмосферу, поэтому нужны экологичные источники энергии"],"tk":[["Назовите три вида теплопередачи и приведите пример каждого.","Теплопроводность – ложка в чае; конвекция – батарея; излучение – Солнце"],["Переведите 50 °C в кельвины и 350 К в °C.","323 К; 77 °C"],["Сколько теплоты нужно, чтобы нагреть 3 кг воды от 15 °C до 65 °C? (c = 4200 Дж/(кг·°C))","Q = 4200·3·50 = 630 000 Дж = 630 кДж"],["Сколько теплоты выделится при полном сгорании 2 кг каменного угля? (q = 2,7·10⁷ Дж/кг)","Q = 2,7·10⁷·2 = 5,4·10⁷ Дж = 54 МДж"]],"hw":"повторить формулу Q = c·m·Δt и уравнение теплового баланса к лабораторной работе № 1","res":"таблица удельной теплоты сгорания, карточки вариантов СОР","live":"отопление, выбор топлива, экология города","cr":["Применяет формулу Q = q·m: записывает «Дано», переводит в СИ","Выполняет верный расчёт и записывает ответ с единицей","Решает задачи на нагревание и теплопередачу (раздел в целом)"],"sec":"8.1 A: Тепловые явления (5ч)","goals":[{"c":"8.3.2.7","t":"применять формулу количества теплоты, выделяемого при сгорании топлива, в решении задач"}],"compN":["Охрана природы (GreenComp)","Этическое и устойчивое мышление (EntreComp)","Критическое мышление (LifeComp)"],"stages":[{"tm":"0–3","name":"1. Начало урока. Диагностика","tch":["Приветствует класс, проверяет готовность к уроку.","**Мотивация.** Что выгоднее для отопления: дрова, уголь или природный газ? Как это сравнить?","**Диагностика исходного уровня** (карточка Scaffold «Определите уровень компетенции», метод «Учебные вопросы»):","- Что происходит при горении топлива?","- Какая формула связывает Q, m и Δt при нагревании?","- Назовите виды топлива","По итогам определяет ступень поддержки (1, 2 или 3) для каждой группы. Формирует группы по 4 человека разного уровня подготовки."],"stu":["Отвечают на вопросы мотивации, высказывают гипотезу.","Выполняют диагностические задания.","Объединяются в группы и распределяют роли: организатор, исполнитель, регистратор, докладчик."],"ass":["**Д  кг топлива","- Сжигание топлива загрязняет атмосферу, поэтому нужны экологичные источники энергии"],"stu":["Сравнивают результаты групп, формулируют вывод.","Сверяют вывод с гипотезой начала урока.","Записывают вывод в тетрадь."],"ass":["**Формативное.** Метод «Учебные вопросы»: вопросы на объяснение и прогноз."],"res":["Слайд","Учебник: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8 класс"]},{"tm":"20–40","name":"5. Суммативное оценивание за раздел (СОР)","tch":["Организует суммативное оценивание за раздел (20 мин, индивидуально, 4 задания, максимум 10 баллов). Задания СОР – в Приложении. На этом этапе опоры снимаются."],"stu":["Выполняют задания СОР самостоятельно, без подсказок."],"ass":["**Суммативное.** Баллы по дескрипторам (Приложение)."],"res":["Карточки вариантов СОР","Калькулятор","Таблицы величин"]},{"tm":"40–43","name":"6. Самопроверка. Домашнее задание","tch":["Раздаёт эталон и критерии; учащиеся сверяют ответы и отмечают ошибки. Баллы сообщит на следующем уроке.","**Домашнее задание:** повторить формулу Q = c·m·Δt и уравнение теплового баланса к лабораторной работе № 1."],"stu":["Сверяют ответы с эталоном, отмечают ошибки.","Записывают домашнее задание."],"ass":["**Самооценивание** по эталону."],"res":["Эталон ответов","Критерии"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Метод оценки Scaffold – «Самоанализ».** Предлагает ответить на вопросы:","- Что мне удалось хорошо?","- Что вызвало трудность?","- Что я сделаю, чтобы улучшить результат?","Просит отметить уровень освоения цели на шкале «Светофор»."],"stu":["Заполняют листок самооценки.","Отмечают на шкале «Светофор»: понял(а) полностью / есть вопросы / нужна помощь."],"ass":["**Самооценивание** по критериям успеха."],"res":["Листок самооценки","Шкала «Светофор»"]}],"pass":[["Длительность","1 урок, 45 минут"],["Цель","Применять формулу количества теплоты, выделяемого при сгорании топлива, в решении задач."],["Тема","Энергия топлива. Удельная теплота сгорания топлива. СОР № 1 по разделу «Тепловые явления»"],["Целевая аудитория","8 класс музыкальной школы-интерната; работа в группах по 4 человека"],["Потребности","Визуальная опора (схемы, графики, карточки); дополнительное время и пошаговые инструкции для части класса; выбор ступени поддержки. Для учащихся с особыми образовательными потребностями – ступень 1, укрупнённый шрифт, индивидуальный темп."],["Ресурсы","таблица удельной теплоты сгорания, карточки вариантов СОР"],["Место","Кабинет физики"],["Связи с реальной жизнью","отопление, выбор топлива, экология города"],["№ 1 «Выберите компетенцию»",["**g.3** Охрана природы (GreenComp)","**e.5** Этическое и устойчивое мышление (EntreComp)","**l.8** Критическое мышление (LifeComp)"]],["№ 2 «Определите уровень компетенции»","Диагностика в начале урока методом «Учебные вопросы»; по результатам выбирается ступень поддержки."],["№ 3 «Выберите метод обучения»","Работа в парах + анализ таблицы."],["№ 4 «Ожидаемые результаты»","Результат деятельности групп и отдельных учащихся по критериям успеха (Приложение 3); выполненные задачи; листок самооценки."],["№ 5 «Выберите метод оценки»","В начале – «Учебные вопросы»; в ходе – «Наблюдение»; итог – суммативное оценивание за раздел (СОР); в конце – «Самоанализ»."],["Принцип поддержки","Опора снимается постепенно; на этапе СОР учащиеся работают самостоятельно."]],"lev":["все дескрипторы – высокий","часть – средний","0–1 – начальный"]},"5":{"kind":"lab","t":"Закон сохранения и превращения энергии в тепловых процессах. Л.Р. № 1 «Сравнение количеств теплоты при смешивании воды разной температуры»","hook":"Если смешать кружку кипятка и кружку холодной воды, какая температура получится? Куда «девается» часть тепла?","dq":["По какой формуле считают Q при нагревании?","Что такое температура смеси?","Какие приборы нужны для измерения температуры и массы?"],"m":"обучение в сотрудничестве + лабораторное занятие","act":"Лабораторная работа: измерить массу и температуру холодной воды, добавить горячую воду, измерить температуру смеси θ, найти Q отданное и Q полученное и сравнить.","t1":"пошаговая инструкция и таблица с образцом записи","t2":"план работы с пропущенными шагами, таблица без образца","t3":"сами составляют план, таблицу и оценивают возможные потери теплоты","s":["Измеряют массы и температуры воды, температуру смеси θ","Считают Q₁ = c·m₁·(t₁ − θ) и Q₂ = c·m₂·(θ − t₂)","Сравнивают Q₁ и Q₂, объясняют расхождение (потери теплоты, погрешности)"],"con":["Q отданное = Q полученное (уравнение теплового баланса): c·m₁·(t₁ − θ) = c·m₂·(θ − t₂)","Небольшое расхождение объясняется потерями теплоты в окружающую среду и нагреванием сосуда","Энергия не исчезает, а переходит от одного тела к другому"],"tk":[["Горячая вода 200 г при 80 °C смешана с холодной водой 100 г при 20 °C. Найдите температуру смеси.","θ = (200·80 + 100·20)/300 = 60 °C"],["300 г воды при 90 °C влили в 200 г воды при 15 °C. Найдите θ.","θ = (300·90 + 200·15)/500 = 60 °C"],["Смешали 1 кг воды при 10 °C и 1 кг воды при 50 °C. Найдите θ.","θ = 30 °C"],["Горячая вода массой 0,2 кг остыла с 90 °C до 60 °C. Сколько теплоты отдала? Сколько получит холодная вода без потерь?","Q = 4200·0,2·30 = 25 200 Дж; холодная вода получит 25 200 Дж"]],"hw":"оформить вывод Л.Р. № 1; решить две задачи на тепловой баланс","res":"два стакана или калориметр, горячая и холодная вода, термометр, мензурка или весы","live":"заваривание чая, смешивание воды в душе до нужной температуры","tb":"горячую воду (не выше 60–70 °C) наливать осторожно, пролитую воду сразу вытирать","cr":["Записывает массы и температуры, рассчитывает Q отданное и Q полученное","Определяет факторы, влияющие на результат (потери теплоты, точность термометра), сравнивает Q₁ и Q₂","Применяет уравнение теплового баланса в задаче","Соблюдает технику безопасности"],"sec":"8.1 A: Тепловые явления (5ч)","goals":[{"c":"8.3.2.9","t":"применять уравнение теплового баланса при решении задач"},{"c":"8.3.2.8","t":"исследовать закон сохранения и превращения энергии в тепловых процессах"},{"c":"8.1.3.2","t":"определять факторы, влияющие на проведение эксперимента"},{"c":"8.1.3.3","t":"знать и соблюдать технику безопасности в кабинете физики"}],"compN":["Исследовательское мышление (GreenComp)","Обучение через опыт (EntreComp)","Сотрудничество (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Начало урока. Диагностика","tch":["Приветствует класс, проверяет готовность к уроку.","**Мотивация.** Если смешать кружку кипятка и кружку холодной воды, какая температура получится? Куда «девается» часть тепла?","**Диагностика исходного уровня** (карточка Scaffold «Определите уровень компетенции», метод «Учебные вопросы»):","- По какой формуле считают Q при нагревании?","- Что такое температура смеси?","- Какие приборы нужны для измерения температуры и массы?","По итогам определяет ступень поддержки (1, 2 или 3) для каждой группы. Формирует группы по 4 человека разного уровня подготовки."],"stu":["Отвечают на вопросы мотивации, высказывают гипотезу.","Выполняют диагностические задания.","Объединяются в группы и распределяют роли: организатор, исполнитель, регистратор, докладчик."],"ass":["**Диагностическое.** Метод «Учебные вопросы».","Результат фиксируется в листе наблюдения: все ответы верны – высокий уровень, часть – средний, мало – начальный."],"res":["Слайд","Карточки вопросов / Quizizz","Лист наблюдения"]},{"tm":"5–8","name":"2. Постановка цели. Техника безопасности","tch":["По гипотезам и результатам диагностики предлагает сформулировать тему и цель урока.","Знакомит с критериями успеха (чек-лист «Я смогу…»).","**Техника безопасности** (8.1.3.3): горячую воду (не выше 60–70 °C) наливать осторожно, пролитую воду сразу вытирать."],"stu":["Формулируют тему и цель урока своими словами.","Читают критерии успеха."],"ass":["**Формативное.** Наблюдение; приём «Большой палец» – готовность к работе."],"res":["Слайд с темой и критериями"]},{"tm":"8–25","name":"3. Лабораторная работа","tch":["**Метод обучения Scaffold:** обучение в сотрудничестве + лабораторное занятие.","Лабораторная работа: измерить массу и температуру холодной воды, добавить горячую воду, измерить температуру смеси θ, найти Q отданное и Q полученное и сравнить.","**Три ступени поддержки** (Приложение):","- **ступень 1 «Опора»** – пошаговая инструкция и таблица с образцом записи;","- **ступень 2 «Подсказка»** – план работы с пропущенными шагами, таблица без образца;","- **ступень 3 «Самостоятельно»** – сами составляют план, таблицу и оценивают возможные потери теплоты.","Консультирует по правилу «сначала вопрос, потом подсказка»."],"stu":["Измеряют массы и температуры воды, температуру смеси θ","Считают Q₁ = c·m₁·(t₁ − θ) и Q₂ = c·m₂·(θ − t₂)","Сравнивают Q₁ и Q₂, объясняют расхождение (потери теплоты, погрешности)","При затруднении просят подсказку, при уверенности переходят на следующую ступень."],"ass":["**Формативное.** Метод «Наблюдение» по чек-листу:","- задание выполняется по плану;","- правильность записей и соблюдение ТБ;","- участие в работе группы.","Устная обратная связь педагога."],"res":["два стакана или калориметр, горячая и холодная вода, термометр, мензурка или весы"]},{"tm":"25–30","name":"4. Обобщение. Вывод","tch":["Организует обсуждение результатов групп (выступают докладчики). Подводит к выводу:","- Q отданное = Q полученное (уравнение теплового баланса): c·m₁·(t₁ − θ) = c·m₂·(θ − t₂)","- Небольшое расхождение объясняется потерями теплоты в окружающую среду и нагреванием сосуда","- Энергия не исчезает, а переходит от одного тела к другому"],"stu":["Сравнивают результаты групп, формулируют вывод.","Сверяют вывод с гипотезой начала урока.","Записывают вывод в тетрадь."],"ass":["**Формативное.** Метод «Учебные вопросы»: вопросы на объяснение и прогноз."],"res":["Слайд","Учебник: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8 класс"]},{"tm":"30–40","name":"5. Применение. Решение задач с постепенным снятием опоры","tch":["Алгоритм: «Дано – СИ – Формула – Расчёт – Ответ» (для качественных задач: «Наблюдение – Объяснение – Вывод»). Опора снимается постепенно:","**«Я делаю»** (2 мин) – разбирает образец (задача 1).","**«Мы делаем вместе»** (3 мин) – задача 2 по карточке-алгоритму с пропусками.","**«Вы делаете в паре»** (3 мин) – задача 3 (уровни А/В/С).","**«Ты делаешь сам»** (2 мин) – задача 4 без опор; при нехватке времени переходит в домашнее задание.","Задачи – в Приложении."],"stu":["Следят за образцом, проговаривают шаги алгоритма.","Решают вместе, затем в паре; выбирают уровень задачи и могут перейти на следующий.","Самостоятельно решают задачу 4.","Проверяют ответы по эталону."],"ass":["**Формативное.** Самопроверка по эталону; наблюдение.","Дескрипторы – в Приложении."],"res":["Карточка-алгоритм","Карточки задач А/В/С","Эталон ответов"]},{"tm":"40–43","name":"6. Взаимооценивание. Домашнее задание","tch":["**Метод оценки Scaffold – «Обратная связь от сверстников»:** группы обмениваются работами (записи, решения) и оценивают их по чек-листу методом «Две звезды и одно пожелание».","**Домашнее задание** (по выбору):","- все: оформить вывод Л.Р. № 1; решить две задачи на тепловой баланс;","- по желанию: подготовить короткое сообщение по теме урока."],"stu":["Читают работы одноклассников, называют две удачи и одно пожелание.","Записывают домашнее задание, выбирают уровень."],"ass":["**Формативное.** Взаимооценивание: «Две звезды и одно пожелание»."],"res":["Чек-лист оценивания","Стикеры"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Метод оценки Scaffold – «Самоанализ».** Предлагает ответить на вопросы:","- Что мне удалось хорошо?","- Что вызвало трудность?","- Что я сделаю, чтобы улучшить результат?","Просит отметить уровень освоения цели на шкале «Светофор»."],"stu":["Заполняют листок самооценки.","Отмечают на шкале «Светофор»: понял(а) полностью / есть вопросы / нужна помощь."],"ass":["**Самооценивание** по критериям успеха."],"res":["Листок самооценки","Шкала «Светофор»"]}],"pass":[["Длительность","1 урок, 45 минут"],["Цель","Применять уравнение теплового баланса при решении задач."],["Тема","Закон сохранения и превращения энер ение в сотрудничестве + лабораторное занятие","act":"Лабораторная работа: в тёплую воду опускают лёд при 0 °C, после таяния измеряют температуру θ и находят λ = c·(m₁(t₁ − θ)/m₂ − θ).","t1":"пошаговая инструкция, готовая формула и образец расчёта","t2":"план с пропусками, формулу выводят по уравнению теплового баланса","t3":"сами составляют план, выводят формулу для λ и оценивают погрешность","s":["Измеряют массу воды, начальную температуру, массу растаявшего льда и температуру смеси","Рассчитывают λ и сравнивают с табличным значением 3,4·10⁵ Дж/кг","Анализируют график зависимости температуры от времени при плавлении и кристаллизации"],"con":["При плавлении и кристаллизации температура постоянна; на графике – горизонтальный участок","Q = λ·m – количество теплоты, поглощаемое при плавлении и выделяемое при кристаллизации; λ льда = 3,4·10⁵ Дж/кг","Энергия при плавлении идёт на разрушение кристаллической решётки, а не на повышение температуры"],"tk":[["Сколько теплоты нужно для плавления 2 кг льда при 0 °C? (λ = 3,4·10⁵ Дж/кг)","Q = 3,4·10⁵·2 = 6,8·10⁵ Дж = 680 кДж"],["Что показывает горизонтальный участок на графике нагревания кристаллического тела?","Плавление при постоянной температуре"],["Сколько теплоты выделится при кристаллизации 0,5 кг воды при 0 °C?","Q = 3,4·10⁵·0,5 = 1,7·10⁵ Дж"],["Лёд 0,1 кг при 0 °C растопили и нагрели полученную воду до 20 °C. Сколько теплоты потребовалось?","Q = 3,4·10⁴ + 4200·0,1·20 = 34 000 + 8 400 = 42 400 Дж"]],"hw":"оформить вывод Л.Р. № 2; объяснить, почему лёд охлаждает напиток лучше, чем холодная вода","res":"калориметр или стакан, тёплая вода, лёд, термометр, весы, салфетки","live":"лёд в напитках, таяние снега, замерзание водоёмов","tb":"воду использовать не горячее 40–50 °C, пролитую воду вытирать","cr":["Описывает плавление и кристаллизацию на основе молекулярно-кинетической теории и читает график","Применяет формулу Q = λ·m в задаче","Экспериментально определяет λ и записывает результат с учётом погрешности","Соблюдает техни ту, при сжатии работу совершают над газом, его внутренняя энергия растёт","Второй закон: теплота самопроизвольно переходит только от горячего тела к холодному; тепловые процессы необратимы"],"tk":[["Газу передали 500 Дж теплоты, газ совершил работу 200 Дж. Как изменилась внутренняя энергия?","ΔU = Q − A = 500 − 200 = 300 Дж"],["Газ сжали, совершив над ним работу 150 Дж, теплообмена нет. Как изменилась внутренняя энергия?","Увеличилась на 150 Дж"],["Почему чай в кружке сам не нагревается, остывая в комнате?","Второй закон термодинамики: теплота самопроизвольно переходит от горячего тела к холодному"],["Газ получил 300 Дж теплоты и расширился, совершив работу 300 Дж. Как изменилась его температура?","ΔU = 0, температура не изменилась"]],"hw":"параграф по теме; записать три примера необратимых процессов в быту","res":"шприц или насос, термометр, вертушка, подкрашенная вода, видеофрагмент","live":"накачивание шин, работа холодильника, остывание чая","tb":"паровую демонстрацию проводит только педагог, ученики сохраняют дистанцию","cr":["Объясняет первый закон термодинамики и применяет Q = ΔU + A","Описывает работу газа при расширении и сжатии","Объясняет второй закон термодинамики на примере необратимого процесса"],"sec":"8.2 А Основы термодинамики (3 ч)","goals":[{"c":"8.3.2.17","t":"объяснять первый закон термодинамики"},{"c":"8.3.2.18","t":"объяснять второй закон термодинамики"}],"compN":["Исследовательское мышление (GreenComp)","Сотрудничество (LifeComp)","Системное мышление (GreenComp)"],"stages":[{"tm":"0–5","name":"1. Начало урока. Диагностика","tch":["Приветствует класс, проверяет готовность к уроку.","**Мотивация.** При накачивании велосипедной шины насос нагревается, хотя мы его не грели. Откуда берётся тепло?","**Диагностика исходного уровня** (карточка Scaffold «Определите уровень компетенции», метод «Учебные вопросы»):","- Что такое внутренняя энергия?","- Какими двумя способами её можно изменить?","- Что такое механическая работа?","По итогам определяет ступень поддержки (1, 2 или 3) для каждой группы. Формирует группы по 4 человека разного уровня подготовки."],"stu":["Отвечают на вопросы мотивации, высказывают гипотезу.","Выполняют диагностические задания.","Объединяются в группы и распределяют роли: организатор, исполнитель, регистратор, докладчик."],"ass":["**Диагностическое.** Метод «Учебные вопросы».","Результат фиксируется в листе наблюдения: все ответы верны – высокий уровень, часть – средний, мало – начальный."],"res":["Слайд","Карточки вопросов / Quizizz","Лист наблюдения"]},{"tm":"5–8","name":"2. Постановка цели","tch":["По гипотезам и результатам диагностики предлагает сформулировать тему и цель урока.","Знакомит с критериями успеха (чек-лист «Я смогу…»).","**Техника безопасности** (8.1.3.3): паровую демонстрацию проводит только педагог, ученики сохраняют дистанцию."],"stu":["Формулируют тему и цель урока своими словами.","Читают критерии успеха."],"ass":["**Формативное.** Наблюдение; приём «Большой палец» – готовность к работе."],"res":["Слайд с темой и критериями"]},{"tm":"8–25","name":"3. Исследование нового материала","tch":["**Метод обучения Scaffold:** обучение в сотрудничестве + демонстрационные опыты.","Станции: «Сжатие воздуха» (шприц с закрытым отверстием или насос – нагревание), «Работа пара» (вращение вертушки струёй пара – демонстрация педагога), «Необратимость» (смешивание подкрашенной и чистой воды, видеофрагмент «разбитая чашка» в обратной перемотке).","**Три ступени поддержки** (Приложение):","- **ступень 1 «Опора»** – карточки станций с готовой записью Q = ΔU + A и вопросами «что получает газ, что совершает газ?»;","- **ступень 2 «Подсказка»** – карточки станций с вопросами, формулу ученики записывают сами;","- **ступень 3 «Самостоятельно»** – сами формулируют закон на основе наблюдений и приводят свои примеры необратимых процессов.","Консультирует по правилу «сначала вопрос, потом подсказка»."],"stu":["Наблюдают нагревание воздуха при сжатии, объясняют результат","Записывают закон сохранения энергии для тепловых процессов: Q = ΔU + A","Приводят примеры необратимых процессов и формулируют второй закон","При затруднении просят подсказку, при уверенности переходят на следующую ступень."],"ass":["**Формативное.** Метод «Наблюдение» по чек-листу:","- задание выполняется по плану;","- правильность записей и соблюдение ТБ;","- участие в работе группы.","Устная обратная связь педагога."],"res":["шприц или насос, термометр, вертушка, подкрашенная вода, видеофрагмент"]},{"tm":"25–30","name":"4. Обобщение. Вывод","tch":["Организует обсуждение результатов групп (выступают докладчики). Подводит к выводу:","- Первый закон термодинамики: Q = ΔU + A – переданная газу теплота идёт на изменение внутренней энергии и на работу газа","- При расширении газ совершает работу, при сжатии работу совершают над газом, его внутренняя энергия растёт","- Второй закон: теплота самопроизвольно переходит только от горячего тела к холодному; тепловые процессы необратимы"],"stu":["Сравнивают результаты групп, формулируют вывод.","Сверяют вывод с гипотезой начала урока.","Записывают вывод в тетрадь."],"ass":["**Формативное.** Метод «Учебные вопросы»: вопросы на объяснение и прогноз."],"res":["Слайд","Учебник: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8 класс"]},{"tm":"30–40","name":"5. Применение. Решение задач с постепенным снятием опоры","tch":["Алгоритм: «Дано – СИ – Формула – Расчёт – Ответ» (для качественных задач: «Наблюдение – Объяснение – Вывод»). Опора снимается постепенно:","**«Я делаю»** (2 мин) – разбирает образец (задача 1).","**«Мы делаем вместе»** (3 мин) – задача 2 по карточке-алгоритму с пропусками.","**«Вы делаете в паре»** (3 мин) – задача 3 (уровни А/В/С).","**«Ты делаешь сам»** (2 мин) – задача 4 без опор; при нехватке времени переходит в домашнее задание.","Задачи – в Приложении."],"stu":["Следят за образцом, проговаривают шаги алгоритма.","Решают вместе, затем в паре; выбирают уровень задачи и могут перейти на следующий.","Самостоятельно решают задачу 4.","Проверяют ответы по эталону."],"ass":["**Формативное.** Самопроверка по эталону; наблюдение.","Дескрипторы – в Приложении."],"res":["Карточка-алгоритм","Карточки задач А/В/С","Эталон ответов"]},{"tm":"40–43","name":"6. Взаимооценивание. Домашнее задание","tch":["**Метод оценки Scaffold – «Обратная связь от сверстников»:** группы обмениваются работами (записи, решения) и оценивают их по чек-листу методом «Две звезды и одно пожелание».","**Домашнее задание** (по выбору):","- все: параграф по теме; записать три примера необратимых процессов в быту;","- по желанию: подготовить короткое сообщение по теме урока."],"stu":["Читают работы одноклассников, называют две удачи и одно пожелание.","Записывают домашнее задание, выбирают уровень."],"ass":["**Формативное.** Взаимооценивание: «Две звезды и одно пожелание»."],"res":["Чек-лист оценивания","Стикеры"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Метод оценки Scaffold – «Самоанализ».** Предлагает ответить на вопросы:","- Что мне удалось хорошо?","- Что вызвало трудность?","- Что я сделаю, чтобы улучшить результат?","Просит отметить уровень освоения цели на шкале «Светофор»."],"stu":["Заполняют листок самооценки.","Отмечают на шкале «Светофор»: понял(а) полностью / есть вопросы / нужна помощь."],"ass":["**Самооценивание** по критериям успеха."],"res":["Листок самооценки","Шкала «Светофор»"]}],"pass":[["Длительность","1 урок, 45 минут"],["Цель","Объяснять первый закон термодинамики."],["Тема","Первый закон термодинамики. Работа газа и пара. Необратимость тепловых процессов. Второй закон термодинамики"],["Целевая аудитория","8 класс музыкальной школы-интерната; работа в группах по 4 человека"],["Потребности","Визуальная опора (схемы, графики, карточки); дополнительное время и пошаговые инструкции для части класса; выбор ступени поддержки. Для учащихся с особыми образовательными потребностями – ступень 1, укрупнённый шрифт, индивидуальный темп."],["Ресурсы","шприц или насос, термометр, вертушка, подкрашенная вода, видеофрагмент"],[" рная работа: собрать цепь из двух резисторов, соединённых последовательно, измерить силу тока и напряжения на каждом резисторе и на всём участке.","t1":"готовая схема, инструкция и таблица с образцом записи","t2":"схема, план с пропусками, таблица без образца","t3":"сами составляют схему, план и таблицу, формулируют закономерности","s":["Собирают цепь из двух последовательных резисторов","Измеряют I, U₁, U₂ и U","Проверяют соотношения I = I₁ = I₂, U = U₁ + U₂, R = R₁ + R₂"],"con":["При последовательном соединении I = I₁ = I₂, U = U₁ + U₂, R = R₁ + R₂","При параллельном соединении U = U₁ = U₂, I = I₁ + I₂, 1/R = 1/R₁ + 1/R₂","Закон Ома применяют к каждому участку и ко всей цепи"],"tk":[["Резисторы 10 Ом и 20 Ом соединены последовательно, U = 6 В. Найдите силу тока и напряжение на первом резисторе.","R = 30 Ом; I = 6/30 = 0,2 А; U₁ = 0,2·10 = 2 В"],["Два резистора по 15 Ом соединены последовательно. Найдите общее сопротивление.","R = 15 + 15 = 30 Ом"],["Резисторы 6 Ом и 3 Ом соединены параллельно. Найдите общее сопротивление.","R = 6·3/(6 + 3) = 2 Ом"],["В последовательной цепи сила тока в первой лампе 0,4 А. Какова сила тока во второй лампе?","0,4 А: при последовательном соединении сила тока одинакова"]],"hw":"оформить вывод Л.Р. № 5; решить две задачи на соединения проводников","res":"источник тока, два резистора, амперметр, вольтметр, ключ, провода","live":"ёлочные гирлянды, домашняя электропроводка","tb":"напряжение источника не выше 6 В; цепь включать только после проверки педагогом; не касаться оголённых контактов; по окончании работы отключить источник","cr":["Экспериментально получает закономерности последовательного соединения","Рассчитывает цепь с последовательным и параллельным соединением по закону Ома","Записывает данные с учётом погрешностей","Соблюдает технику безопасности"],"sec":"8.3 А Постоянный электрический ток (7 ч)","goals":[{"c":"8.4.2.11","t":"рассчитывать электрические цепи, используя закон Ома для участка цепи в последовательном и параллельно м и параллельном соединении проводников."],["Тема","Последовательное и параллельное соединения проводников. Л.Р. № 5 «Изучение последовательного соединения проводников»"],["Целевая аудитория","8 класс музыкальной школы-интерната; работа в группах по 4 человека"],["Потребности","Визуальная опора (схемы, графики, карточки); дополнительное время и пошаговые инструкции для части класса; выбор ступени поддержки. Для учащихся с особыми образовательными потребностями – ступень 1, укрупнённый шрифт, индивидуальный темп."],["Ресурсы","источник тока, два резистора, амперметр, вольтметр, ключ, провода"],["Место","Кабинет физики"],["Связи с реальной жизнью","ёлочные гирлянды, домашняя электропроводка"],["№ 1 «Выберите компетенцию»",["**g.9** Исследовательское мышление (GreenComp)","**l.6** Сотрудничество (LifeComp)","**e.15** Обучение через опыт (EntreComp)"]],["№ 2 «Определите уровень компетенции»","Диагностика в начале урока методом «Учебные вопросы»; по результатам выбирается ступень поддержки."],["№ 3 «Выберите метод обучения»","Обучение в сотрудничестве + лабораторное занятие."],["№ 4 «Ожидаемые результаты»","Результат деятельности групп и отдельных учащихся по критериям успеха (Приложение 3); выполненные задачи; листок самооценки."],["№ 5 «Выберите метод оценки»","В начале – «Учебные вопросы»; в ходе – «Наблюдение»; в конце – «Обратная связь от сверстников» и «Самоанализ»."],["Принцип поддержки","«Я делаю» → «Мы делаем вместе» → «Вы делаете в паре» → «Ты делаешь сам»; три ступени поддержки в основной деятельности."]],"lev":["все дескрипторы – высокий","часть – средний","0–1 – начальный"]},"21":{"kind":"lab","t":"Л.Р. № 6 «Изучение параллельного соединения проводников»","hook":"Почему в квартире все приборы включают в розетки параллельно, а не друг за другом?","dq":["Чему равны I, U и R при последовательном соединении?","Как включают амперметр?","Что такое узел цепи?"],"m":"обучение в сотрудничестве + лабораторное занятие","act":"Лабораторная работа: собрать цепь из двух п строения: параллельный оси (через фокус), через центр кривизны","Вогнутое зеркало при d > 2F даёт уменьшенное, действительное, перевёрнутое изображение"],"tk":[["Угол падения 40°. Чему равен угол между падающим и отражённым лучами?","80°"],["Показатель преломления вещества 1,6. Найдите предельный угол полного отражения.","sin α₀ = 1/1,6 = 0,625; α₀ ≈ 39°"],["Вогнутое зеркало, F = 5 см, d = 20 см. Найдите расстояние до изображения и увеличение.","1/f = 1/5 − 1/20 = 3/20; f ≈ 6,7 см; Γ = f/d ≈ 0,33"],["Постройте изображение в вогнутом зеркале при d > 2F и охарактеризуйте его.","Уменьшенное, действительное, перевёрнутое"]],"hw":"подготовить материалы к Л.Р. № 11: повторить формулу тонкой линзы","res":"вогнутое и выпуклое зеркала, карточки со схемами, карточки вариантов СОР","live":"фары, зеркала в магазинах и на дорогах, телескопы","cr":["Строит ход лучей в сферических зеркалах и характеризует изображение","Применяет законы отражения и преломления в задачах раздела","Применяет формулу линзы или зеркала с верным расчётом"],"sec":"8.4 А Световые явления (8 ч)","goals":[{"c":"8.5.1.5","t":"строить ход лучей в сферических зеркалах для получения изображений тела, характеризовать полученное изображение"}],"compN":["Исследовательское мышление (GreenComp)","Критическое мышление (LifeComp)","Креативное использование цифровых технологий (DigComp)"],"stages":[{"tm":"0–3","name":"1. Начало урока. Диагностика","tch":["Приветствует класс, проверяет готовность к уроку.","**Мотивация.** Автомобильная фара даёт узкий мощный пучок света, а зеркало в магазине позволяет видеть весь зал. Как работают изогнутые зеркала?","**Диагностика исходного уровня** (карточка Scaffold «Определите уровень компетенции», метод «Учебные вопросы»):","- Как строят изображение в плоском зеркале?","- Что такое фокус?","- Назовите законы отражения света","По итогам определяет ступень поддержки (1, 2 или 3) для каждой группы. Формирует группы по 4 человека разного уровня подготовки."],"stu":["Отвечают на вопросы общение. Вывод","tch":["Организует обсуждение результатов групп (выступают докладчики). Подводит к выводу:","- Фокусное расстояние сферического зеркала F = R/2; вогнутое зеркало собирает лучи, выпуклое рассеивает","- Лучи для построения: параллельный оси (через фокус), через центр кривизны","- Вогнутое зеркало при d > 2F даёт уменьшенное, действительное, перевёрнутое изображение"],"stu":["Сравнивают результаты групп, формулируют вывод.","Сверяют вывод с гипотезой начала урока.","Записывают вывод в тетрадь."],"ass":["**Формативное.** Метод «Учебные вопросы»: вопросы на объяснение и прогноз."],"res":["Слайд","Учебник: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8 класс"]},{"tm":"20–40","name":"5. Суммативное оценивание за раздел (СОР)","tch":["Организует суммативное оценивание за раздел (20 мин, индивидуально, 4 задания, максимум 10 баллов). Задания СОР – в Приложении. На этом этапе опоры снимаются."],"stu":["Выполняют задания СОР самостоятельно, без подсказок."],"ass":["**Суммативное.** Баллы по дескрипторам (Приложение)."],"res":["Карточки вариантов СОР","Калькулятор","Таблицы величин"]},{"tm":"40–43","name":"6. Самопроверка. Домашнее задание","tch":["Раздаёт эталон и критерии; учащиеся сверяют ответы и отмечают ошибки. Баллы сообщит на следующем уроке.","**Домашнее задание:** подготовить материалы к Л.Р. № 11: повторить формулу тонкой линзы."],"stu":["Сверяют ответы с эталоном, отмечают ошибки.","Записывают домашнее задание."],"ass":["**Самооценивание** по эталону."],"res":["Эталон ответов","Критерии"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Метод оценки Scaffold – «Самоанализ».** Предлагает ответить на вопросы:","- Что мне удалось хорошо?","- Что вызвало трудность?","- Что я сделаю, чтобы улучшить результат?","Просит отметить уровень освоения цели на шкале «Светофор»."],"stu":["Заполняют листок самооценки.","Отмечают на шкале «Светофор»: понял(а) полностью / есть вопросы / нужна помощь."],"ass":["**Самооценивание** по критериям успеха."],"res":["Листок самооцен и","Конструируют и испытывают простой оптический прибор","При затруднении просят подсказку, при уверенности переходят на следующую ступень."],"ass":["**Формативное.** Метод «Наблюдение» по чек-листу:","- задание выполняется по плану;","- правильность записей и соблюдение ТБ;","- участие в работе группы.","Устная обратная связь педагога."],"res":["схема глаза, картон, малые зеркала, бумага, скотч, ножницы, линейка"]},{"tm":"25–30","name":"4. Обобщение. Вывод","tch":["Организует обсуждение результатов групп (выступают докладчики). Подводит к выводу:","- Хрусталик – собирающая линза, сетчатка – экран; изображение действительное, уменьшенное, перевёрнутое","- Близорукость: изображение перед сетчаткой, исправляют рассеивающими линзами; дальнозоркость: за сетчаткой, исправляют собирающими","- Перископ – два зеркала под 45°; камера-обскура – маленькое отверстие и экран"],"stu":["Сравнивают результаты групп, формулируют вывод.","Сверяют вывод с гипотезой начала урока.","Записывают вывод в тетрадь."],"ass":["**Формативное.** Метод «Учебные вопросы»: вопросы на объяснение и прогноз."],"res":["Слайд","Учебник: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8 класс"]},{"tm":"30–40","name":"5. Применение. Решение задач с постепенным снятием опоры","tch":["Алгоритм: «Дано – СИ – Формула – Расчёт – Ответ» (для качественных задач: «Наблюдение – Объяснение – Вывод»). Опора снимается постепенно:","**«Я делаю»** (2 мин) – разбирает образец (задача 1).","**«Мы делаем вместе»** (3 мин) – задача 2 по карточке-алгоритму с пропусками.","**«Вы делаете в паре»** (3 мин) – задача 3 (уровни А/В/С).","**«Ты делаешь сам»** (2 мин) – задача 4 без опор; при нехватке времени переходит в домашнее задание.","Задачи – в Приложении."],"stu":["Следят за образцом, проговаривают шаги алгоритма.","Решают вместе, затем в паре; выбирают уровень задачи и могут перейти на следующий.","Самостоятельно решают задачу 4.","Проверяют ответы по эталону."],"ass":["**Формативное.** Самопроверка по эталону; наблюдение.","Дескрипторы – в Приложении."],"res":["Карточка-алгоритм","Карточки задач А/В/С","Эталон ответов"]},{"tm":"40–43","name":"6. Взаимооценивание. Домашнее задание","tch":["**Метод оценки Scaffold – «Обратная связь от сверстников»:** группы обмениваются работами (записи, решения) и оценивают их по чек-листу методом «Две звезды и одно пожелание».","**Домашнее задание** (по выбору):","- все: завершить и описать конструкцию прибора; повторить главу «Световые явления» к итоговому занятию;","- по желанию: подготовить короткое сообщение по теме урока."],"stu":["Читают работы одноклассников, называют две удачи и одно пожелание.","Записывают домашнее задание, выбирают уровень."],"ass":["**Формативное.** Взаимооценивание: «Две звезды и одно пожелание»."],"res":["Чек-лист оценивания","Стикеры"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Метод оценки Scaffold – «Самоанализ».** Предлагает ответить на вопросы:","- Что мне удалось хорошо?","- Что вызвало трудность?","- Что я сделаю, чтобы улучшить результат?","Просит отметить уровень освоения цели на шкале «Светофор»."],"stu":["Заполняют листок самооценки.","Отмечают на шкале «Светофор»: понял(а) полностью / есть вопросы / нужна помощь."],"ass":["**Самооценивание** по критериям успеха."],"res":["Листок самооценки","Шкала «Светофор»"]}],"pass":[["Длительность","1 урок, 45 минут"],["Цель","Описывать коррекцию близорукости и дальнозоркости глаза."],["Тема","Оптические приборы. Глаз как оптическая система. Дефекты зрения и способы их исправления"],["Целевая аудитория","8 класс музыкальной школы-интерната; работа в группах по 4 человека"],["Потребности","Визуальная опора (схемы, графики, карточки); дополнительное время и пошаговые инструкции для части класса; выбор ступени поддержки. Для учащихся с особыми образовательными потребностями – ступень 1, укрупнённый шрифт, индивидуальный темп."],["Ресурсы","схема глаза, картон, малые зеркала, бумага, скотч, ножницы, линейка"],["Место","Кабинет физики"],["Связи с реальной жизнью","очки, бинокль, ң орналасуы қалай ерекшеленеді?","- Температураны немен және қандай бірлікпен өлшейді?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): ыстық суды абайлап тасымалдау."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + демонстрациялық эксперимент.","Топтар үш бекетте 5 минуттан жұмыс істейді: «Диффузия» (суық және жылы судағы бояу), «Жылулық ұлғаю» (сұйықты термометр), «Шкалалар» (°C-ты К-ге аудару).","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – бақылау кестесі дайын және температураны аударудың үлгісі бар бекет карточкалары;","- **2-саты «Кеңес»** – сұрақтары бар бекет карточкалары, кестеде үлгі жоқ;","- **3-саты «Өздігінен»** – гипотезаны өздері ұсынып, судың әртүрлі температурасындағы диффузияны бақылау жоспарын құрады.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Суық және жылы судағы бояудың диффузиясын бақылап, уақытын жазады","Нәтижені молекула-кинетикалық теория негізінде түсіндіреді","Температураны T = t + 273 формуласымен °C-тан К-ге аударады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["суық және ыстық суы бар стақандар, бояу, термометрлер, шкала кестесі"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Заттар ретсіз қозғалатын және өзара әрекеттесетін бөлшектерден тұрады; дәлелі – диффузия және броундық қозғалыс","- Температура неғұрлым жоғары болса, бөлшектер соғұрлым жылдам қозғалады (жылулық қозғалыс)","- T (К) = t (°C) + 273; сұйықты термометр сұйықтың жылулық ұлғаюына негізделген"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру;
