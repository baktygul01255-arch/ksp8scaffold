еңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Жұқа линзаның фокустық қашықтығын және оптикалық күшін анықтау."],["Тақырыбы","№ 11 ЗЖ «Жұқа линзаның фокустық қашықтығы мен оптикалық күшін анықтау»"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","оптикалық скамья, линза, жарық көзі (жарқырайтын зат), экран, сызғыш"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","көзілдірік, объективтер, ұлғайтқыш"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)","**l.6** Ынтымақтастық (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + зертханалық жұмыс."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"34":{"kind":"new","t":"Оптикалық аспаптар. Көз – оптикалық жүйе. Көздің көру кемшіліктері және оларды түзету әдістері","hook":"Неге кейбір адамдар алысқа нашар көреді, ал басқалары – жақынға, және көзілдірік мұны қалай түзетеді?","dq":["Қандай линзалар болады?","Ұлғайтқыш қалай жұмыс істейді?","Шын кескін дегеніміз не?"],"m":"жобалық оқыту: тәжірибеге бағыттылық + ынтымақтастықта оқыту","act":"Топтық жоба: көздің сызбасын және көру кемшіліктерін зерттеп, содан кейін картоннан, айналардан немесе қағаздан қарапайым оптикалық құрал (перископ немесе камера-обскура) жасайды.","t1":"жазбалары бар көз сызбасы, дайын нұсқаулық және құралдың сызбасы","t2":"жазбасыз көз сызбасы, кейбір бөліктері жоқ сызба","t3":"құралды өздері жобалап, сызбасын құрып, жұмысын түсіндіреді","s":["Көздің оптикалық жүйесін сипаттайды: хрусталик – линза, торлы қабық – экран","Алыстан көргіштік пен жақыннан көргіштікті және түзету тәсілдерін түсіндіреді","Қарапайым оптикалық құралды жасап, сынайды"],"con":["Хрусталик – жинағыш линза, торлы қабық – экран; кескін нақты, кішірейген, төңкерілген","Жақыннан көргіштік: кескін торлы қабықтың алдында, шашыратқыш линзамен түзетіледі; алыстан көргіштік: торлы қабықтың артында, жинағыш линзамен түзетіледі","Перископ – 45° бұрышпен орналасқан екі айна; камера-обскура – шағын тесік және экран"],"tk":[["Жақыннан көргіштік кезінде қандай көзілдірік қажет?","Шашыратқыш линзалы (теріс оптикалық күшті)"],["Адамның көзілдірігі +2 дптр. Оның көру кемшілігі қандай және линзаның F неге тең?","Алыстан көргіштік; F = 1/2 = 0,5 м"],["Жақыннан көргіш көзде кескін қай жерде түзіледі?","Торлы қабықтың алдында"],["Қарапайым камера-обскураны қалай жасауға болатынын сипаттаңыз.","Алдыңғы жағында шағын тесігі және артқы жағында жартылай мөлдір экраны бар қорап; кескін төңкерілген"]],"hw":"құрал құрылымын аяқтап, сипаттау; қорытынды сабаққа «Жарық құбылыстары» тарауын қайталау","res":"көз сызбасы, картон, шағын айналар, қағаз, скотч, қайшы, сызғыш","live":"көзілдірік, дүрбі, микроскоп, фотоаппарат","tb":"қайшы мен өткір заттарды абайлап қолдану; лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау","cr":["Жақыннан және алыстан көргіштікті түзетуді сипаттайды","Қарапайым оптикалық құралды жасап, жұмысын түсіндіреді","Көздің оптикалық жүйесін сипаттайды"],"sec":"8.4 А Жарық құбылыстары (8 с)","goals":[{"c":"8.5.1.15","t":"көздің алыстан көргіштігі мен жақыннан көргіштігін түзетуді сипаттау"},{"c":"8.5.1.16","t":"қарапайым оптикалық құралдарды (перископ, Обскура камерасы) құрастыру"}],"compN":["Шығармашылық (EntreComp)","Ынтымақтастық (LifeComp)","Денсаулық пен әл-ауқатты қорғау (DigComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Неге кейбір адамдар алысқа нашар көреді, ал басқалары – жақынға, және көзілдірік мұны қалай түзетеді?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Қандай линзалар болады?","- Ұлғайтқыш қалай жұмыс істейді?","- Шын кескін дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): қайшы мен өткір заттарды абайлап қолдану; лазерлік көрсеткішті және жарық көзін көзге бағыттамау; оптикалық құралдар мен шыныны абайлап ұстау."],"stu":["Сабақтың та const sv=(inner)=>`<svg class="dg" viewBox="0 0 800 420" role="img">${DGS}${inner}</svg>`;
const ln=(x1,y1,x2,y2,c='s',e='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}" ${e}/>`;
const ar=(x1,y1,x2,y2,c='sa',m='aa')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}" marker-end="url(#${m})"/>`;
const tx=(x,y,t,c='t',a='middle')=>`<text x="${x}" y="${y}" class="${c}" text-anchor="${a}">${t}</text>`;
const rc=(x,y,w,h,c='s',e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" class="${c}" ${e}/>`;
const ci=(x,y,r,c='s')=>`<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`;
const pa=(d,c='s',e='')=>`<path d="${d}" class="${c}" ${e}/>`;
const dash='stroke-dasharray="8 7"';

function graph(o){
  const x0=o.x0||120,y0=o.y0||360,w=o.w||600,h=o.h||290,xt=o.xt||6,yt=o.yt||5;
  let s='';
  s+=ar(x0,y0,x0+w+30,y0,'s','ah')+ar(x0,y0,x0,y0-h-30,'s','ah');
  for(let i=1;i<=xt;i++){const x=x0+w*i/xt;s+=ln(x,y0-6,x,y0+6)+tx(x,y0+30,f1(o.xmax*i/xt,1),'tm');s+=ln(x,y0,x,y0-h,'sg0')}
  for(let i=1;i<=yt;i++){const y=y0-h*i/yt;s+=ln(x0-6,y,x0+6,y)+tx(x0-12,y+7,f1(o.ymax*i/yt,1),'tm','end');s+=ln(x0,y,x0+w,y,'sg0')}
  s+=tx(x0+w+20,y0+30,o.xl,'t','end')+tx(x0+8,y0-h-34,o.yl,'t','start');
  return s;
}
const gx=(o,x)=>(o.x0||120)+(o.w||600)*x/o.xmax, gy=(o,y)=>(o.y0||360)-(o.h||290)*y/o.ymax;
function curve(o,fn,cls='sa',n=80){
  let d='',pen=false;
  for(let i=0;i<=n;i++){const x=o.xmax*i/n,y=fn(x);if(y<0||y>o.ymax*1.001){pen=false;continue}
    d+=(pen?'L':'M')+gx(o,x).toFixed(1)+' '+gy(o,y).toFixed(1);pen=true}
  return pa(d,cls,'style="stroke-width:5"');
}
function dot(x,y,c='fr',r=9){return `<circle cx="${x}" cy="${y}" r="${r}" class="${c}"/>`}

/* элементы электрических цепей */
function battery(x,y){return ln(x,y-26,x,y-8)+ln(x-16,y-8,x+16,y-8,'s','style="stroke-width:3"')+ln(x-8,y+8,x+8,y+8,'s','style="stroke-width:6"')+ln(x,y+8,x,y+26)}
function lamp(x,y){return ci(x,y,24)+ln(x-17,y-17,x+17,y+17)+ln(x-17,y+17,x+17,y-17)}
function resistor(x,y,v){return rc(x-34,y-14,68,28,'s')+(v?tx(x,y-24,v,'tm'):'')}
function meter(x,y,l){return ci(x,y,24)+tx(x,y+8,l,'t')}
function key(x,y,open){return ci(x-22,y,4,'fs0')+ci(x+22,y,4,'fs0')+ln(x-22,y,x+18,y-(open?22:0),'s')}

  return sv(s)},note:()=>B('Линии напряжённости начинаются на «+» и заканчиваются на «−»; чем гуще линии, тем сильнее поле.','Кернеулік сызықтары «+» зарядтан басталып, «−» зарядта аяқталады; сызықтар неғұрлым жиі болса, өріс соғұрлым күшті.')},

potential:{ctl:[{k:'U',l:()=>'U, '+B('В','В'),min:2,max:20,step:1,v:10},{k:'d',l:()=>'d, '+B('см','см'),min:1,max:10,step:1,v:5}],svg(p){
  const E=p.U/(p.d*1e-2);const xL=150,xR=650;
  let s=rc(xL-14,80,14,260,'fr')+rc(xR,80,14,260,'fa')+tx(xL-7,66,'+','t')+tx(xR+7,66,'−','t');
  for(let y=110;y<=310;y+=50)s+=ar(xL+6,y,xR-8,y,'sr','ar');
  for(let i=0;i<=4;i++){const x=xL+(xR-xL)*i/4;const v=p.U*(1-i/4);s+=ln(x,88,x,332,'sa',dash)+tx(x,372,`φ = ${f1(v,1)} ${B('В','В')}`,'tm')}
  s+=dot(xL+(xR-xL)/4,210,'fy',9)+tx(xL+(xR-xL)/4,196,'A','t')+dot(xL+3*(xR-xL)/4,210,'fy',9)+tx(xL+3*(xR-xL)/4,196,'B','t');
  s+=tx(400,36,`E = U/d = ${f1(E,0)} ${B('В/м','В/м')};   φA − φB = ${f1(p.U/2,1)} ${B('В','В')}`,'tb');
  return sv(s)},note:()=>B('A = q·(φ₁ − φ₂) = q·U','A = q·(φ₁ − φ₂) = q·U')},

/* ---------- 16: конденсатор ---------- */
capacitor:{ctl:[{k:'d',l:()=>'d, '+B('мм','мм'),min:1,max:10,step:1,v:4},{k:'e',t:'choice',l:()=>'',o:[{v:1,l:()=>B('Воздух (ε = 1)','Ауа (ε = 1)')},{v:7,l:()=>B('Стекло (ε = 7)','Шыны (ε = 7)')}],v:1}],svg(p){
  const C=p.e*8.85*0.01/(p.d*1e-3)*1e-12*1e12*1e-0; // пФ при S=100 см²: eps0*S/d
  const Cpf=p.e*8.85e-12*1e-2/(p.d*1e-3)*1e12;
  const gap=20+p.d*14,yt=210-gap/2,yb=210+gap/2;
  let s=rc(200,yt-14,400,14,'fr')+rc(200,yb,400,14,'fa');
  if(p.e>1)s+=rc(204,yt,392,gap,'fy','style="opacity:.35"');
  for(let x=230;x<=570;x+=48)s+=ar(x,yt+2,x,yb-2,'sr','ar');
  s+=tx(160,yt+2,'+ q','t','end')+tx(160,yb+14,'− q','t','end');
  s+=ln(640,yt,640,yb,'s','marker-start="url(#ah)" marker-end="url(#ah)"')+tx(660,215,'d','t','start');
  s+=tx(400,70,`C = ε·ε₀·S / d = ${f1(Cpf,1)} ${B('пФ','пФ')}`,'tb')+tx(400,375,B('S = 100 см²','S = 100 см²'),'tm');
  return sv(s)},note:()=>B('Чем меньше расстояние d и больше ε, тем больше ёмкость.','d аз және ε үлкен болған сайын сыйымдылық үлкен.')},

/* ---------- 17,18,19: простая цепь ---------- */
circ1:{ctl:[],svg(){

  s+=ln(520,160,640,160)+ln(640,160,640,196)+meter(640,220,'V')+ln(640,244,640,280)+ln(640,280,520,280)+dot(520,160,'fs0',6)+dot(520,280,'fs0',6);
  s+=tx(150,350,B('источник','қайнар көз'),'tm')+tx(272,82,B('ключ','кілт'),'tm')+tx(480,224,B('лампа','шам'),'tm','end')+tx(416,352,B('амперметр','амперметр'),'tm')+tx(640,330,B('вольтметр','вольтметр'),'tm')+tx(640,356,B('(параллельно лампе)','(шамға параллель)'),'tm');

/* ---------- 19: закон Ома ---------- */
ohm:{ctl:[{k:'R',l:()=>'R, '+B('Ом','Ом'),min:1,max:20,step:1,v:4}],svg(p){

  let s=graph(o);
  [2,5,10].forEach(R=>{s+=curve(o,u=>u/R,'sg0','')});
  s+=curve(o,u=>u/p.R,'sa');
  const U0=6,I0=U0/p.R;if(I0<=6){s+=ln(gx(o,U0),350,gx(o,U0),gy(o,I0),'sr',dash)+ln(130,gy(o,I0),gx(o,U0),gy(o,I0),'sr',dash)+dot(gx(o,U0),gy(o,I0),'fr',8)+tx(gx(o,U0)+14,gy(o,I0)-12,`I = ${f1(I0,2)} ${B('А','А')}`,'t','start')}
  s+=tx(700,48,`I = U / R,   R = ${p.R} ${B('Ом','Ом')}`,'tb','end');

/* ---------- 20: последовательное ---------- */
circ_s:{ctl:[{k:'U',l:()=>'U, '+B('В','В'),min:2,max:24,step:1,v:12},{k:'R1',l:()=>'R₁, '+B('Ом','Ом'),min:1,max:30,step:1,v:10},{k:'R2',l:()=>'R₂, '+B('Ом','Ом'),min:1,max:30,step:1,v:20}],svg(p){

  s+=ar(215,78,255,78,'sr','ar')+tx(235,66,'I','t');

   +tx(400,285,`U₁ = ${f1(I*p.R1,1)} ${B('В','В')};   U₂ = ${f1(I*p.R2,1)} ${B('В','В')};   U₁ + U₂ = ${p.U} ${B('В','В')}`,'t');
  return sv(s)},note:()=>B('I = I₁ = I₂;  U = U₁ + U₂;  R = R₁ + R₂','I = I₁ = I₂;  U = U₁ + U₂;  R = R₁ + R₂')},

/* ---------- 21: параллельное ---------- */
circ_p:{ctl:[{k:'U',l:()=>'U, '+B('В','В'),min:2,max:24,step:1,v:12},{k:'R1',l:()=>'R₁, '+B('Ом','Ом'),min:1,max:30,step:1,v:10},{k:'R2',l:()=>'R₂, '+B('Ом','Ом'),min:1,max:30,step:1,v:20}],svg(p){
  const I1=p.U/p.R1,I2=p.U/p.R2,R=p.R1*p.R2/(p.R1+p.R2);
  let s=ln(120,330,120,236)+battery(120,210)+ln(120,184,120,60)+ln(120,60,600,60)+ln(120,330,600,330);
  s+=dot(320,60,'fs0',5)+ln(320,60,320,106)+resistor(320,140,'')+ln(320,154,320,330)+dot(320,330,'fs0',5)+tx(260,145,'R₁','t','end');
  s+=dot(520,60,'fs0',5)+ln(520,60,520,106)+resistor(520,140,'')+ln(520,154,520,330)+dot(520,330,'fs0',5)+tx(580,145,'R₂','t','start');
  s+=ln(600,60,600,330,'s','style="display:none"');
  s+=tx(340,250,`I₁ = ${f1(I1,2)} ${B('А','А')}`,'t','start')+tx(540,250,`I₂ = ${f1(I2,2)} ${B('А','А')}`,'t','start');
  s+=tx(400,30,`U ${B('одинаково','бірдей')};  I = I₁ + I₂ = ${f1(I1+I2,2)} ${B('А','А')};  R = ${f1(R,2)} ${B('Ом','Ом')}`,'tb');
  s+=tx(400,375,'1/R = 1/R₁ + 1/R₂','tm');
  return sv(s)},note:()=>B('U = U₁ = U₂;  I = I₁ + I₂;  1/R = 1/R₁ + 1/R₂','U = U₁ = U₂;  I = I₁ + I₂;  1/R = 1/R₁ + 1/R₂')},

/* ---------- 22: мощность ---------- */
joule:{ctl:[{k:'R',l:()=>'R, '+B('Ом','Ом'),min:2,max:24,step:1,v:6}],svg(p){
  const ym=Math.ceil(144/p.R/10)*10;
  const o={xmax:12,ymax:ym,xl:'U, '+B('В','В'),yl:'P, '+B('Вт','Вт'),x0:130,y0:350,w:560,h:270,xt:6,yt:5};
  let s=graph(o)+curve(o,u=>u*u/p.R,'sa');
  const P0=36/p.R;s+=ln(gx(o,6),350,gx(o,6),gy(o,P0),'sr',dash)+dot(gx(o,6),gy(o,P0),'fr',8)+tx(gx(o,6)+14,gy(o,P0)-12,`P = ${f1(P0,1)} ${B('Вт','Вт')}`,'t','start');

/* ---------- 23: R(t) металла ---------- */
resT:{ctl:[{k:'T',l:()=>'t, °C',min:0,max:300,step:10,v:100}],svg(p){

  s+=tx(gx(o,p.T)+14,gy(o,R(p.T))-14,`R = ${f1(R(p.T),1)} ${B('Ом','Ом')}`,'t','start')+tx(700,48,B('Медь: R₀ = 10 Ом при 0 °C','Мыс: 0 °C-та R₀ = 10 Ом'),'tb','end');
  return sv(s)},note:()=>B('У металлов сопротивление растёт с температурой.','Металдардың кедергісі температурамен өседі.')},

/* ---------- 24: поле магнита ---------- */
magnet:{ctl:[],svg(){

/* ---------- 25: катушка ---------- */
solenoid:{ctl:[{k:'N',l:()=>B('Число витков N','Орам саны N'),min:2,max:10,step:1,v:6},{k:'I',l:()=>'I, '+B('А','А'),min:1,max:5,step:1,v:2}],svg(p){
  let s='';const x0=250,x1=550,st=(x1-x0)/(p.N);
  for(let i=0;i<p.N;i++){const x=x0+st*i+st/2;s+=`<ellipse cx="${x}" cy="210" rx="${st*0.18+4}" ry="58" class="s" style="stroke-width:5;stroke:var(--accent)"/>`}
  s+=ar(x0-80,210,x1+90,210,'sr','ar');
  const n=Math.min(8,2+Math.round(p.N*p.I/6));
  for(let i=0;i<n;i++){const y=210-(i+1)*Math.min(24,160/(n+1));[1,-1].forEach(sg=>{const yy=210+sg*(i+1)*(Math.min(24,150/(n+1)));
    s+=`<path d="M${x1+90} ${210} C ${x1+190} ${210+sg*(60+i*28)} ${x0-190} ${210+sg*(60+i*28)} ${x0-80} 210" class="sr" style="fill:none;stroke-width:2;opacity:.8" marker-end="url(#ar)"/>`})}
  s+=tx(x0-60,150,'S','t')+tx(x1+90,150,'N','t');
  s+=tx(400,40,`B ~ N·I = ${p.N*p.I}`,'tb')+tx(400,395,B('правило правой руки: четыре пальца — по току, большой палец — к полюсу N','оң қол ережесі: төрт саусақ — ток бағытымен, бас бармақ — N полюсқа'),'tm');
  s+=ci(x0-8,210+66,0,'s');
  s+=ar(x0,278,x0+40,278,'sa','aa')+ar(x1,142,x1-40,142,'sa','aa');
  return sv(s)},note:()=>B('Магнитное поле катушки усиливают: больше витков, больше ток, железный сердечник.','Катушканың магнит өрісін күшейтеді: орам саны көп, ток үлкен, темір өзекше.')},

/* ---------- 26: индукция ---------- */
induction:{ctl:[{k:'m',t:'choice',l:()=>'',o:[{v:0,l:()=>B('Магнит покоится','Магнит тыныштықта')},{v:1,l:()=>B('Магнит вдвигают','Магнитті кіргізеді')},{v:2,l:()=>B('Магнит выдвигают','Магнитті шығарады')}],v:1}],svg(p){

  s+=ln(600,142,640,142)+ln(640,142,640,150)+ln(430,258,430,330)+ln(430,330,640,330)+ln(640,330,640,250);
  s+=ci(640,200,50,'s','style="fill:var(--surface2)"')+tx(640,162,'G','t');

  if(p.m===1)s+=ar(mx-100,250,mx-40,250,'sg','ag');if(p.m===2)s+=ar(mx+40,250,mx-60,250,'sg','ag');
  s+=tx(400,70,p.m===0?B('Поле не меняется — тока нет','Өріс өзгермейді — ток жоқ'):B('Магнитный поток меняется — в катушке индукционный ток','Магнит ағыны өзгереді — катушкада индукциялық ток пайда болады'),'tb');
  return sv(s)},note:()=>B('Индукционный ток возникает при изменении магнитного потока через контур.','Контур арқылы өтетін магнит ағыны өзгергенде индукциялық ток пайда болады.')},

/* ---------- 27: тень и полутень ---------- */
shadow:{ctl:[{k:'ext',t:'choice',l:()=>'',o:[{v:0,l:()=>B('Точечный источник','Нүктелік көз')},{v:1,l:()=>B('Протяжённый источник','Ұзынша көз')}],v:1},{k:'x',l:()=>B('Положение предмета','Дененің орны'),min:200,max:520,step:10,v:360}],svg(p){

  const top=210-half,bot=210+half;
  const pen1=Y(top,210-ho),pen2=Y(bot,210+ho),um1=Y(top,210+ho),um2=Y(bot,210-ho);
  let s=rc(xe,60,12,300,'s','style="fill:var(--surface2)"');
  if(p.ext){s+=`<rect x="${xe}" y="${Math.min(pen1,um1)}" width="12" height="${Math.abs(um1-pen1)}" class="fy" style="opacity:.5"/><rect x="${xe}" y="${Math.min(um2,pen2)}" width="12" height="${Math.abs(pen2-um2)}" class="fy" style="opacity:.5"/><rect x="${xe}" y="${Math.min(um1,um2)}" width="12" height="${Math.abs(um1-um2)}" class="fs0"/>`}
  else s+=`<rect x="${xe}" y="${Math.min(pen1,pen2)}" width="12" height="${Math.abs(pen2-pen1)}" class="fs0"/>`;
  [[top,210-ho],[bot,210+ho],[top,210+ho],[bot,210-ho]].forEach(([a,b],i)=>{if(p.ext||i<2)s+=ln(xs,a,xe,Y(a,b),i<2?'sy':'sy','style="opacity:.8;stroke-width:2"')});
  s+=rc(xo-12,210-ho,24,ho*2,'s','style="fill:var(--fg);stroke:none"');
  if(p.ext)s+=ln(xs,top,xs,bot,'sy','style="stroke-width:12"');else s+=ci(xs,210,9,'fy');
  s+=tx(xe+6,48,B('экран','экран'),'tm')+tx(xo,205+ho+36,B('предмет','дене'),'tm');
  if(p.ext)s+=tx(xe-60,Math.max(pen2,um2)+40,B('полутень','жартылай көлеңке'),'tm')+tx(xe-60,210+4,B('тень','көлеңке'),'tb');else s+=tx(xe-60,210+4,B('тень','көлеңке'),'tb');
  return sv(s)},note:()=>B('Свет распространяется прямолинейно, поэтому за предметом образуются тень и полутень.','Жарық түзу сызықты таралады, сондықтан дененің артында көлеңке және жартылай көлеңке түзіледі.')},

/* ---------- 28: отражение ---------- */
reflect:{ctl:[{k:'a',l:()=>B('Угол падения α, °','Түсу бұрышы α, °'),min:0,max:80,step:5,v:40}],svg(p){

  s+=ar(cx-L*Math.sin(a),cy-L*Math.cos(a),cx-2*Math.sin(a),cy-2*Math.cos(a),'sr','ar')+ar(cx,cy,cx+L*Math.sin(a),cy-L*Math.cos(a),'sa','aa');
  s+=`<path d="M${cx} ${cy-80} A80 80 0 0 0 ${cx-80*Math.sin(a)} ${cy-80*Math.cos(a)}" class="s" style="stroke:var(--y)"/>`+`<path d="M${cx} ${cy-80} A80 80 0 0 1 ${cx+80*Math.sin(a)} ${cy-80*Math.cos(a)}" class="s" style="stroke:var(--y)"/>`;
  s+=tx(cx-60-20,cy-100,'α','tb')+tx(cx+60+20,cy-100,'β','tb')+tx(cx+10,92,B('нормаль','нормаль'),'tm','start');
  s+=tx(cx,cy+56,B('зеркало','айна'),'tm')+tx(400,36,`α = β = ${p.a}°`,'tb');

  const t=T().cg,tk=l.tk,cr=l.cr,con=l.con,lab=l.kind==='lab',A=i=>ansS((tk[i]||['',''])[1]);
  return [
   {h:t.h[0],d:[lc1(cr[0]),lc1(cr[1]||cr[0]),t.f+lc1(con[0])]},
   {h:t.h[1],d:[t.t1.replace('{a}',A(0)),t.t2,t.t3.replace('{a}',A(1)),t.t4.replace('{a}',A(2))]},
   {h:t.h[2],d:[t.g1,lab?t.g2b:t.g2,t.g3+lc1(con[1]||con[0])]}
  ];
}

function stageTabs(i,k){
  const t=T().tabs,has=!!DGMAP[S.n],rf=!!REFT[S.n],rt=[['ref',T().ref]];
  if(i===0)return has?[['c',t.content],['dg',T().fig]]:[];
  if(i===2)return [['c',t.content]].concat(has?[['dg',t.dg]]:[]).concat(rf?rt:[]).concat(k==='lab'?[['tbl',t.tbl]]:[]);
  if(i===3)return has?[['c',t.content],['dg',t.dg]]:[];
  if(i===4)return [['c',t.tasks],['solve',t.solve]].concat(rf?rt:[]);
  return [];
}

function md(lines){
  const out=[];let ul=null;
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  (Array.isArray(lines)?lines:[lines]).forEach(x=>{x=String(x);
    if(x.startsWith('- ')){if(!ul){ul=[];out.push(ul)}ul.push(inl(x.slice(2)))}else{ul=null;out.push(inl(x))}});
  return out.map(o=>Array.isArray(o)?`<ul>${o.map(i=>`<li>${i}</li>`).join('')}</ul>`:`<p>${o}</p>`).join('');
}

let BC=null,applying=false,lastSync='';
try{BC=new BroadcastChannel('ph8_sync');BC.onmessage=ev=>{try{
  const d=ev.data;if(!d||d.v!==1)return;const j=JSON.stringify(d.s);if(j===lastSync)return;lastSync=j;
  applying=true;const o=d.s,lgChanged=o.lg!==S.lg;
  Object.assign(S,{n:o.n,st:o.st,tab:o.tab,dgi:o.dgi,dp:o.dp,sj:o.sj,lg:o.lg,rev:o.rev,seen:o.seen,ticks:o.ticks,cnt:o.cnt,mode:o.mode});
  LS.set('ph8_n',S.n);LS.set('ph8_lg',S.lg);render();applying=false}catch(e){applying=false}}}catch(e){BC=null}

  if(!BC||applying)return;

let MODAL=null;
function openModal(kind){MODAL=kind;drawModal()}
function closeModal(){MODAL=null;$('#mroot').innerHTML=''}
function drawModal(){
  if(!MODAL){return}
  const t=T();let title='',body='',wide=false;
  if(MODAL==='lessons'){title=t.lessons;wide=true;body=lessonsHTML()}
  else if(MODAL==='res'){title=t.resT;wide=true;body=resHTML()}
  else if(MODAL==='crit'){title=t.crit;body=critHTML()}
  else if(MODAL==='light'){title=t.lightT;body=lightHTML()}
  else if(MODAL==='timer'){title=t.timerT;body=timerHTML()}
  else if(MODAL==='pick'){title=t.pickT;wide=true;body=pickHTML()}
  const keepScroll=$('#mroot .ov')?$('#mroot .ov').scrollTop:0;
  $('#mroot').innerHTML=`<div class="ov" data-a="ovclose"><div class="modal ${wide?'wide':''}" role="dialog" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2><button class="ibtn" data-a="close" aria-label="${esc(t.close)}">${ic('close')}</button></div>${body}</div></div>`;
  $('#mroot .ov').scrollTop=keepScroll;
  if(MODAL==='timer')timerSync(true);
}
function lessonsHTML(){
  const t=T();let h='',lastSec='';
  for(let q=0;q<4;q++){
    const from=[1,9,17,27][q],to=[8,16,26,34][q];
    h+=`<h3 style="margin-top:.8em">${esc(t.quarter[q])}</h3>`;lastSec='';
    h+='<div class="lgrid">';
    for(let n=from;n<=to;n++){
      const d=D[S.lg][n];
      if(d.sec!==lastSec){h+=`</div><div class="sech">${esc(d.sec)}</div><div class="lgrid">`;lastSec=d.sec}
      h+=`<button class="lcard" data-a="les-${n}" aria-current="${n===S.n}"><span class="nn">${n}</span><span class="tx">${esc(d.t)}</span><span class="kind ${d.kind}">${esc(t.kinds[d.kind])}</span></button>`;
    }
    h+='</div>';
  }
  return h;
}

const P={called:[],cur:'',spin:false,tab:0,noRep:true,gs:4,roles:true,groups:null,vcur:''};
function pool(){
  const raw=LS.get('ph8_names','');let a=String(raw).split('\n').map(s=>s.trim()).filter(Boolean);
  if(!a.length){const n=LS.get('ph8_count',24);a=Array.from({length:n},(_,i)=>String(i+1))}

function pickHTML(){
  const t=T(),names=LS.get('ph8_names',''),all=pool();
  const tabs=`<div class="seg" style="align-self:flex-start"><button data-a="ptab-0" aria-pressed="${P.tab===0}">${esc(t.tabPick)}</button><button data-a="ptab-1" aria-pressed="${P.tab===1}">${esc(t.tabGroups)}</button></div>`;
  const list=`<div class="card"><span class="lab">${esc(t.names)}</span><textarea id="names" data-names>${esc(names)}</textarea><div class="tmeta">${esc(t.namesHint)}</div>
    <div class="row"><label>${esc(t.count)}: <input class="num-in" id="cnt" type="number" min="2" max="40" value="${LS.get('ph8_count',24)}" style="width:5em"></label></div></div>`;
  if(P.tab===0){
    return tabs+`<div class="grid"><div style="display:flex;flex-direction:column;gap:.8em"><div class="pickbox" id="pickbox">${esc(P.cur||t.ready)}</div>
      <div class="row"><button class="big" data-a="draw">${ic('dice')} ${esc(t.draw)}</button><button class="big alt" data-a="variant">${esc(t.variant)}</button><button class="big alt" data-a="presetpick">${ic('reset')} ${esc(t.resetPick)}</button>
      <label class="row"><input type="checkbox" id="norep" ${P.noRep?'checked':''} style="width:1.5em;height:1.5em"> ${esc(t.noRep)}</label></div>
      <div class="tags">${all.map(n=>`<span class="tag ${P.called.includes(n)?'used':''}">${esc(n)}</span>`).join('')}</div></div>${list}</div>`;
  }
  return tabs+`<div class="grid"><div style="display:flex;flex-direction:column;gap:.8em"><div class="row"><label>${esc(t.gsize)}: <select id="gs">${[2,3,4,5,6].map(x=>`<option ${x===P.gs?'selected':''}>${x}</option>`).join('')}</select></label>
     <label class="row"><input type="checkbox" id="roles" ${P.roles?'checked':''} style="width:1.5em;height:1.5em"> ${esc(t.roles)}</label>
     <button class="big" data-a="mkgroups">${ic('users')} ${esc(t.make)}</button></div>
     <div class="grid">${(P.groups||[]).map((g,gi)=>`<div class="gcard"><h3>${esc(t.group)} ${gi+1}</h3>${g.map((n,j)=>`<div><span>${esc(n)}</span>${P.roles&&g.length===4?`<small>${esc(t.roleNames[j])}</small>`:''}</div>`).join('')}</div>`).join('')}</div></div>${list}</div>`;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){
  if(P.spin)return;const t=T();let all=pool(),p=P.noRep?all.filter(n=>!P.called.includes(n)):all;
  if(!p.length){P.cur=t.allDone;const b=$('#pickbox');if(b)b.textContent=P.cur;return}
  const win=p[Math.floor(Math.random()*p.length)];P.spin=true;let i=0;const steps=22;
  (function step(){
    const b=$('#pickbox');if(!b){P.spin=false;return}
    i++;const last=i>=steps;const v=last?win:p[Math.floor(Math.random()*p.length)];b.textContent=v;
    if(last){P.spin=false;P.cur=win;if(P.noRep&&!P.called.includes(win))P.called.push(win);beep(660,.15);drawModal();return}
    setTimeout(step,40+i*i*0.9);
  })();
}
function mkGroups(){
  const all=shuffle(pool()),size=P.gs,ng=Math.max(1,Math.ceil(all.length/size)),gs=Array.from({length:ng},()=>[]);
  all.forEach((n,i)=>gs[i%ng].push(n));P.groups=gs;drawModal();
}

/* ---------- таймер ---------- */
const TM={left:0,total:0,run:false,end:0,id:null,over:false};
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function timerSync(reset){
  if(reset&&!TM.run){TM.total=DUR()[S.st]*60;TM.left=TM.total;TM.over=false}
  timerPaint();
}
function timerPaint(){
  const pct=TM.total?Math.min(100,(1-TM.left/TM.total)*100):0;
  [['#tdisp','#tprog','#ttog'],['#bigt','#bprog','#ttog2']].forEach(([d,p,b])=>{
    const de=$(d),pe=$(p),be=$(b);
    if(de){de.textContent=fmt(TM.left);de.classList.toggle('over',TM.over)}
    if(pe)pe.style.width=pct+'%';
    if(be)be.innerHTML=ic(TM.run?'pause':'play');
  });
}
function timerTick(){
  TM.left=(TM.end-Date.now())/1000;
  if(TM.left<=0){TM.left=0;TM.run=false;TM.over=true;clearInterval(TM.id);beep(880,.5);setTimeout(()=>beep(880,.5),600)}
  timerPaint();
}
function timerToggle(){
  if(TM.run){TM.run=false;clearInterval(TM.id)}
  else{if(TM.left<=0){TM.left=TM.total}TM.over=false;TM.run=true;TM.end=Date.now()+TM.left*1000;TM.id=setInterval(timerTick,250);beep(0,0)}
  timerPaint();
}
function timerAdd(m){TM.left=Math.max(0,TM.left+m*60);TM.total=Math.max(TM.total,TM.left);TM.over=false;if(TM.run)TM.end=Date.now()+TM.left*1000;timerPaint()}
function timerSet(m){TM.total=m*60;TM.left=TM.total;TM.over=false;if(TM.run)TM.end=Date.now()+TM.left*1000;timerPaint()}
function timerReset(){TM.run=false;clearInterval(TM.id);TM.total=TM.total||DUR()[S.st]*60;TM.left=TM.total;TM.over=false;timerPaint()}
let AC=null;
function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(!f)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d)}catch(e){}}

/* ---------- ручка ---------- */
const cv=$('#pen'),cx=cv.getContext('2d');
const PN={color:'auto',size:5,erase:false,stack:[],draw:false,last:null,blank:false};
const PCOL=['auto','#e53935','#1e88e5','#43a047','#fb8c00','#fdd835'];
function penColor(){if(PN.color==='auto')return getComputedStyle(document.documentElement).getPropertyValue('--fg').trim()||'#000';return PN.color}
function sizeCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,2),w=innerWidth,h=innerHeight;
  let tmp=null;if(cv.width&&cv.height){tmp=document.createElement('canvas');tmp.width=cv.width;tmp.height=cv.height;tmp.getContext('2d').drawImage(cv,0,0)}
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cx.setTransform(dpr,0,0,dpr,0,0);cx.lineCap='round';cx.lineJoin='round';
  if(tmp)cx.drawImage(tmp,0,0,w,h);
}
function snap(){try{const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;c.getContext('2d').drawImage(cv,0,0);PN.stack.push(c);if(PN.stack.length>12)PN.stack.shift()}catch(e){}}
function penUndo(){const c=PN.stack.pop();cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);if(c)cx.drawImage(c,0,0);cx.restore()}
function penClear(all){cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.restore();if(all)PN.stack=[]}
cv.addEventListener('pointerdown',e=>{if(!S.pen)return;e.preventDefault();snap();PN.draw=true;PN.last=[e.clientX,e.clientY];try{cv.setPointerCapture(e.pointerId)}catch(_){}
  stroke(e.clientX,e.clientY,e.clientX+.01,e.clientY+.01,e.pressure)});
cv.addEventListener('pointermove',e=>{if(!PN.draw)return;const ev=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];(ev.length?ev:[e]).forEach(p=>{stroke(PN.last[0],PN.last[1],p.clientX,p.clientY,p.pressure);PN.last=[p.clientX,p.clientY]})});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{PN.draw=false}));
function stroke(x0,y0,x1,y1,pr){
  cx.globalCompositeOperation=PN.erase?'destination-out':'source-over';
  cx.strokeStyle=penColor();cx.lineWidth=PN.erase?PN.size*5:PN.size*(pr&&pr!==.5?.6+pr*.8:1);
  cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke();
}
function penColors(){if(S.pen)penBar()}
function penBar(){
  const t=T();
  $('#pt').innerHTML=PCOL.map(c=>`<button class="sw" data-a="pc-${c}" aria-pressed="${!PN.erase&&PN.color===c}" aria-label="${c}" style="background:${c==='auto'?'var(--fg)':c}"></button>`).join('')+
  [3,6,12].map(s=>`<button class="ibtn" data-a="ps-${s}" aria-pressed="${PN.size===s}" style="${PN.size===s?'border-color:var(--accent)':''}"><i style="display:block;width:${s*1.6+4}px;height:${s*1.6+4}px;border-radius:50%;background:var(--fg)"></i></button>`).join('')+
  `<button class="ibtn" data-a="perase" style="${PN.erase?'background:var(--accent);color:var(--accent-fg)':''}">${ic('eraser')}</button>
   <button class="ibtn" data-a="pundo">${ic('undo')}</button><button class="ibtn" data-a="pclear">${ic('trash')}</button>
   <button class="ibtn" data-a="pblank" style="${PN.blank?'background:var(--accent);color:var(--accent-fg)':''}">${ic('board')}</button>
   <button class="ibtn" data-a="pclose">${ic('close')}</button>`;
}
function penToggle(on){
  S.pen=on;cv.classList.toggle('on',on);$('#pt').classList.toggle('on',on);if(on){sizeCanvas();penBar()}
  document.querySelectorAll('.dockb')[0].setAttribute('aria-pressed',on);
  if(!on){PN.blank=false;$('#blank').classList.remove('on')}
}

/* ---------- действия ---------- */
function setStage(i){
  S.tab=0;S.st=Math.max(0,Math.min(6,i));penClear(true);
  if(TM.run){TM.run=false;clearInterval(TM.id)}
  render();scrollTo({top:0});
}
function setLesson(n){S.tab=0;S.dgi=0;S.sj=0;S.n=n;LS.set('ph8_n',n);S.st=0;S.cnt=[0,0,0];penClear(true);if(TM.run){TM.run=false;clearInterval(TM.id)}closeModal();render();scrollTo({top:0})}
function refreshLvl(){document.querySelectorAll('[data-lvlbox]').forEach(e=>e.innerHTML=levelPill())}
function refreshTL(){document.querySelectorAll('[data-tl]').forEach(e=>{const p=e.parentElement;e.outerHTML;});if(MODAL==='light')drawModal();else renderStage()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='ovclose'){if(e.target===b)closeModal();return}
  if(a==='close'){closeModal();return}
  if(a==='lessons'){openModal('lessons');return}
  if(a.startsWith('scr-')){S.scr=a==='scr-0'?'st':'tc';LS.set('ph8_scr',S.scr);render();return}
  if(a.startsWith('tv-')){S.tview=a.slice(3);renderStage();return}
  if(a.startsWith('gost-')){S.tview='stage';setStage(+a.slice(5));return}
  if(a.startsWith('tab-')){S.tab=+a.slice(4);renderStage();return}
  if(a.startsWith('dg-')){S.dgi=+a.slice(3);renderStage();return}
  if(a.startsWith('dc-')){const m=a.match(/^dc-(\w+)-(-?\d+)$/);if(m){dgParams(dgKind())[m[1]]=+m[2];renderStage()}return}
  if(a.startsWith('sj-')){S.sj=+a.slice(3);renderStage();return}
  if(a==='solbg'){S.solbg=S.solbg==='grid'?'lines':S.solbg==='lines'?'plain':'grid';renderStage();return}
  if(a==='addrow'){(S.tbl[S.n]||[]).push(['','','','','']);renderStage();return}
  if(a==='rail'){S.min=!S.min;LS.set('ph8_rail',S.min);render();return}
  if(a.startsWith('les-')){setLesson(+a.slice(4));return}
  if(a==='lg-ru'||a==='lg-kk'){S.lg=a.slice(3);LS.set('ph8_lg',S.lg);render();drawModal();return}
  if(a==='theme'){toggleTheme();return}
  if(a==='fs+'||a==='fs-'){S.fs=Math.max(.7,Math.min(1.8,+(S.fs+(a==='fs+'?.1:-.1)).toFixed(2)));LS.set('ph8_fs',S.fs);applyFs();return}
  if(a==='full'){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(_){}return}
  if(a.startsWith('st-')){setStage(+a.slice(3));return}
  if(a==='prev'){setStage(S.st-1);return}
  if(a==='next'){setStage(S.st+1);return}
  if(a.startsWith('tool-')){const k=a.slice(5);if(k==='pen'){penToggle(!S.pen)}else if(k==='light'){S.light=!S.light;render()}else openModal(k);return}
  if(a.startsWith('seen-')){const k=S.n+'d'+a.slice(5);S.seen[k]=!S.seen[k];renderStage();return}
  if(a.startsWith('revc-')){const k=S.n+'c'+a.slice(5);S.rev[k]=!S.rev[k];renderStage();return}
  if(a.startsWith('ans-')){const k=S.n+'a'+a.slice(4);S.rev[k]=!S.rev[k];renderStage();return}
  if(a==='ansall'){const on=!L().tk.every((_,j)=>S.rev[S.n+'a'+j]);L().tk.forEach((_,j)=>S.rev[S.n+'a'+j]=on);renderStage();return}
  if(a.startsWith('tick-')){const tk=S.ticks[S.n]||(S.ticks[S.n]=[]),i=+a.slice(5);tk[i]=!tk[i];
    document.querySelectorAll('[data-a="tick-'+i+'"]').forEach(x=>x.setAttribute('aria-checked',!!tk[i]));refreshLvl();return}
  if(a==='tkreset'){S.ticks[S.n]=[];document.querySelectorAll('[data-a^="tick-"]').forEach(x=>x.setAttribute('aria-checked','false'));refreshLvl();return}
  if(a.startsWith('c+')||a.startsWith('c-')){
    if(a==='c-reset'){S.cnt=[0,0,0]}
    else if(a.startsWith('c+')){S.cnt[+a.slice(2)]++}
    else{const m=a.match(/^c-(\d)-1$/);if(m)S.cnt[+m[1]]=Math.max(0,S.cnt[+m[1]]-1)}
    refreshSide();if(!S.light)renderStage();return}
  if(a.startsWith('mode-')){S.mode=S.mode===+a.slice(5)?-1:+a.slice(5);refreshSide();return}
  if(a==='lclose'){S.light=false;render();return}
  if(a==='t-toggle'){timerToggle();return}
  if(a==='t-reset'){timerReset();return}
  if(a==='t-m'){timerAdd(-1);return}
  if(a==='t-p'){timerAdd(1);return}
  if(a.startsWith('t-set-')){timerSet(+a.slice(6));return}
  if(a==='ptab-0'||a==='ptab-1'){P.tab=+a.slice(5);drawModal();return}
  if(a==='draw'){draw();return}
  if(a==='variant'){P.cur=['A','B','C'][Math.floor(Math.random()*3)];drawModal();beep(660,.1);return}
  if(a==='presetpick'){P.called=[];P.cur='';drawModal();return}
  if(a==='mkgroups'){mkGroups();return}
  if(a.startsWith('pc-')){PN.color=a.slice(3);PN.erase=false;penBar();return}
  if(a.startsWith('ps-')){PN.size=+a.slice(3);penBar();return}
  if(a==='perase'){PN.erase=!PN.erase;penBar();return}
  if(a==='pundo'){penUndo();return}
  if(a==='pclear'){snap();penClear(false);return}
  if(a==='pblank'){PN.blank=!PN.blank;$('#blank').classList.toggle('on',PN.blank);penBar();return}
  if(a==='pclose'){penToggle(false);return}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.dp){const kind=dgKind(),p=dgParams(kind);p[el.dataset.dp]=+el.value;const c=DG[kind].ctl.find(x=>x.k===el.dataset.dp);
    const v=$('#dv-'+el.dataset.dp);if(v)v.textContent=f1(+el.value,c&&c.step<1?1:0);$('#dgsvg').innerHTML=DG[kind].svg(p);sync();const n=$('#dgnote');if(n)n.textContent=DG[kind].note();return}
  if(el.dataset&&el.dataset.ws){S.sol[el.dataset.ws]=el.innerText;return}
  if(el.dataset&&el.dataset.tc){const m=el.dataset.tc.match(/^(h|\d+)-(\d+)$/);if(m){if(m[1]==='h')S.tbl[S.n+'h'][+m[2]]=el.innerText;else S.tbl[S.n][+m[1]][+m[2]]=el.innerText}return}
  if(el.id==='names'){LS.set('ph8_names',el.value);P.called=[];return}
  if(el.id==='cnt'){LS.set('ph8_count',Math.max(2,Math.min(40,+el.value||24)));P.called=[];return}
  if(el.dataset&&el.dataset.slot){
    const l=getLinks(),m=el.dataset.slot.match(/^([tu])(\d)$/);l[+m[2]][m[1]]=el.value;LS.set('ph8_links_'+S.n,l);
    const a=$('#sl'+m[2]);if(a&&m[1]==='u'){const u=fixUrl(el.value);a.href=u||'#';a.style.opacity=u?1:.4;a.style.pointerEvents=u?'auto':'none'}
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='norep')P.noRep=e.target.checked;
  if(e.target.id==='gs')P.gs=+e.target.value;
  if(e.target.id==='roles'){P.roles=e.target.checked;drawModal()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&MODAL){closeModal();return}
  if(MODAL||/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||''))return;
  if(e.key==='ArrowRight')setStage(S.st+1);if(e.key==='ArrowLeft')setStage(S.st-1);
});
applyTheme();applyFs();render();
</script>
