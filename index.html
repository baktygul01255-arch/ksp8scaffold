тметрі бар тізбектің сызбасын өздері құрып, олардың жалғануын түсіндіреді","s":["Ток көздерін және токтың өмір сүру шарттарын атайды","Тізбектің сызбасын шартты белгілермен бейнелейді","Қарапайым тізбекті құрастырып, кілттің жұмысын түсіндіреді"],"con":["Электр тогы – зарядталған бөлшектердің реттелген қозғалысы; шарттары: еркін зарядтар және электр өрісі (ток көзі)","Ток күші I = q/t, бірлігі – ампер (А); кернеу U = A/q, бірлігі – вольт (В)","Амперметрді тізбекке тізбектей, вольтметрді тізбек бөлігіне параллель қосады"],"tk":[["Өткізгіштің қимасынан 10 с-та 5 Кл заряд өтті. Ток күшін табыңыз.","I = 5/10 = 0,5 А"],["Ток күші 0,3 А кезінде шамнан 2 мин-та қандай заряд өтеді?","q = 0,3·120 = 36 Кл"],["Сызба сызыңыз: көз, кілт, шам және амперметр тізбектей, вольтметр шамға параллель.","Амперметр – тізбектің үзіліміне, вольтметр – шамға параллель"],["Электр тогының өмір сүруінің екі шартын атаңыз.","Еркін зарядталған бөлшектер және электр өрісі (ток көзі)"]],"hw":"тақырып бойынша параграф; қалта шамының сызбасын салу","res":"гальваникалық элементтер, шамдар, кілттер, сымдар, шартты белгілер карточкалары","live":"батареялар, телефонды зарядтау, электромузыкалық аспаптарды қоректендіру","tb":"көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру","cr":["Электр тогының пайда болуын және өмір сүру шарттарын түсіндіреді","Электр тізбегін шартты белгілермен бейнелейді","Кернеудің физикалық мағынасын және оның бірлігін түсіндіреді"],"sec":"8.3 А Тұрақты электр тогы (7 с)","goals":[{"c":"8.4.2.1","t":"электр тогы ұғымын және электр тогының пайда болу шарттарын түсіндіру"},{"c":"8.4.2.2","t":"электр схемасын графикалық бейнелеуде электр тізбегі элементтерінің шартты белгілерін қолдану"},{"c":"8.4.2.3","t":"кернеудің физикалық мағынасын, оның өлшем бірлігін түсіндіру"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Тәжірибе арқылы оқу (EntreComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Телефон батареядан жұмыс істейді, ал сыныптағы шам розеткадан. Олардың ортақ тұсы не және сымдармен не ағады?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Заряд дегеніміз не және қандай бірлікпен өлшенеді?","- Қандай заттар өткізгіш болады?","- Электр өрісі дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Жаңа материалды зерттеу","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + тәжірибелік бекеттер.","Бекеттер: «Ток көздері» (гальваникалық элемент, батарея, аккумулятор, жемістен жасалған батарея), «Тізбек элементтері» (шартты белгілер карточкалары), «Қарапайым тізбек» (көз, кілт және шамнан тізбек құрастыру).","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – шартты белгілері және қарапайым тізбектің сызбасы дайын бекет карточкалары;","- **2-саты «Кеңес»** – бекет карточкалары, сызбаны кеңес бойынша құрады;","- **3-саты «Өздігінен»** – амперметрі мен вольтметрі бар тізбектің сызбасын өздері құрып, олардың жалғануын түсіндіреді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Ток көздерін және токтың өмір сүру шарттарын атайды","Тізбектің сызбасын шартты белгілермен бейнелейді","Қарапайым тізбекті құрастырып, кілттің жұмысын түсіндіреді","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["гальваникалық элементтер, шамдар, кілттер, сымдар, шартты белгілер карточкалары"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Электр тогы – зарядталған бөлшектердің реттелген қозғалысы; шарттары: еркін зарядтар және электр өрісі (ток көзі)","- Ток күші I = q/t, бірлігі – ампер (А); кернеу U = A/q, бірлігі – вольт (В)","- Амперметрді тізбекке тізбектей, вольтметрді тізбек бөлігіне параллель қосады"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: тақырып бойынша параграф; қалта шамының сызбасын салу;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Электр тогы ұғымын және электр тогының пайда болу шарттарын түсіндіру."],["Тақырыбы","Электр тогы. Ток көздері. Электр тізбегі және оның бөліктері. Ток күші және кернеу"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","гальваникалық элементтер, шамдар, кілттер, сымдар, шартты белгілер карточкалары"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","батареялар, телефонды зарядтау, электромузыкалық аспаптарды қоректендіру"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + тәжірибелік бекеттер."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"18":{"kind":"lab","t":"№ 3 ЗЖ «Электр тізбегін құрастыру және оның әртүрлі бөліктеріндегі ток күші мен кернеуді өлшеу». Электр кедергісі. Меншікті кедергі. Реостат","hook":"Қыздыру шамының жібі неге жіңішке, ал оған баратын сымдар неге жуан?","dq":["Амперметр мен вольтметрді қалай қосады?","Ток күшінің бірлігі қалай аталады?","Өткізгішпен ток жүруінің «қиындығы» неге байланысты болуы мүмкін?"],"m":"ынтымақтастықта оқыту + зертханалық жұмыс","act":"Зертханалық жұмыс: көзден, кілттен, екі шам немесе резистордан, амперметрден және вольтметрден тізбек құрастырып, әр бөліктегі ток күші мен кернеуді өлшейді.","t1":"дайын сызба, қадамдық нұсқаулық және жазу үлгісі бар кесте","t2":"сызба мен кесте, кейбір қадамдары жоқ жоспар","t3":"сызбаны, жоспарды және өлшеу кестесін өздері құрады","s":["Тізбекті сызба бойынша құрастырып, құралдардың полярлығын тексереді","Тізбек бөліктеріндегі ток күші мен кернеуді бөлік бағасын ескеріп өлшеп, жазады","Нәтижелерді салыстырып, қорытынды жасайды"],"con":["R кедергісі өткізгіштің токқа қарсы әрекетін сипаттайды; бірлігі – Ом; 1 Ом = 1 В/А","R = ρ·l/S: кедергі ұзындыққа, қима ауданына және материалға тәуелді","Реостат – тізбектің кедергісі мен ток күшін өзгертетін құрал"],"tk":[["Ұзындығы 100 м, қимасы 2 мм² мыс сым. Кедергісін табыңыз (ρ = 0,017 Ом·мм²/м).","R = 0,017·100/2 = 0,85 Ом"],["Сымның ұзындығын екі есе арттырса, кедергісі қалай өзгереді?","Екі есе артады"],["Шамдағы ток күші 0,5 А, кернеуі 3 В. Шамның кедергісін табыңыз.","R = 3/0,5 = 6 Ом"],["Реостат не үшін қажет?","Тізбектің кедергісі мен ток күшін өзгерту үшін"]],"hw":"№ 3 ЗЖ қорытындысын рәсімдеу; өткізгіш кедергісі туралы параграф","res":"ток көзі, шамдар немесе резисторлар, амперметр, вольтметр, кілт, сымдар, реостат","live":"дыбыс реттегіші, жарық реттегіші, сымдардың жуандығы","tb":"көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру","cr":["Ток күші мен кернеуді өлшеп, бөлік бағасын ескеріп жазады","Кедергінің физикалық мағынасын және бірлігін түсіндіреді","Есепте меншікті кедергі формуласын қолданады","Қауіпсіздік техникасын сақтайды"],"sec":"8.3 А Тұрақты электр тогы (7 с)","goals":[{"c":"8.4.2.4","t":"электр тізбегіндегі ток күші мен кернеуді анықтау"},{"c":"8.1.3.3","t":"физика кабинетінде қауіпсіздік ережелерін білу және сақтау"},{"c":"8.4.2.7","t":"кедергінің физикалық мағынасын, оның өлшем бірлігін түсіндіру"},{"c":"8.4.2.8","t":"есеп шығарғанда өткiзгiштiң меншiктi кедергiсiнің формуласын қолдану"}],"compN":["Зерттеушілік ойлау (GreenComp)","Тәжірибе арқылы оқу (EntreComp)","Ынтымақтастық (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Қыздыру шамының жібі неге жіңішке, ал оған баратын сымдар неге жуан?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Амперметр мен вольтметрді қалай қосады?","- Ток күшінің бірлігі қалай аталады?","- Өткізгішпен ток жүруінің «қиындығы» неге байланысты болуы мүмкін?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс: көзден, кілттен, екі шам немесе резистордан, амперметрден және вольтметрден тізбек құрастырып, әр бөліктегі ток күші мен кернеуді өлшейді.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – дайын сызба, қадамдық нұсқаулық және жазу үлгісі бар кесте;","- **2-саты «Кеңес»** – сызба мен кесте, кейбір қадамдары жоқ жоспар;","- **3-саты «Өздігінен»** – сызбаны, жоспарды және өлшеу кестесін өздері құрады.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Тізбекті сызба бойынша құрастырып, құралдардың полярлығын тексереді","Тізбек бөліктеріндегі ток күші мен кернеуді бөлік бағасын ескеріп өлшеп, жазады","Нәтижелерді салыстырып, қорытынды жасайды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["ток көзі, шамдар немесе резисторлар, амперметр, вольтметр, кілт, сымдар, реостат"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- R кедергісі өткізгіштің токқа қарсы әрекетін сипаттайды; бірлігі – Ом; 1 Ом = 1 В/А","- R = ρ·l/S: кедергі ұзындыққа, қима ауданына және материалға тәуелді","- Реостат – тізбектің кедергісі мен ток күшін өзгертетін құрал"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 3 ЗЖ қорытындысын рәсімдеу; өткізгіш кедергісі туралы параграф;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Электр тізбегіндегі ток күші мен кернеуді анықтау."],["Тақырыбы","№ 3 ЗЖ «Электр тізбегін құрастыру және оның әртүрлі тұрақты кезде кернеуді өзгертіп, ток күшін өлшейді (4–5 өлшеу). 2-бөлім: кернеу тұрақты кезде резисторды ауыстырып (3 мән), ток күшін өлшейді. I(U) графигін салады.","t1":"дайын сызба, қадамдық нұсқаулық, бірінші жолы үлгі ретінде толтырылған кесте","t2":"бос орындары бар сызба (вольтметр мен реостат жоқ), кейбір қадамдары жоқ жоспар","t3":"сызбаны, жоспарды және кестені өздері құрып, қорытынды тұжырымдайды","s":["Тізбекті сызба бойынша құрастырып, I мен U-ды қателікті (Δ = бөлік бағасының жартысы) ескеріп өлшейді","I(U) графигін салады немесе PhET «Ом заңы» симуляциясында тексереді","Ток күшінің кернеуге және кедергіге тәуелділігі туралы қорытынды жасайды"],"con":["Ток күші кернеуге тура пропорционал және кедергіге кері пропорционал: I = U/R","Металл өткізгіш үшін I(U) графигі – координаталар басынан өтетін түзу (вольт-амперлік сипаттама)","U = I·R; R = U/I; 1 Ом = 1 В / 1 А; кедергі – өткізгіштің қасиеті"],"tk":[["Кедергісі 10 Ом резисторға 5 В кернеу түсірілген. Ток күшін табыңыз.","I = 5/10 = 0,5 А"],["Шамнан 6 В кернеуде 0,3 А ток өтеді. Шамның кедергісін табыңыз.","R = 6/0,3 = 20 Ом"],["Құлаққаптың кедергісі 32 Ом. 1,6 В кернеуде ток күшін миллиамперпен табыңыз.","I = 1,6/32 = 0,05 А = 50 мА"],["25 Ом өткізгіш 0,2 А-ге дейінгі токқа шыдайды. Оны 6 В-қа қосуға бола ма? Ең үлкен рұқсат етілген кернеу қандай?","I = 6/25 = 0,24 А > 0,2 А – болмайды; U = 0,2·25 = 5 В"]],"hw":"№ 4 ЗЖ қорытындысын рәсімдеу; Ом заңына үш есеп шығару","res":"ток көзі, резисторлар, амперметр, вольтметр, реостат, кілт, сымдар, миллиметрлік қағаз, PhET «Ом заңы»","live":"құлаққап және акустика, сымға қауіпсіз жүктеме, электр аспаптары","tb":"көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру","cr":["I(U) графигін салып, вольт-амперлік сипаттаманы түсіндіреді","Тәжірибелік деректерді қателікті ескеріп жазады","Есепте Ом заңын қолданады: «Берілгені», СИ, есептеу, жауабы","Қауіпсіздік техникасын сақтайды"],"sec":"8.3 А Тұрақты электр тогы (7 с)","goals":[{"c":"8.4.2.5","t":"сипаттамасын графикалық түрде бейнелеу және түсіндіру"},{"c":"8.1.3.1","t":"эксперименттен деректерді жинақтау, талдау және қателіктерін ескеріп жазу"},{"c":"8.1.3.3","t":"физика кабинетінде қауіпсіздік ережелерін білу және сақтау"},{"c":"8.4.2.6","t":"тізбек бөлігі үшін Ом заңын есептер шығаруда қолдану"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Цифрлық технологияларды шығармашылықпен пайдалану (DigComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Бір телефоннан кедергісі 32 Ом құлаққап 250 Ом құлаққаптан неге қаттырақ ойнайды?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Ток күшін немен өлшейді және бұл құралды қалай қосады?","- Кернеу мен кедергінің бірліктері қандай?","- Өткізгіштің кедергісі неге байланысты?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс. 1-бөлім: кедергі тұрақты кезде кернеуді өзгертіп, ток күшін өлшейді (4–5 өлшеу). 2-бөлім: кернеу тұрақты кезде резисторды ауыстырып (3 мән), ток күшін өлшейді. I(U) графигін салады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – дайын сызба, қадамдық нұсқаулық, бірінші жолы үлгі ретінде толтырылған кесте;","- **2-саты «Кеңес»** – бос орындары бар сызба (вольтметр мен реостат жоқ), кейбір қадамдары жоқ жоспар;","- **3-саты «Өздігінен»** – сызбаны, жоспарды және кестені өздері құрып, қорытынды тұжырымдайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Тізбекті сызба бойынша құрастырып, I мен U-ды қателікті (Δ = бөлік бағасының жартысы) ескеріп өлшейді","I(U) графигін салады немесе PhET «Ом заңы» симуляциясында тексереді","Ток күшінің кернеуге және кедергіге тәуелділігі туралы қорытынды жасайды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["ток көзі, резисторлар, амперметр, вольтметр, реостат, кілт, сымдар, миллиметрлік қағаз, PhET «Ом заңы»"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Ток күші кернеуге тура пропорционал және кедергіге кері пропорционал: I = U/R","- Металл өткізгіш үшін I(U) графигі – координаталар басынан өтетін түзу (вольт-амперлік сипаттама)","- U = I·R; R = U/I; 1 Ом = 1 В / 1 А; кедергі – өткізгіштің қасиеті"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 4 ЗЖ қорытындысын рәсімдеу; Ом заңына үш есеп шығару;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Сипаттамасын графикалық түрде бейнелеу және түсіндіру."],["Тақырыбы","Тізбек бөлігі үшін Ом заңы. № 4 ЗЖ «Тізбек бөлігіндегі ток күшінің кернеуге және кедергіге тәуелділігін зерттеу»"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","ток көзі, резисторлар, амперметр, вольтметр, реостат, кілт, сымдар, миллиметрлік қағаз, PhET «Ом заңы»"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","құлаққап және акустика, сымға қауіпсіз жүктеме, электр аспаптары"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)","**d.20** Цифрлық технологияларды шығармашылықпен пайдалану (DigComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + зертханалық жұмыс."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"20":{"kind":"lab","t":"Өткізгіштерді тізбектей және параллель жалғау. № 5 ЗЖ «Өткізгіштерді тізбектей жалғауды зерттеу»","hook":"Жаңа жылдық гирляндада бір шам күйіп кетсе, бүкіл тізбек сөнеді, ал люстрада қалғандары жанып тұрады. Неліктен?","dq":["Тізбек бөлігі үшін Ом заңы қалай тұжырымдалады?","Амперметр мен вольтметрді қалай қосады?","Тізбектің тармақталуы дегеніміз не?"],"m":"ынтымақтастықта оқыту + зертханалық жұмыс","act":"Зертханалық жұмыс: тізбектей жалғанған екі резистордан тізбек құрастырып, әр резистордағы және бүкіл бөліктегі ток күші мен кернеуді өлшейді.","t1":"дайын сызба, нұсқаулық және жазу үлгісі бар кесте","t2":"сызба, кейбір қадамдары жоқ жоспар, үлгісіз кесте","t3":"сызбаны, жоспарды және кестені өздері құрып, заңдылықтарды тұжырымдайды","s":["Екі тізбектей резистордан тізбек құрастырады","I, U₁, U₂ және U өлшейді","I = I₁ = I₂, U = U₁ + U₂, R = R₁ + R₂ қатынастарын тексереді"],"con":["Тізбектей жалғауда I = I₁ = I₂, U = U₁ + U₂, R = R₁ + R₂","Параллель жалғауда U = U₁ = U₂, I = I₁ + I₂, 1/R = 1/R₁ + 1/R₂","Ом заңын әр бөлікке және бүкіл тізбекке қолданады"],"tk":[["10 Ом және 20 Ом резисторлар тізбектей жалғанған, U = 6 В. Ток күшін және бірінші резистордағы кернеуді табыңыз.","R = 30 Ом; I = 6/30 = 0,2 А; U₁ = 0,2·10 = 2 В"],["Әрқайсысы 15 Ом екі резистор тізбектей жалғанған. Жалпы кедергіні табыңыз.","R = 15 + 15 = 30 Ом"],["6 Ом және 3 Ом резисторлар параллель жалғанған. Жалпы кедергіні табыңыз.","R = 6·3/(6 + 3) = 2 Ом"],["Тізбектей тізбекте бірінші шамдағы ток күші 0,4 А. Екінші шамдағы ток күші қандай?","0,4 А: тізбектей жалғауда ток күші бірдей"]],"hw":"№ 5 ЗЖ қорытындысын рәсімдеу; өткізгіштерді жалғауға екі есеп шығару","res":"ток көзі, екі резистор, амперметр, вольтметр, кілт, сымдар","live":"жаңа жылдық гирляндалар, үйдегі электр сымдары","tb":"көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру","cr":["Тізбектей жалғаудың заңдылықтарын тәжірибе арқылы алады","Тізбектей және параллель жалғауы бар тізбекті Ом заңы бойынша есептейді","Деректерді қателікті ескеріп жазады","Қауіпсіздік техникасын сақтайды"],"sec":"8.3 А Тұрақты электр тогы (7 с)","goals":[{"c":"8.4.2.11","t":"өткізгіштерді тізбектей және параллель жалғауда тізбек бөлігі үшін Ом заңын қолданып, электр тізбектеріне есептеулер жүргізу"},{"c":"8.4.2.9","t":"өткізгіштерді тізбектей жалғаудың заңдылықтарын эксперимент арқылы алу"},{"c":"8.1.3.3","t":"физика кабинетінде қауіпсіздік ережелерін білу және сақтау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Тәжірибе арқылы оқу (EntreComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Жаңа жылдық гирляндада бір шам күйіп кетсе, бүкіл тізбек сөнеді, ал люстрада қалғандары жанып тұрады. Неліктен?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Тізбек бөлігі үшін Ом заңы қалай тұжырымдалады?","- Амперметр мен вольтметрді қалай қосады?","- Тізбектің тармақталуы дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс: тізбектей жалғанған екі резистордан тізбек құрастырып, әр резистордағы және бүкіл бөліктегі ток күші мен кернеуді өлшейді.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – дайын сызба, нұсқаулық және жазу үлгісі бар кесте;","- **2-саты «Кеңес»** – сызба, кейбір қадамдары жоқ жоспар, үлгісіз кесте;","- **3-саты «Өздігінен»** – сызбаны, жоспарды және кестені өздері құрып, заңдылықтарды тұжырымдайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Екі тізбектей резистордан тізбек құрастырады","I, U₁, U₂ және U өлшейді","I = I₁ = I₂, U = U₁ + U₂, R = R₁ + R₂ қатынастарын тексереді","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["ток көзі, екі резистор, амперметр, вольтметр, кілт, сымдар"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Тізбектей жалғауда I = I₁ = I₂, U = U₁ + U₂, R = R₁ + R₂","- Параллель жалғауда U = U₁ = U₂, I = I₁ + I₂, 1/R = 1/R₁ + 1/R₂","- Ом заңын әр бөлікке және бүкіл тізбекке қолданады"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 5 ЗЖ қорытындысын рәсімдеу; өткізгіштерді жалғауға екі есеп шығару;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Өткізгіштерді тізбектей және параллель жалғауда тізбек бөлігі үшін Ом заңын қолданып, электр тізбектеріне есептеулер жүргізу."],["Тақырыбы","Өткізгіштерді тізбектей және параллель жалғау. № 5 ЗЖ «Өткізгіштерді тізбектей жалғауды зерттеу»"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","ток көзі, екі резистор, амперметр, вольтметр, кілт, сымдар"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","жаңа жылдық гирляндалар, үйдегі электр сымдары"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + зертханалық жұмыс."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"21":{"kind":"lab","t":"№ 6 ЗЖ «Өткізгіштерді параллель қосуды зерделеу»","hook":"Неге пәтерде барлық аспаптарды розеткаға бірінен кейін бірін емес, параллель қосады?","dq":["Тізбектей жалғауда I, U және R неге тең?","Амперметрді қалай қосады?","Тізбектің түйіні дегеніміз не?"],"m":"ынтымақтастықта оқыту + зертханалық жұмыс","act":"Зертханалық жұмыс: параллель жалғанған екі резистордан тізбек құрастырып, әрқайсысындағы кернеуді, әр тармақтағы және тармақталмаған бөліктегі ток күшін өлшейді.","t1":"дайын сызба, нұсқаулық және жазу үлгісі бар кесте","t2":"сызба, кейбір қадамдары жоқ жоспар, үлгісіз кесте","t3":"сызбаны, жоспарды және кестені өздері құрып, заңдылықтарды тұжырымдайды","s":["Екі резисторды параллель жалғап, тізбек құрастырады","U, I₁, I₂ және I өлшейді","U = U₁ = U₂, I = I₁ + I₂ қатынастарын тексеріп, R табады"],"con":["Параллель жалғауда тармақтардағы кернеу бірдей: U = U₁ = U₂","Жалпы ток тармақтардағы токтардың қосындысына тең: I = I₁ + I₂","1/R = 1/R₁ + 1/R₂; жалпы кедергі тармақтардың ең кіші кедергісінен кіші"],"tk":[["6 Ом және 3 Ом резисторлар параллель жалғанған. Жалпы кедергіні табыңыз.","R = 6·3/9 = 2 Ом"],["4 Ом және 12 Ом резисторлар 12 В-қа параллель қосылған. Тармақтардағы токтарды және жалпы токты табыңыз.","I₁ = 3 А; I₂ = 1 А; I = 4 А"],["Неге тұрмыстық аспаптарды параллель қосады?","Барлығында кернеу бірдей (220 В), аспаптар бір-біріне тәуелсіз қосылады"],["Тағы бір параллель резистор қосқанда жалпы кедергі қалай өзгереді?","Азаяды"]],"hw":"№ 6 ЗЖ қорытындысын рәсімдеу; параллель жалғауға екі есеп шығару","res":"ток көзі, екі резистор, амперметр, вольтметр, кілт, сымдар","live":"пәтердегі розеткалар, ұзартқыш, желінің шамадан тыс жүктелуі","tb":"көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру","cr":["Параллель жалғаудың заңдылықтарын тәжірибе арқылы алады","Жалпы кедергіні және тармақтардағы токтарды есептейді","Деректерді қателікті ескеріп жазады","Қауіпсіздік техникасын сақтайды"],"sec":"8.3 А Тұрақты электр тогы (7 с)","goals":[{"c":"8.4.2.10","t":"өткізгіштерді параллель жалғаудың заңдылықтарын эксперимент арқылы анықтау"},{"c":"8.1.3.3","t":"физика кабинетінде қауіпсіздік ережелерін білу және сақтау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Тәжірибе арқылы оқу (EntreComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Неге пәтерде барлық аспаптарды розеткаға бірінен кейін бірін емес, параллель қосады?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Тізбектей жалғауда I, U және R неге тең?","- Амперметрді қалай қосады?","- Тізбектің түйіні дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс: параллель жалғанған екі резистордан тізбек құрастырып, әрқайсысындағы кернеуді, әр тармақтағы және тармақталмаған бөліктегі ток күшін өлшейді.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – дайын сызба, нұсқаулық және жазу үлгісі бар кесте;","- **2-саты «Кеңес»** – сызба, кейбір қадамдары жоқ жоспар, үлгісіз кесте;","- **3-саты «Өздігінен»** – сызбаны, жоспарды және кестені өздері құрып, заңдылықтарды тұжырымдайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Екі резисторды параллель жалғап, тізбек құрастырады","U, I₁, I₂ және I өлшейді","U = U₁ = U₂, I = I₁ + I₂ қатынастарын тексеріп, R табады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["ток көзі, екі резистор, амперметр, вольтметр, кілт, сымдар"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Параллель жалғауда тармақтардағы кернеу бірдей: U = U₁ = U₂","- Жалпы ток тармақтардағы токтардың қосындысына тең: I = I₁ + I₂","- 1/R = 1/R₁ + 1/R₂; жалпы кедергі тармақтардың ең кіші кедергісінен кіші"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 6 ЗЖ қорытындысын рәсімдеу; параллель жалғауға екі есеп шығару;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Өткізгіштерді параллель жалғаудың заңдылықтарын эксперимент арқылы анықтау."],["Тақырыбы","№ 6 ЗЖ «Өткізгіштерді параллель қосуды зерделеу»"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","ток көзі, екі резистор, амперметр, вольтметр, кілт, сымдар"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","пәтердегі розеткалар, ұзартқыш, желінің шамадан тыс жүктелуі"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + зертханалық жұмыс."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"22":{"kind":"lab","t":"Электр тогының жұмысы мен қуаты. Джоуль–Ленц заңы. № 7 ЗЖ «Электр тогының жұмысы мен қуатын өлшеу»","hook":"Шамда 60 Вт, шәйнекте 2000 Вт деп жазылған. Бұл сан нені көрсетеді және ол электр шотына әсер ете ме?","dq":["Күштің жұмысын қандай формуламен есептейді?","U, I және R қалай байланысқан?","Джоуль дегеніміз не?"],"m":"ынтымақтастықта оқыту + зертханалық жұмыс","act":"Зертханалық жұмыс: шамдағы кернеуді, ток күшін және жұмыс уақытын өлшеп, A = U·I·t жұмысын және P = U·I қуатын есептеп, электр энергиясының құнын анықтайды.","t1":"дайын сызба, нұсқаулық, есептеу үлгісі және тариф кестесі","t2":"сызба мен кесте, кейбір қадамдары жоқ жоспар","t3":"өлшеулер мен энергия құнын есептеуді өздері жоспарлайды","s":["Шамның жану уақытын, U және I өлшейді","A мен P есептеп, кВт·сағ-қа аударады","Тариф бойынша электр энергиясының құнын табады"],"con":["A = U·I·t; P = U·I = A/t; қуаттың бірлігі – ватт (Вт)","Джоуль–Ленц заңы: Q = I²·R·t","1 кВт·сағ = 3,6·10⁶ Дж; құны = шығын (кВт·сағ) × тариф"],"tk":[["Шам 220 В және 0,5 А ток күшіне есептелген. Қуатын табыңыз.","P = 220·0,5 = 110 Вт"],["2 кВт электр шәйнек 0,5 сағат жұмыс істейді. Энергия шығынын және 1 кВт·сағ үшін 25 тг тариф кезінде құнын табыңыз (тариф шартты).","A = 2·0,5 = 1 кВт·сағ; құны 25 тг"],["Кедергісі 10 Ом өткізгіште ток күші 2 А кезінде 30 с-та қанша жылу бөлінеді?","Q = 2²·10·30 = 1200 Дж"],["Неге сымдар дерлік қызбайды, ал плитаның спиралі қызарып кетеді?","Q = I²Rt: ток бірдей, бірақ спиральдің кедергісі әлдеқайда үлкен"]],"hw":"№ 7 ЗЖ қорытындысын рәсімдеу; үйдегі тұрмыстық аспаптардың тәулік бойғы энергия шығынын есептеу","res":"ток көзі, шам, амперметр, вольтметр, секундомер, тариф кестесі","live":"электр энергиясының есептегіші, энергияны үнемдеу, қыздырғыш аспаптар","tb":"көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру","cr":["Есептерде ток қуаты мен жұмысының формулаларын және Джоуль–Ленц заңын қолданады","Тәжірибе арқылы ток жұмысы мен қуатын анықтайды","Электр энергиясының құнын кВт·сағ-пен есептейді","Қауіпсіздік техникасын сақтайды"],"sec":"8.3 А Тұрақты электр тогы (7 с)","goals":[{"c":"8.4.2.12","t":"жұмыс және қуат формулаларын есептер шығаруда қолдану"},{"c":"8.4.2.13","t":"Джоуль-Ленц заңын есептер шығару үшін қолдану"},{"c":"8.4.2.14","t":"эксперимент көмегімен электр тогының жұмысы мен қуатын анықтау"},{"c":"8.1.3.3","t":"физика кабинетінде қауіпсіздік ережелерін білу және сақтау"},{"c":"8.4.2.15","t":"кВт*сағ өлшем бірлігін қолданып, электр энергиясының құнын практика жүзінде анықтау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Қаржылық және экономикалық сауаттылық (EntreComp)","Ынтымақтастық (LifeComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Шамда 60 Вт, шәйнекте 2000 Вт деп жазылған. Бұл сан нені көрсетеді және ол электр шотына әсер ете ме?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Күштің жұмысын қандай формуламен есептейді?","- U, I және R қалай байланысқан?","- Джоуль дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс: шамдағы кернеуді, ток күшін және жұмыс уақытын өлшеп, A = U·I·t жұмысын және P = U·I қуатын есептеп, электр энергиясының құнын анықтайды.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – дайын сызба, нұсқаулық, есептеу үлгісі және тариф кестесі;","- **2-саты «Кеңес»** – сызба мен кесте, кейбір қадамдары жоқ жоспар;","- **3-саты «Өздігінен»** – өлшеулер мен энергия құнын есептеуді өздері жоспарлайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Шамның жану уақытын, U және I өлшейді","A мен P есептеп, кВт·сағ-қа аударады","Тариф бойынша электр энергиясының құнын табады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["ток көзі, шам, амперметр, вольтметр, секундомер, тариф кестесі"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- A = U·I·t; P = U·I = A/t; қуаттың бірлігі – ватт (Вт)","- Джоуль–Ленц заңы: Q = I²·R·t","- 1 кВт·сағ = 3,6·10⁶ Дж; құны = шығын (кВт·сағ) × тариф"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 7 ЗЖ қорытындысын рәсімдеу; үйдегі тұрмыстық аспаптардың тәулік бойғы энергия шығынын есептеу;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Жұмыс және қуат формулаларын есептер шығаруда қолдану."],["Тақырыбы","Электр тогының жұмысы мен қуаты. Джоуль–Ленц заңы. № 7 ЗЖ «Электр тогының жұмысы мен қуатын өлшеу»"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","ток көзі, шам, амперметр, вольтметр, секундомер, тариф кестесі"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","электр энергиясының есептегіші, энергияны үнемдеу, қыздырғыш аспаптар"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**e.9** Қаржылық және экономикалық сауаттылық (EntreComp)","**l.6** Ынтымақтастық (LifeComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + зертханалық жұмыс."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"23":{"kind":"sor","t":"Металдардағы кедергінің температураға тәуелділігі. Электрқыздырғыш құралдар. Токтың химиялық әсері. «Тұрақты электр тогы» бөлімі бойынша БЖБ № 5","hook":"Қыздыру шамы көбіне қосылған сәтте күйіп кетеді. Неліктен?","dq":["Металл неден тұрады?","Қызу бөлшектердің қозғалысына қалай әсер етеді?","Кедергі дегеніміз не?"],"m":"жұппен жұмыс + деректерді талдау","act":"Жұптар металл кедергісінің температураға тәуелділік графигін, электролиз сызбасын және қысқа тұйықталу себептерін талдайды.","t1":"жазбалары бар график және сызба, көмекші сұрақтар","t2":"жазбасыз график және сызба","t3":"қысқа тұйықталудың себептері мен алдын алу тәсілдерін өздері түсіндіреді","s":["Металдар кедергісінің температурамен артуын түсіндіреді","Ерітінділердегі токты (электролиз) сипаттайды","Қысқа тұйықталудың себептерін және қорғанысты (сақтандырғыштар) атайды"],"con":["Температура артқанда металдардың кедергісі артады: тор иондары электрондардың қозғалысына көбірек кедергі келтіреді","Ерітінділерде токты оң және теріс иондар тудырады; электролиз кезіндегі зат массасы m = k·I·t (Фарадей заңы)","Қысқа тұйықталу – тізбек нүктелерінің аз кедергімен қосылуы; қорғаныс – сақтандырғыштар, автоматтар, дұрыс оқшаулау"],"tk":[["10 Ом және 15 Ом резисторлар тізбектей жалғанған, U = 5 В. Ток күшін табыңыз.","R = 25 Ом; I = 5/25 = 0,2 А"],["Кернеу 12 В, кедергі 6 Ом. Ток күшін, қуатты және 10 с-тағы жұмысты табыңыз.","I = 2 А; P = 24 Вт; A = 240 Дж"],["2 кВт электр шәйнектің 3 сағаттағы жұмысы 1 кВт·сағ үшін 25 тг тариф кезінде қанша тұрады (тариф шартты)?","6 кВт·сағ · 25 = 150 тг"],["Қысқа тұйықталу дегеніміз не және оның алдын қалай алады?","Өте аз кедергімен қосылу, ток күрт артады; сақтандырғыштар, автоматтар, дұрыс оқшаулау"]],"hw":"«Магнит өрісі» параграфы; екі магнит және темір қыстырғыштар алып келу","res":"карточкалардағы график және сызбалар, БЖБ нұсқаларының карточкалары, калькулятор","live":"шамдардың күйіп кетуі, қыздырғыш аспаптар, гальваника, сымдарды қорғау","cr":["Металдардағы токтың табиғатын және кедергінің температураға тәуелділігін сипаттайды","Қысқа тұйықталудың себептерін және алдын алу тәсілдерін түсіндіреді","Бөлім есептерін (Ом заңы, жалғау, жұмыс және қуат) дұрыс есептеп шығарады"],"sec":"8.3 А Тұрақты электр тогы (7 с)","goals":[{"c":"8.4.2.16","t":"металл өткізгіштердегі электр тогын және оның кедергісінің температураға тәуелділігін сипаттау"},{"c":"8.4.2.17","t":"қысқа тұйықталудың пайда болу себептерін және алдын алу амалдарын түсіндіру"},{"c":"8.4.2.18","t":"сұйықтардағы электр тогын сипаттау"}],"compN":["Жүйелі ойлау (GreenComp)","Сыни ойлау (LifeComp)","Денсаулық пен әл-ауқатты қорғау (DigComp)"],"stages":[{"tm":"0–3","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Қыздыру шамы көбіне қосылған сәтте күйіп кетеді. Неліктен?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Металл неден тұрады?","- Қызу бөлшектердің қозғалысына қалай әсер етеді?","- Кедергі дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"3–5","name":"2. Мақсат қою","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"5–17","name":"3. Жаңа материалды меңгеру","tch":["**Scaffold оқыту әдісі:** жұппен жұмыс + деректерді талдау.","Жұптар металл кедергісінің температураға тәуелділік графигін, электролиз сызбасын және қысқа тұйықталу себептерін талдайды.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – жазбалары бар график және сызба, көмекші сұрақтар;","- **2-саты «Кеңес»** – жазбасыз график және сызба;","- **3-саты «Өздігінен»** – қысқа тұйықталудың себептері мен алдын алу тәсілдерін өздері түсіндіреді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Металдар кедергісінің температурамен артуын түсіндіреді","Ерітінділердегі токты (электролиз) сипаттайды","Қысқа тұйықталудың себептерін және қорғанысты (сақтандырғыштар) атайды","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["карточкалардағы график және сызбалар, БЖБ нұсқаларының карточкалары, калькулятор"]},{"tm":"17–20","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Температура артқанда металдардың кедергісі артады: тор иондары электрондардың қозғалысына көбірек кедергі келтіреді","- Ерітінділерде токты оң және теріс иондар тудырады; электролиз кезіндегі зат массасы m = k·I·t (Фарадей заңы)","- Қысқа тұйықталу – тізбек нүктелерінің аз кедергімен қосылуы; қорғаныс – сақтандырғыштар, автоматтар, дұрыс оқшаулау"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"20–40","name":"5. Бөлім бойынша жиынтық бағалау (БЖБ)","tch":["Бөлім бойынша жиынтық бағалауды ұйымдастырады (20 мин, жеке, 4 тапсырма, ең жоғары балл – 10). БЖБ тапсырмалары – қосымшада. Бұл кезеңде тіректер алынады."],"stu":["БЖБ тапсырмаларын өздігінен, кеңессіз орындайды."],"ass":["**Жиынтық.** Дескрипторлар бойынша балл (қосымша)."],"res":["БЖБ нұсқаларының карточкалары","Калькулятор","Шамалар кестелері"]},{"tm":"40–43","name":"6. Өзін-өзі тексеру. Үй тапсырмасы","tch":["Эталон мен критерийлерді таратады; оқушылар жауаптарын тексеріп, қателерін белгілейді. Баллды келесі сабақта хабарлайды.","**Үй тапсырмасы:** «Магнит өрісі» параграфы; екі магнит және темір қыстырғыштар алып келу."],"stu":["Жауаптарын эталонмен салыстырып, қателерін белгілейді.","Үй тапсырмасын жазады."],"ass":["**Өзін-өзі бағалау** эталон бойынша."],"res":["Жауап эталоны","Критерийлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Металл өткізгіштердегі электр тогын және оның кедергісінің температураға тәуелділігін сипаттау."],["Тақырыбы","Металдардағы кедергінің температураға тәуелділігі. Электрқыздырғыш құралдар. Токтың химиялық әсері. «Тұрақты электр тогы» бөлімі бойынша БЖБ № 5"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","карточкалардағы график және сызбалар, БЖБ нұсқаларының карточкалары, калькулятор"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","шамдардың күйіп кетуі, қыздырғыш аспаптар, гальваника, сымдарды қорғау"],[  тілі Жердің магнит өрісіне бағытталады"],"tk":[["Екі магниттің аттас полюстері қалай әрекеттеседі?","Тебіледі"],["Магнитті екіге бөлсе, не шығады?","Екі магнит, әрқайсысында N және S полюстері бар"],["Жолақ магнит өрісінің сызықтарын сызыңыз.","Магниттің сыртында – N-нен S-ке, сызықтар тұйық"],["Компас тілі неге солтүстікті көрсетеді?","Жер – магнит, тіл оның магнит өрісіне бағытталады"]],"hw":"№ 8 ЗЖ қорытындысын рәсімдеу; «Тогы бар өткізгіштің магнит өрісі» параграфы","res":"жолақ және доға тәрізді магниттер, темір үгінділері, компас, қағаз парағы, қыстырғыштар","live":"компас, магнитті құлыптар, құлаққаптың динамиктері","tb":"темір үгінділерін аузға салмау, көзге жақындатпау; магниттерді түсірмеу","cr":["Магниттердің негізгі қасиеттерін сипаттайды","Магнит өрісін күш сызықтарымен графикалық бейнелейді","Бақылауларды жазып, қорытынды жасайды","Қауіпсіздік техникасын сақтайды"],"sec":"8.3 В Электрмагниттік құбылыстар (3 с)","goals":[{"c":"8.4.3.1","t":"магниттердің негізгі қасиеттеріне сипаттама беру және магнит өрісін күш сызықтары арқылы бейнелеу"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Тәжірибе арқылы оқу (EntreComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Компастың тілі әрқашан солтүстікті көрсетеді. Оған не әсер етеді?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Қандай заттар магнитке тартылады?","- Өріс дегеніміз не?","- Денелердің әрекеттесуі дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): темір үгінділерін аузға салмау, көзге жақындатпау; магниттерді түсірмеу."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс: магниттердің әрекеттесуін, заттардың тартылуын зерттеп, темір үгінділері мен компас көмегімен жолақ магнит өрісінің суретін алады.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – қадамдық нұсқаулық және үлгісі бар «зат – тартылады/тартылмайды» кестесі;","- **2-саты «Кеңес»** – кейбір қадамдары жоқ жоспар, үлгісіз кесте;","- **3-саты «Өздігінен»** – зерттеуді өздері жоспарлап, өріс суретін түсіндіреді.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Магнит полюстерін, аттас және әртүрлі аттас полюстердің әрекеттесуін анықтайды","Үгінділер мен компас көмегімен өріс сызықтарының суретін алады","Магнит өрісінің сызықтарын сызады","Қиындық туғанда кеңес сұрайды, сенімді болғанда келесі сатыға өтеді."],"ass":["**Қалыптастырушы.** Чек-парақ бойынша «Бақылау» әдісі:","- тапсырма жоспар бойынша орындалады;","- жазбалардың дұрыстығы және ҚТ сақталуы;","- топ жұмысына қатысу.","Педагогтің ауызша кері байланысы."],"res":["жолақ және доға тәрізді магниттер, темір үгінділері, компас, қағаз парағы, қыстырғыштар"]},{"tm":"25–30","name":"4. Жинақтау. Қорытынды","tch":["Топтар нәтижелерін талқылауды ұйымдастырады (баяндамашылар сөйлейді). Қорытындыға жетелейді:","- Магниттің екі полюсі бар – солтүстік N және оңтүстік S; аттас полюстер тебіледі, әртүрлі аттас полюстер тартылады","- Магнит өрісін сызықтармен бейнелейді: магниттің сыртында олар N-нен S-ке бағытталған, тұйық","- Жер – магнит, сондықтан компас тілі Жердің магнит өрісіне бағытталады"],"stu":["Топтардың нәтижелерін салыстырып, қорытынды жасайды.","Қорытындыны сабақ басындағы гипотезамен салыстырады.","Қорытындыны дәптерге жазады."],"ass":["**Қалыптастырушы.** «Оқу сұрақтары» әдісі: түсіндіру және болжау сұрақтары."],"res":["Слайд","Оқулық: Б.А. Кронгарт, Ш.Б. Насохова, «Физика», 8-сынып"]},{"tm":"30–40","name":"5. Қолдану. Қолдауды біртіндеп алып тастай отырып есептер шығару","tch":["Алгоритм: «Берілгені – СИ – Формула – Есептеу – Жауабы» (сапалық есептер үшін: «Бақылау – Түсіндіру – Қорытынды»). Тірек біртіндеп алынады:","**«Мен істеймін»** (2 мин) – үлгіні талдайды (1-есеп).","**«Біз бірге істейміз»** (3 мин) – 2-есеп, бос орындары бар алгоритм-карточка бойынша.","**«Сендер жұппен істейсіңдер»** (3 мин) – 3-есеп (А/В/С деңгейлері).","**«Сен өзің істейсің»** (2 мин) – 4-есеп, тірексіз; уақыт жетпесе үй тапсырмасына ауысады.","Есептер – қосымшада."],"stu":["Үлгіні қадағалап, алгоритм қадамдарын айтады.","Бірге, содан кейін жұппен шығарады; есеп деңгейін таңдайды, келесі деңгейге өте алады.","4-есепті өздігінен шығарады.","Жауаптарын эталон бойынша тексереді."],"ass":["**Қалыптастырушы.** Эталон бойынша өзін-өзі тексеру; бақылау.","Дескрипторлар – қосымшада."],"res":["Алгоритм-карточка","А/В/С есеп карточкалары","Жауап эталоны"]},{"tm":"40–43","name":"6. Өзара бағалау. Үй тапсырмасы","tch":["**Scaffold бағалау әдісі – «Құрдастардың кері байланысы»:** топтар жұмыстарымен (жазбалар, шешімдер) алмасып, чек-парақ бойынша «Екі жұлдыз және бір тілек» әдісімен бағалайды.","**Үй тапсырмасы** (таңдау бойынша):","- барлығы: № 8 ЗЖ қорытындысын рәсімдеу; «Тогы бар өткізгіштің магнит өрісі» параграфы;","- қалауы бойынша: сабақ тақырыбы бойынша қысқа хабарлама дайындау."],"stu":["Сыныптастардың жұмыстарын оқып, екі сәттілік пен бір тілек айтады.","Үй тапсырмасын жазып, деңгейін таңдайды."],"ass":["**Қалыптастырушы.** Өзара бағалау: «Екі жұлдыз және бір тілек»."],"res":["Бағалау чек-парағы","Стикерлер"]},{"tm":"43–45","name":"7. Рефлексия","tch":["**Scaffold бағалау әдісі – «Өзін-өзі талдау».** Сұрақтарға жауап беруді ұсынады:","- Менде не жақсы шықты?","- Не қиындық туғызды?","- Нәтижені жақсарту үшін не істеймін?","Мақсатты меңгеру деңгейін «Бағдаршам» шкаласында белгілеуді сұрайды."],"stu":["Өзін-өзі бағалау парағын толтырады.","«Бағдаршам» шкаласында белгілейді: толық түсіндім / сұрақтарым бар / көмек керек."],"ass":["**Өзін-өзі бағалау** табыс критерийлері бойынша."],"res":["Өзін-өзі бағалау парағы","«Бағдаршам» шкаласы"]}],"pass":[["Ұзақтығы","1 сабақ, 45 минут"],["Мақсаты","Магниттердің негізгі қасиеттеріне сипаттама беру және магнит өрісін күш сызықтары арқылы бейнелеу."],["Тақырыбы","Тұрақты магниттер. Магнит өрісі. № 8 ЗЖ «Тұрақты магниттің қасиеттерін зерттеу және магнит өрістерінің кескінін алу»"],["Мақсатты аудитория","Музыкалық мектеп-интернаттың 8-сыныбы; 4 оқушыдан тұратын топтармен жұмыс"],["Қажеттіліктері","Көрнекі тірек (сызбалар, графиктер, карточкалар); сыныптың бір бөлігіне қосымша уақыт және қадамдық нұсқаулық; қолдау сатысын таңдау. Ерекше білім беру қажеттіліктері бар оқушыларға – 1-саты, ірі қаріп, жеке қарқын."],["Ресурстар","жолақ және доға тәрізді магниттер, темір үгінділері, компас, қағаз парағы, қыстырғыштар"],["Орны","Физика кабинеті"],["Нақты өмірмен байланыс","компас, магнитті құлыптар, құлаққаптың динамиктері"],["№ 1 «Құзыреттілікті таңдаңыз»",["**g.9** Зерттеушілік ойлау (GreenComp)","**l.6** Ынтымақтастық (LifeComp)","**e.15** Тәжірибе арқылы оқу (EntreComp)"]],["№ 2 «Құзыреттілік деңгейін анықтаңыз»","Сабақ басында «Оқу сұрақтары» әдісімен диагностика; нәтиже бойынша қолдау сатысы таңдалады."],["№ 3 «Оқыту әдісін таңдаңыз»","Ынтымақтастықта оқыту + зертханалық жұмыс."],["№ 4 «Күтілетін нәтижелер»","Топтар мен жеке оқушылардың табыс критерийлері бойынша нәтижесі (3-қосымша); шығарылған есептер; өзін-өзі бағалау парағы."],["№ 5 «Бағалау әдісін таңдаңыз»","Басында – «Оқу сұрақтары»; барысында – «Бақылау»; соңында – «Құрдастардың кері байланысы» және «Өзін-өзі талдау»."],["Қолдау қағидаты","«Мен істеймін» → «Біз бірге істейміз» → «Сендер жұппен істейсіңдер» → «Сен өзің істейсің»; негізгі әрекетте қолдаудың үш сатысы."]],"lev":["барлық дескриптор – жоғары","бір бөлігі – орта","0–1 – бастапқы"]},"25":{"kind":"lab","t":"Тогы бар түзу өткізгіштің және шарғының магнит өрісі. Электрмагниттер және оларды қолдану. № 9 ЗЖ «Электрмагнитті құрастыру және оның әрекетін зерттеу»","hook":"Қоқыс алаңындағы көтергіш кран тонналап темірді көтеріп, ажыратқышты басқанда жіберіп жібереді. Бұл қалай мүмкін?","dq":["Магниттің қандай қасиеттері бар?","Полюстер қалай әрекеттеседі?","Электр тогы дегеніміз не?"],"m":"ынтымақтастықта оқыту + зертханалық жұмыс","act":"Зертханалық жұмыс: электрмагнитті (өзекшесі бар шарғы және ток көзі) құрастырып, полюстерін бұрғы ережесімен анықтап, электрмагниттің әрекеті ток күшіне, орам санына және өзекшеге қалай тәуелді екенін зерттейді.","t1":"қадамдық нұсқаулық, сызба және жазу үлгісі бар кесте","t2":"кейбір қадамдары жоқ жоспар, үлгісіз кесте","t3":"электрмагнит әрекетінің тәуелділігін зерттеуді өздері жоспарлайды","s":["Электрмагнитті құрастырып, оның әрекетін тексереді","Өріс сызықтарының бағытын бұрғы ережесімен анықтайды","Шарғының өрісін жолақ магниттің өрісімен салыстырады"],"con":["Тогы бар өткізгіштің айналасында магнит өрісі бар (Эрстед тәжірибесі); сызықтардың бағыты – бұрғы ережесі бойынша","Тогы бар шарғы (соленоид) жолақ магнит өрісіне ұқсас өріс тудырады","Электрмагниттің әрекетін ток күшін, орам санын арттыру және темір өзекше енгізу арқылы күшейтеді"],"tk":[["Тогы бар түзу өткізгіш айналасындағы магнит өрісі сызықтарының бағытын қалай анықтайды?","Бұрғы ережесі бойынша"],["Электрмагнитті күшейтудің үш тәсілін атаңыз.","Ток күшін, орам санын арттыру, темір өзекше енгізу"],["Электрмагниттер қайда қолданылады?","Көтергіш крандар, электр қоңыраулары, реле, медициналық аппараттар"],["Тогы бар шарғы мен жолақ магниттің магнит өрісін салыстырыңыз.","Ұқсас: N және S полюстері бар; шарғының өрісін қосуға және өзгертуге болады"]],"hw":"№ 9 ЗЖ қорытындысын рәсімдеу; «Магнит өрісінің токқа әсері» параграфы","res":"шарғы, темір өзекше, ток көзі, кілт, реостат, қыстырғыштар, компас","live":"электр қоңырауы, көтергіш кран, динамиктер","tb":"көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру; тогы бар шарғыны ұзақ қосып қалдырмау (қызады)","cr":["Магнит өрісінің қасиеттерін түсіндіреді, өткізгіш пен соленоид айналасындағы өріс сызықтарының бағытын анықтайды","Жолақ магнит пен соленоидтың магнит өрістерін салыстырады","Электрмагнитті құрастырып, оның әрекетін зерттейді","Қауіпсіздік техникасын сақтайды"],"sec":"8.3 В Электрмагниттік құбылыстар (3 с)","goals":[{"c":"8.4.3.2","t":"магнит өрісінің сипаттамаларын түсіндіру"},{"c":"8.4.3.3","t":"тогы бар түзу өткізгіштің және соленоидтің айналасындағы өріс сызықтарының бағытын анықтау"},{"c":"8.4.3.4","t":"жолақ магнит пен соленоидтың магнит өрістерін салыстыру"},{"c":"8.1.3.3","t":"физика кабинетінде қауіпсіздік ережелерін білу және сақтау"}],"compN":["Зерттеушілік ойлау (GreenComp)","Ынтымақтастық (LifeComp)","Тәжірибе арқылы оқу (EntreComp)"],"stages":[{"tm":"0–5","name":"1. Сабақтың басы. Диагностика","tch":["Оқушылармен амандасады, сабаққа дайындығын тексереді.","**Мотивация.** Қоқыс алаңындағы көтергіш кран тонналап темірді көтеріп, ажыратқышты басқанда жіберіп жібереді. Бұл қалай мүмкін?","**Бастапқы деңгейді диагностикалау** («Құзыреттілік деңгейін анықтаңыз» Scaffold карточкасы, «Оқу сұрақтары» әдісі):","- Магниттің қандай қасиеттері бар?","- Полюстер қалай әрекеттеседі?","- Электр тогы дегеніміз не?","Нәтиже бойынша әр топқа қолдау сатысын (1, 2 немесе 3) анықтайды. Дайындық деңгейі әртүрлі 4 оқушыдан топ құрады."],"stu":["Мотивациялық сұрақтарға жауап беріп, гипотеза айтады.","Диагностикалық тапсырмаларды орындайды.","Топқа бірігіп, рөлдерді бөледі: ұйымдастырушы, орындаушы, тіркеуші, баяндамашы."],"ass":["**Диагностикалық.** «Оқу сұрақтары» әдісі.","Нәтиже бақылау парағына жазылады: барлық жауап дұрыс – жоғары деңгей, бір бөлігі – орта, аз бөлігі – бастапқы деңгей."],"res":["Слайд","Сұрақ карточкалары / Quizizz","Бақылау парағы"]},{"tm":"5–8","name":"2. Мақсат қою. Қауіпсіздік техникасы","tch":["Гипотезалар мен диагностика нәтижесі бойынша сабақтың тақырыбы мен мақсатын тұжырымдауды ұсынады.","Табыс критерийлерімен («Мен ... аламын» чек-парағы) таныстырады.","**Қауіпсіздік техникасы** (8.1.3.3): көз кернеуі 6 В-тан аспауы тиіс; тізбекті тек педагог тексергеннен кейін қосу; сымдардың жалаңаш ұштарына тимеу; жұмыс соңында көзді өшіру; тогы бар шарғыны ұзақ қосып қалдырмау (қызады)."],"stu":["Сабақтың тақырыбы мен мақсатын өз сөздерімен тұжырымдайды.","Табыс критерийлерін оқиды."],"ass":["**Қалыптастырушы.** Бақылау; «Үлкен саусақ» тәсілі – жұмысқа дайындық."],"res":["Тақырып пен критерийлері бар слайд"]},{"tm":"8–25","name":"3. Зертханалық жұмыс","tch":["**Scaffold оқыту әдісі:** ынтымақтастықта оқыту + зертханалық жұмыс.","Зертханалық жұмыс: электрмагнитті (өзекшесі бар шарғы және ток көзі) құрастырып, полюстерін бұрғы ережесімен анықтап, электрмагниттің әрекеті ток күшіне, орам санына және өзекшеге қалай тәуелді екенін зерттейді.","**Қолдаудың үш сатысы** (қосымша):","- **1-саты «Тірек»** – қадамдық нұсқаулық, сызба және жазу үлгісі бар кесте;","- **2-саты «Кеңес»** – кейбір қадамдары жоқ жоспар, үлгісіз кесте;","- **3-саты «Өздігінен»** – электрмагнит әрекетінің тәуелділігін зерттеуді өздері жоспарлайды.","«Алдымен сұрақ, содан кейін кеңес» ережесі бойынша кеңес береді."],"stu":["Электрмагнитті құрастырып, оның әрекетін тексереді","Өріс сызықтарының бағытын бұрғы ережесі
